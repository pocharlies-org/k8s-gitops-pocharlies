apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopify-label
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies/k8s-shopify-label-pocharlies
  labels:
    e-dani.com/portfolio: skirmshop
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies/k8s-shopify-label-pocharlies
    targetRevision: deploy/prod
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: skirmshop
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # ConfigMaps mutated at runtime (admin Tarifas UI, weekly VAT sync
  # CronJob). Argo keeps the seed shape from the manifest but ignores
  # `data` and the per-edit annotations so self-heal doesn't roll back a
  # legitimate live update.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: labels-cex-surcharges
      jsonPointers:
        - /data
        - /metadata/annotations/skirmshop.labels~1last-edit-at
        - /metadata/annotations/skirmshop.labels~1fuel-history
    - group: ""
      kind: ConfigMap
      name: labels-vat-rates
      jsonPointers:
        - /data
        - /metadata/annotations/skirmshop.labels~1synced-at
        - /metadata/annotations/skirmshop.labels~1source
