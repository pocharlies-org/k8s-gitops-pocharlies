apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oficinas
  namespace: argocd
  labels:
    e-dani.com/tier: app
    app.kubernetes.io/part-of: company
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/oficinas-pocharlies
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: oficinas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
