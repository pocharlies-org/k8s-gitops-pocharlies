apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synapse-migrations
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-synapse-pocharlies
  labels:
    e-dani.com/tier: app
    app.kubernetes.io/part-of: synapse
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-synapse-pocharlies
    targetRevision: deploy/prod
    path: k8s/migrations
  destination:
    server: https://kubernetes.default.svc
    namespace: synapse
  # Manual on purpose. A migration sync is an R3 operation with explicit
  # checksum/ledger verification; it never follows the fabric replica drift.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
