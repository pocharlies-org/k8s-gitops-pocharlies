apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synapse-sre-foundation
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-synapse-pocharlies
  labels:
    e-dani.com/tier: app
    app.kubernetes.io/part-of: synapse
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-synapse-pocharlies
    targetRevision: deploy/prod
    path: k8s/sre-foundation
  destination:
    server: https://kubernetes.default.svc
    namespace: synapse
  # Manual until the 14-day shadow gate and dedicated credential verification
  # are complete. The foundation is safe to sync only while replicas remain 0
  # and the weekly CronJob remains suspended.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
