# INFRA-710 (P1 de INFRA-701). Igual que argocd/application.yaml de k8s-frigate-pocharlies (R4).
# `prune: true`, a diferencia de las apps normales: las NetworkPolicy suman y una regla quitada de git debe
# desaparecer. Lo irrecuperable queda fuera del prune: los PVC llevan Prune=false,Delete=false, el Secret de MQTT
# tiene deletionPolicy Retain y el namespace lo crea CreateNamespace=true, que ArgoCD no rastrea.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frigate
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-frigate-pocharlies
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-frigate-pocharlies
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: frigate
  # SC-2571: el arbiter aparca frigate (scale 0) mientras entrena el LoRA en la RTX y lo restaura al
  # soltar el lease. Sin esto selfHeal devuelve /spec/replicas a 1 a mitad del entreno y frigate
  # disputa VRAM al trainer. Mismo patron que las apps ai y comfyui.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: frigate
      namespace: frigate
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Sin esto ignoreDifferences solo oculta el diff: un sync por otro motivo reaplicaría replicas: 1
      # y pisaría el park a mitad del entreno (igual que ai y comfyui).
      - RespectIgnoreDifferences=true
