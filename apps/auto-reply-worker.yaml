apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auto-reply-worker
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-auto-reply-worker-pocharlies
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-auto-reply-worker-pocharlies
    targetRevision: deploy/prod
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: whatsapp-mcp
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  # Note: ignoreDifferences for the auto-reply-config ConfigMap /data is added by
  # a targeted patch in the root kustomization.yaml (the global patch there sets
  # /spec/ignoreDifferences for every Application, so it must be appended there).
