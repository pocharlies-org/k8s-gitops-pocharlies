apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auto-reply-worker
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-auto-reply-worker-pocharlies
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-auto-reply-worker-pocharlies
    targetRevision: deploy/prod
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: whatsapp-mcp
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  # The chart ships the auto-reply-config ConfigMap with an empty rule set as a
  # bootstrap default, but the rules are managed at runtime via the dashboard
  # (which patches the live ConfigMap). Ignore its data so Argo's self-heal does
  # not revert rules edited from the control UI.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: auto-reply-config
      namespace: whatsapp-mcp
      jsonPointers:
        - /data
