apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: picqer-mcp
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-picqer-mcp-pocharlies
  labels:
    e-dani.com/tier: app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-picqer-mcp-pocharlies
    targetRevision: deploy/prod
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: picqer-mcp
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
