# DGX-689 (H7 de DGX-680): laboratorio de dgx3, FUERA del arbitro de computo (autorizacion del CTO en DGX-689).
# Es una Application aparte de `ai` a proposito: las de `ai` llevan los hooks que pausan el arbitro
# (llm-deploy-pause/resume) y renderizan `k8s/`; esta no lleva hooks y renderiza solo `lab/`.
#
# Se enciende y se apaga SOLO por PR de gitops (opcion (b)): sin `ignoreDifferences` de /spec/replicas, asi que
# selfHeal revierte cualquier `kubectl scale`, y el panel rechaza POST /api/activity/{id}/power sobre `ai-lab`.
# El SHA es el de FUSION del PR de k8s-ai-pocharlies que cambia `lab/`: un cambio del laboratorio es un PR AQUI,
# nunca solo un merge alli (no sigue `main`).
#
# DGX-690 (H8): `lab/` lleva la receta de un Spark de MiaAI-Lab en DOS FASES. A: el Job `qwen38-lab-prepare` (sin GPU:
# descarga, verifica, parches contra la imagen, tabla PLE), hecha en el SHA 19a0591f. B: el Deployment `qwen38-lab` (desde el
# SHA 99e10cd0, k8s-ai-pocharlies#120, por decision de Dani); se enciende y se apaga por PR, nunca `kubectl scale`.
#
# ESTADO ACTUAL (DGX-759, k8s-ai-pocharlies#134, SHA 08d44ce8): el lab arranca con el brazo `hybrid` (el checkpoint FP8 de
# produccion: FP8 por bloques en atencion y GDN, que la imagen `fc120ece` carga con la edicion `FP8_PB_WO` de #129;
# `replicas: 1`) con KV de 13 GiB (`--kv-cache-memory-bytes`), el vigilante de memoria de serve.sh cortando con
# `MemAvailable < 3 GiB` durante 5 lecturas y el MTP de MiaAI: calendario `[[1,4,3],[5,8,1]]` (k=3 a 1-4 peticiones, k=1 a
# 5-8), borrador `greedy`, reduccion argmax y vocabulario de 47.172 ids. Los pesos del `hybrid` se leen de su copia local en
# el NVMe de dgx3 (`/srv/ai-lab/models/qwen38fn-mtp-nvidia-fp8-hybrid-7b719225`, `/lab/models/...` en el pod), ya no por
# NFS-RDMA desde dgx1 (el worker del residente); la tabla PLE del hibrido tambien esta en el NVMe (Job sin GPU
# `qwen38-lab-prepare-hybrid`). El NFS de solo lectura `hf-cache-dgx1-lab-ro` (servidor 10.0.2.1; el export es INFRA-785)
# sigue declarado y montado como respaldo: el motor ya no lee pesos por el, solo ese Job. El motor no lleva guard del SAI
# (UPS_GUARD=0: dgx3 esta fuera del SAI). El primer arranque del `hybrid` con la edicion `FP8_PB_WO` no esta medido en GPU.
#
# MARCHA ATRAS (una sola): un PR que devuelve `targetRevision` a 727480919155d5335941f95b816c5f51b5830dff (el `hybrid` con los
# pesos por NFS-RDMA desde dgx1) o a 19a0591fb48ded74d2f116ee2b93439140247404 (apagado, `replicas: 0`). Apagar no borra nada
# mas: el Job de la fase A, la copia local y el hostPath siguen como estan.
#
# prune: true es seguro en este namespace: solo hay cargas del laboratorio y el PVC `hf-cache-dgx1-lab-ro` con su PV (NFS de solo
# lectura desde dgx1, `Retain`), que viajan con la app: un prune los retira sin perder datos (el NFS es de dgx1, el PV es
# Retain y los datos del hostPath, /srv/ai-lab en dgx3, no los toca Argo). El Namespace lleva Prune=false.
#
# RETIRADA, en dos pasos:
#  1. PR que vacia `lab/`: esta app (prune: true) retira la carga (Job y Deployment). Deja el Namespace y el hostPath, y la Application.
#  2. Retirar la Application misma: PR que borra este fichero y su linea en `kustomization.yaml`, MAS la poda
#     acotada de `root` sobre `Application/ai-lab` (`operation.sync.prune: true` + `resources`, patron de
#     ARCHITECTURE.md §5, precedente `hermes-despliegue poda`). `root` tiene prune: false: sin esa poda, borrar el
#     fichero deja la Application para siempre. El finalizer arrastra el Pod y el Namespace, NO el hostPath
#     (/srv/ai-lab). Nunca `kubectl delete application`, ni `prune` global.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-lab
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-ai-pocharlies
  labels:
    e-dani.com/tier: app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-ai-pocharlies
    targetRevision: 08d44ce8b18becae91235eb40783bf76e92abb45
    path: lab
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
