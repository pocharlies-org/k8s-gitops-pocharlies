# DGX-689 (H7 de DGX-680): laboratorio de dgx3, FUERA del arbitro de computo (autorizacion del CTO en DGX-689).
# Es una Application aparte de `ai` a proposito: las de `ai` llevan los hooks que pausan el arbitro
# (llm-deploy-pause/resume) y renderizan `k8s/`; esta no lleva hooks y renderiza solo `lab/`.
#
# Se enciende y se apaga SOLO por PR de gitops (opcion (b)): sin `ignoreDifferences` de /spec/replicas, asi que
# selfHeal revierte cualquier `kubectl scale`, y el panel rechaza POST /api/activity/{id}/power sobre `ai-lab`.
# El SHA es el de FUSION del PR de k8s-ai-pocharlies que cambia `lab/`: un cambio del laboratorio es un PR AQUI,
# nunca solo un merge alli (no sigue `main`).
#
# DGX-690 (H8): `lab/` lleva la receta de un Spark de MiaAI-Lab en DOS FASES. A: el Job `qwen38-lab-prepare` (sin GPU:
# descarga, verifica, parches contra la imagen, tabla PLE); ya hecha (SHA 19a0591f). B: el Deployment `qwen38-lab` con
# `replicas: 1` desde el SHA 99e10cd0 (k8s-ai-pocharlies#120), encendida por decision de Dani; el motor lleva el vigilante de
# memoria y del SAI (serve.sh) y se enciende y apaga por PR, nunca `kubectl scale`.
# ESTADO ACTUAL (DGX-745, k8s-ai-pocharlies#127, SHA ab24d560): el lab arranca con el brazo hybrid (`launch-revision
# dgx745-hybrid-nfs`, `replicas: 1`). Los pesos del residente se leen por NFS-RDMA desde dgx1 (PV/PVC de solo lectura
# `hf-cache-dgx1-lab-ro`, servidor 10.0.2.1; el export es INFRA-785) y la tabla PLE se construye en el NVMe de dgx3 con el
# Job sin GPU `qwen38-lab-prepare-hybrid`; el motor no arranca hasta que el Job deja la marca READY. Sigue sin guard del SAI
# (UPS_GUARD=0: dgx3 esta fuera del SAI) y con el vigilante de memoria. Se apaga con un PR que devuelve `targetRevision` a
# 19a0591fb48ded74d2f116ee2b93439140247404 (replicas 0); 3b79a2b03d6093092a284a6d0355da369431e5d8 es el lab anterior (brazo
# nvfp4, replicas 1, sin NFS).
# El apagado (fase B hacia atras) no borra nada mas: el Job de la fase A y el hostPath siguen como estan. Marcha atras de la fase A: un PR que
# devuelve `targetRevision` a d8a32d7c130ce98655e9e442096df6e6a93bc480 (el prune retira el Job y el Deployment; el
# hostPath no se toca).
#
# prune: true es seguro en este namespace: solo hay cargas del laboratorio y el PVC `hf-cache-dgx1-lab-ro` con su PV (NFS de solo
# lectura desde dgx1, `Retain`), que viajan con la app: un prune los retira sin perder datos (el NFS es de dgx1, el PV es
# Retain y los datos del hostPath, /srv/ai-lab en dgx3, no los toca Argo). El Namespace lleva Prune=false.
#
# RETIRADA, en dos pasos:
#  1. PR que vacia `lab/`: esta app (prune: true) retira la carga (Job y Deployment). Deja el Namespace y el hostPath, y la Application.
#  2. Retirar la Application misma: PR que borra este fichero y su linea en `kustomization.yaml`, MAS la poda
#     acotada de `root` sobre `Application/ai-lab` (`operation.sync.prune: true` + `resources`, patron de
#     ARCHITECTURE.md §5, precedente `hermes-despliegue poda`). `root` tiene prune: false: sin esa poda, borrar el
#     fichero deja la Application para siempre. El finalizer arrastra el Pod y el Namespace, NO el hostPath
#     (/srv/ai-lab). Nunca `kubectl delete application`, ni `prune` global.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-lab
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-ai-pocharlies
  labels:
    e-dani.com/tier: app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-ai-pocharlies
    targetRevision: ab24d5609152148419b0aa301984dfb8c6093cf9
    path: lab
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
