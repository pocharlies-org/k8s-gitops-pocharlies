apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inmobiliarias-proposal
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/inmobiliarias-proposal
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/inmobiliarias-proposal
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik-edge
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
