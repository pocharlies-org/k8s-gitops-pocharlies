apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Owner approval requested 2026-07-25 for the cumulative 6c97de4 rollout.
    # Live 6a7e9d3 predates d520db09 by nine hours, so "history openclaw
    # pooling" (@oppocharliesbot) still runs requireMention false with
    # historyLimit 30 in Pocharlies Operations. On 2026-07-25T07:11Z a single
    # main-lane turn there repeated the Telegram send tool 20 times against
    # message 815 with zero inbound updates, ending only on an operator /stop
    # after 194s. Cumulative scope: 19e3b256 drops dense-uncensored (the model
    # that ran the loop) from all planes, d520db09 restores the mention gate,
    # and fae6f30c/e0b3f0e6/6c97de43 move the self-update token to Vault.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: 6c97de432a9e6041dec8c98a25cabd799083bb8f
    operations.pocharlies.org/approval-id: openclaw-require-mention-6c97de4
    operations.pocharlies.org/approval-sequence: "20260725092414"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
