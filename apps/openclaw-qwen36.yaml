apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Approve revision e4ac15b: registers the openclaw-self-update plugin in the runtime
    # config so /of-update, /of-update-preview and /of-update-info actually exist. The
    # plugin was already baked into the image and seeded by the entrypoint
    # (/data/extensions/openclaw-self-update is present live with index.js,
    # openclaw.plugin.json and package.json) and its PAT was already wired, but it was
    # declared in neither plugins.load.paths, allow nor entries, and bundledDiscovery
    # "compat" does not load an undeclared extensions dir. Same three-list fix as the
    # codex-auth registration (248b775), applied to the Helm runtime config and its
    # byte-identical mirror; scripts/validate.sh passes (534 pytest + 103 post-promotion
    # regression). Config-only delta on top of the already-live mac-reminders-v3 image:
    # only the openclaw ConfigMap and the Deployment checksum are OutOfSync, so this does
    # not re-trigger the post-core-update plugin repair. Prune stays false.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: e4ac15bd8d2bfe5f71c9aaff88ca69f010b18ac5
    operations.pocharlies.org/approval-id: of-update-register-e4ac15b-20260727202100
    operations.pocharlies.org/approval-sequence: "20260727202100"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
