apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Approve config-only revision b7c97d6 (k8s-openclaw-qwen36-pocharlies
    # deploy/prod): repoint the dgx-audio omnivoice TTS provider + egress
    # NetworkPolicy from the retired dgx-call-agent.dgx-call-agent.svc:8788
    # (namespace gone) to the moved OmniVoice audio gateway
    # omnivoice-audio.llm.svc:8000 (DGX1, DGX1->DGX2 failover). The iOS app
    # was falling back to the on-device Apple voice because gateway TTS could
    # not reach the dead endpoint. Same core/image 2026.7.1-3; rendered
    # b7c97d6 config validated against the pinned binary in the readonly pod
    # (only the known-false plugin-path diagnostics; no schema delta) and a
    # live POST /audio/tts voice_id=leila_clean_16s -> 200 opus.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: b7c97d6530b58daa50c106c5bc645c6483de401a
    operations.pocharlies.org/approval-id: omnivoice-audio-endpoint-fix-b7c97d6
    operations.pocharlies.org/approval-sequence: "20260723131156"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
