apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Approve revision bff62a1: new ConfigMap-seeded plugin `voice-switcher`
    # (tool set_speaker) + bundled skill so any agent can switch the active TTS
    # persona at runtime (persistent messages.tts prefs at /data/settings/tts.json
    # for Listen/voice notes; the skill also emits the Talk voice directive).
    # Speakers Leila/Daniel/Lambrini. Adds a seed initContainer + configmap,
    # messages.tts.prefsPath, plugins.allow/entries/load.paths, and set_speaker
    # to skirmshop.tools.allow + local.tools.alsoAllow. CARRIES the pending
    # trunk ancestors 09aa6dd (ornith+dense -> single 'local' agent) and
    # 80285ed (enable brain-memory, allowlist llm-task) — deploying the tip
    # deploys them too. Rendered bff62a1 config validated against the pinned
    # 2026.7.1-3 binary (only known-false plugin-path diagnostics); helm renders
    # the seed-voice-switcher-plugin initContainer; plugin node --check + tests pass.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: bff62a1ccf189ca85c5b684bd0818ca419213fd5
    operations.pocharlies.org/approval-id: voice-switcher-skill-bff62a1
    operations.pocharlies.org/approval-sequence: "20260723153342"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
