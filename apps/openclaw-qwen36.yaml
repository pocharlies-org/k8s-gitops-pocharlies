apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # APPROVAL OPEN for eda322c, the reviewed deploy/prod merge of PR #259.
    # The change declares the already-tested Correos matriz fuel automation in the
    # chart. A postStart hook reconciles it through Gateway RPC by declarationKey, so
    # retained or restored state converges without duplicate cron jobs. The desired
    # contract keeps the 09:05 Europe/Madrid schedule, skirmshop agent, GPT-5.6 Sol,
    # full inherited tools (including Gmail), no routine delivery, and one-day
    # failure alerts to the etiquetas topic. The prompt rejects Correos Express and
    # fiscal recargo de equivalencia, requires current-month primary evidence, edits
    # only Labels GitOps through a Codex subagent, and verifies the live value before
    # reporting. PR validation passed, including 539 repository tests and 103
    # promotion-regression tests. The same merge also repairs the pre-existing
    # four-entry dgx_video_list_engines mismatch between the canonical and Helm
    # runtime configs. Previous operation is terminal (Succeeded, sequence
    # 20260728000455), and the lease was inactive before opening this newer bundle.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: eda322ced112f19eba4045655d6bd0b5d19db0b0
    operations.pocharlies.org/approval-id: codex-correos-fuel-cron-eda322c-20260728122020
    operations.pocharlies.org/approval-sequence: "20260728122020"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
