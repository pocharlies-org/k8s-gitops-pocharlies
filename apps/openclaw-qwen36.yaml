apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # APPROVAL OPEN para d35e198: OpenClaw deja de pedir `qwen36-35b-tooling` y
    # pide `tooling-ha`. Ese alias es uno de los nueve del RESIDENTE de tooling en
    # el LiteLLM central, asi que lo servia DeepSeek-V4-Flash mientras el nombre
    # decia Qwen3.6 35B. `tooling-ha` nombra la CAPACIDAD, no el modelo, y lo
    # resuelve el hook del central contra el model_list vivo.
    #
    # Riesgo acotado a proposito: NO se toca ningun `primary: litellm/dense`, solo
    # el fallback, asi que el modelo que atiende es el mismo en los dos perfiles
    # de residente. Es una migracion de nombres.
    #
    # Verificado antes de abrir: `tooling-ha` responde con la key real de
    # openclaw-qwen36 (el allowlist de las 7 keys se amplio primero, porque el
    # chequeo de la key corre antes del hook y si no da 403), `helm template` OK
    # para las dos apps que renderizan el chart, y CERO `qwen36-35b` en los
    # manifiestos resultantes.
    #
    # APPROVAL CERRADO tras el rollout verificado de d35e198 (r2, 09:47Z):
    # Succeeded / Synced / Healthy, los cinco contenedores del pod principal Ready,
    # OPENCLAW_MODEL=tooling-ha vivo y CERO `qwen36-35b*` en los ConfigMaps del
    # namespace. Probado de verdad desde dentro del pod: contesta 'vivo'.
    #
    # HIZO FALTA ADEMAS abrir el allowlist del EQUIPO `openclaw` en LiteLLM, no solo
    # el de las keys: hay dos gates encadenados y el de equipo daba 403 con los pods
    # ya Healthy. Un semaforo verde no prueba que el modelo conteste.
    #
    # REINTENTO r2. El primer intento (09:37Z) fallo en el hook de Sync
    # `codex-provider-gate`, y el fallo fue MIO: amplie el allowlist de las keys de
    # forma aditiva pensando que anadir modelos no podia romper nada, y ese gate
    # exige `.info.models == [$model]` -- exactamente UN modelo, por minimo
    # privilegio. Corregido: openclaw-codex-app-server queda en ["tooling-ha"] y
    # openclaw-operator-readonly en ["dense","tooling-ha"], que es justo lo que
    # asertan sus gates. De paso se cae `dense-uncensored`, que el readonly plane
    # no usa (0 referencias en su runtime-config) y sobraba en esa key.
    #
    # El fallo fue seguro: hook de Sync, nada rodo, todos los pods siguieron con su
    # edad previa y el hook de SyncFail corrio.
    #
    # prune false: no se borra nada, solo cambian ConfigMaps y un env var.
    # APPROVAL CERRADO tras el rollout verificado de b607abc: Succeeded / Synced /
    # Healthy, OPENCLAW_MODEL=tooling vivo, cero `tooling-ha` en los ConfigMaps del
    # namespace, y una llamada desde dentro del pod devuelve 'vivo'. La app hermana
    # `openclaw-synapse` se sincronizo a la misma revision y tambien contesta.
    #
    # (historico) APPROVAL OPEN para b607abc: se retira el sufijo -ha. `tooling-ha` era un
    # nombre de mas -- todo el que pedia `tooling` queria "vivo", y el fallback esta
    # ahora dentro del propio `tooling` (cadena tooling -> dense en el hook del
    # LiteLLM central). Cero perdida funcional, un nombre menos.
    #
    # Verificado antes de abrir: `helm template` OK para las DOS apps del chart,
    # cero `tooling-ha` en los manifiestos, tests 459 passed (los 16 rojos son de
    # test_rwop_state_migration.py y ya fallaban antes), y las dos keys con gate de
    # igualdad EXACTA puestas en lo que asertan -- openclaw-codex-app-server en
    # ["tooling"] y openclaw-operator-readonly en ["dense","tooling"]. Esa es la
    # leccion del intento fallido de esta manana: esos gates comparan igualdad, no
    # pertenencia, asi que ampliar el allowlist los rompe.
    #
    # prune false: no se borra nada, cambian ConfigMaps de runtime y un env var.
    #
    # APPROVAL CERRADO para 6109f05: el agente `programador` conserva OpenClaw
    # nativo, cambia de `full` al perfil recomendado `coding` y expone solo
    # Sol, Terra, Luna y LiteLLM Tooling. Sol sigue siendo el primary; la cadena
    # de fallback pasa a Terra -> Luna -> Tooling. No se crean APIs, plugins,
    # controladores ni almacenamiento adicional.
    #
    # Verificado antes de abrir: OpenClaw 2026.7.1-2 valida el JSON dentro del
    # pod, los 20 contratos afectados pasan y `helm lint`/`helm template` pasan.
    # La suite completa conserva fallos previos ajenos en RWOP/PDB y dos modelos
    # Qwen globales ausentes; ninguno pertenece a este cambio de Programador.
    # prune false: no se borra ningun recurso.
    # Despliegue Succeeded/Synced/Healthy y configuracion activa validada tras
    # recrear el pod para materializar el estado persistente de OpenClaw.
    # REINTENTO completado en e8d80f0: aliases de capacidad estables, sampling
    # centralizado en LiteLLM y migracion selectiva/atomica del PVC y de pins de
    # sesion. El primer intento 6916414 fallo de forma segura en el gate Codex;
    # las keys Codex/Synapse y readonly ya se migraron in-place y se verificaron
    # en LiteLLM + Vault. Backup Longhorn verificado; prune=false y sin APIs nuevas.
    # FOLLOW-UP APROBADO para d1abbac: conecta el normalizador idempotente de
    # pins de sesion al init que ya migra el PVC. No cambia modelos, permisos,
    # red ni almacenamiento y conserva backup 0600 antes de cada escritura.
    # FOLLOW-UP r4 APROBADO para 6435d56: monta ese normalizador desde un
    # ConfigMap versionado por checksum, porque la imagen viva aun contenia la
    # variante historica limitada a Telegram. El contenido renderizado es
    # byte-identico al fuente y ahora cubre Telegram, WhatsApp, cron y webhook.
    # Solo escribe pins obsoletos, es idempotente y conserva backup 0600.
    # APPROVAL CERRADO tras el rollout de 6435d56: Succeeded/Synced/Healthy,
    # pod 5/5, cuatro pins historicos migrados y segunda ejecucion idempotente.
    # `tooling` hizo una tool-call real y `agent` respondio desde Synapse; ambos
    # HTTP 200. La operacion uso prune=false y no elimino ningun recurso.
    # APPROVAL CERRADO: OpenClaw quedo alineado con la ventana viva de LiteLLM. Mantiene el
    # picker en los cinco aliases estables, declara 65K como fallback seguro,
    # selecciona 256K/384K mediante el catalogo vivo y reduce la reserva de
    # compactacion de 60K a 20K. La migracion v2 del PVC es selectiva, atomica y
    # conserva toda configuracion no gestionada. Operacion verificada en
    # cc59fa7: Succeeded/Synced/Healthy, pod principal Ready sin reinicios,
    # migracion v2 y backup 0600 presentes, plugin cargado y `agent` resuelto
    # en vivo a `litellm-384k`. Se ejecuto con prune=false.
    # APPROVAL CERRADO para 57bf3e1: Succeeded/Synced/Healthy, prune=false,
    # pods al digest be1f58a con 0 reinicios, OpenClaw 2026.7.1-2 y plugin
    # dgx-video 1.7.0 cargado entre los plugins activos.
    # APPROVAL AMPLIADO para cb0da5c (incluye 0ffcc43): el selector local de OpenClaw pasa de cinco
    # entradas a UNA. `tooling`, `agent`, `high` y `max` nunca fueron cinco
    # modelos -- son el MISMO residente con cuatro niveles de pensamiento -- asi
    # que se retiran del picker y el nivel se pide con `/effort`, que viaja como
    # `reasoning_effort` y traduce el hook central (k8s-litellm-pocharlies
    # fbfd9a5, ya desplegado y verificado en el pod: CLIENT_EFFORT_TIERS con
    # low y medium FUERA a proposito).
    #
    # Riesgo acotado: el effort ambiente NO pisa al alias (solo high/max/none),
    # que es la regresion que hizo revertir a4ccc95 y quedo cubierta por las
    # pruebas citadas en el cierre anterior.
    #
    # APPROVAL CERRADO para 0b401b7 (openclaw-deepseek-v4-20260814): operacion
    # Succeeded/Synced/Healthy, PostSync completado, deployments principal y
    # social Ready 1/1, y DeepSeek V4 disponible en vivo con contexto 393216 y
    # esfuerzos none/low/high/max. Se ejecuto con prune=false.
    # APPROVAL CERRADO para 7515c44 (openclaw-h3-turbo-8step-20260814):
    # operacion Succeeded/Synced/Healthy con prune=false; los seis pins usan
    # sha256:30ffbe6ee6c300c4872fb597b0488b6100d4ccbc637031e5d40960884c4e26db.
    # El pod cargo dgx-video 1.7.1 con defaultTier nvfp4_turbo y el spec DGX
    # vivo confirma Turbo LoRA disponible y 8 pasos por defecto.
    # APPROVAL CERRADO para 0db701739d876984d4c85e4e23a86496f7600d7c:
    # incorpora los agentes ligeros qwen4b y dgx-charla sobre Qwen3.5 4B,
    # enlaza DGX Charla (-1003705829351) al segundo y conserva DeepSeek como
    # ruta local general. dgx-charla solo puede buscar en web o delegar al
    # agente programador/Codex; no recibe herramientas operativas ni fallback.
    # Backup Velero Kubernetes daily-aiops-20260814033024 Completed. Validacion
    # completa: 492 tests + 103 regresiones, Helm lint/template y prune=false;
    # operacion Succeeded/Synced/Healthy.
    # APPROVAL CERRADO para 75268d19bb1776315f3896e91926670d0eb6b006:
    # limita la migracion PVC de dgx-charla al runtime principal. El overlay
    # Synapse la desactiva y ya quedo Succeeded/Synced/Healthy en esa revision.
    # Regresion: 493 tests, 9 focalizados y render default/Synapse. Se reutiliza
    # el mismo backup Kubernetes Completed y se mantiene prune=false; operacion
    # principal Succeeded/Synced/Healthy.
    # APPROVAL CERRADO para 0b57e9c9bae3eacfe076cc64f6dac35e28c11d8b:
    # amplía `minimal` antes del allowlist exacto para exponer Firecrawl y la
    # delegacion, y reduce solo la reserva CPU de Synapse (sin CPU limit) para
    # que el Recreate quepa en KS5. Synapse esta Succeeded/Synced/Healthy en
    # ks5-cp-1. Validacion: 493 tests completos + 73 focalizados y ambos renders.
    # El runtime principal quedo Succeeded/Healthy en esta revision antes del
    # ajuste final de policy, que se publica mediante la aprobacion siguiente.
    # APPROVAL CERRADO para a73fdcaf223f148905c985807c11f5c073b4ab53:
    # conserva `profile: minimal` con `alsoAllow` (sin mezclar `allow`) y deja
    # exactamente nueve herramientas efectivas para dgx-charla: Firecrawl,
    # agents_list, sessions_spawn y seis codex_*. Mantiene Synapse con request
    # CPU 100m y sin limite CPU. Validacion: 493 tests + 73 focalizados, y
    # render Helm default/Synapse. Operacion con prune=false terminada
    # Succeeded/Synced/Healthy; marker .dgx-charla-agent-v3 y nueve herramientas
    # comprobados en el PVC. Smokes reales: DGX_CHARLA_OK, firecrawl_search y
    # sessions_spawn/programador sin fallos. Telegram DGX Charla recibio el
    # mensaje 4 de @oppocharliesllmbot.
    # APPROVAL CERRADO para 4850c4e11bb305f2a8f69e4f73a0538bc5b865fc:
    # operacion exacta Succeeded/Synced/Healthy con prune=false; pod 5/5 Ready,
    # cero reinicios y marker .dgx-charla-agent-v4. El runtime conserva el ID
    # dgx-charla, muestra Jarbis, publica contextWindow=32768, usa Qwen sin
    # fallback y mantiene requireMention=false en Telegram -1003705829351.
    # Smoke real: JARBIS_OK en 6,8 s, contextTokens=32768 y thinking=off.
    # Backup Velero Kubernetes daily-aiops-20260814033024 Completed. Validacion:
    # 493 tests + 103 regresiones, 44 pruebas focalizadas y Helm lint/template.
    # APPROVAL CERRADO para b50c4a0b07c4af64e388d9773f6f3b8f0af3243a
    # (openclaw-restore-jarbis-plus-thinking-20260814): operacion Succeeded,
    # Synced/Healthy, pod 5/5 Ready. Repone el rename a Jarbis que la operacion
    # inmediatamente anterior habia revertido al sincronizar 2bf2af3, un
    # ancestro de lo desplegado: 'Jarbis' verificado en /runtime-config/openclaw.json
    # del pod. Entran tambien 075db7a y b50c4a0, que estaban en el tronco sin
    # desplegar.
    #
    # AVISO para quien siga: el cambio de niveles de thinking de DeepSeek que
    # motivo 2bf2af3 esta desplegado pero es INERTE. La config del pod ya lleva
    # supportedReasoningEfforts=[low,high,max], y aun asi el gateway sigue
    # anunciando off/minimal/low/medium/high. En thinking-policy la lista
    # autoritativa solo se usa si agentRuntime==='codex', y la ruta litellm
    # (openai-completions) no corre en Codex. Quitar el 'none' era condicion
    # necesaria pero no suficiente. No repitas la operacion esperando otro
    # resultado: hace falta un provider plugin con resolveThinkingProfile.
    # APPROVAL CERRADO para a912756: operacion Succeeded/Synced/Healthy,
    # prune=false y pod 5/5 Ready. Las seis plantillas genericas quedaron a cero
    # bytes y solo AGENTS aporta contenido; el smoke final bajo el prompt de
    # 6636 a 4548 tokens y de 19035 a 11786 caracteres. Conserva seis tools,
    # contexto 32K y requireMention=false. Durante el benchmark se descubrio el
    # PVC principal preexistente al 100%; su ampliacion va en la aprobacion
    # siguiente, sin borrar sesiones ni datos.
    operations.pocharlies.org/state-writer-lease: inactive
    # APPROVAL CERRADO tras el rollout verificado de cdc94b99
    # (talk-omnivoice-pool-20260814): op Succeeded, pod nuevo 00:34Z, marker
    # .talk-omnivoice-pool-v1 presente y talk.baseUrl reescrito al canonico en el
    # config persistido del PVC (verificado con exec). Los Services deprecados
    # omnivoice-tts-dgx2/-dgx2-static quedan sin consumidores y se retiran.
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
