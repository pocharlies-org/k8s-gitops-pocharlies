apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Approve revision 996ba7f: promotion of image 2026.7.1-4 (core openclaw@2026.7.1,
    # digest sha256:206627ef...). It carries the release-gate fix that unblocked the
    # pipeline (brace-expansion pinned to 5.0.8 for CVE-2026-14257, a fixable HIGH that
    # had kept every promotion since 2026.7.1-2 red) plus the skirmshop Creator-create
    # capability: the agent gets synapse__product_creator_create_request over the
    # /synapse MCP route and loses shopify-admin__product_create, so CREATE goes through
    # the Synapse product-creator pipeline while EDIT stays on Shopify Admin. 996ba7f is
    # a descendant of the already-verified 248b775, so the codex-auth registration ships
    # with it. Release run 30224040223 was green end to end: validate, Trivy gate with no
    # fixable CRITICAL/HIGH left, immutable tag promotion and the post-promotion default
    # regression suites. Prune stays false.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: 996ba7f73563f82b26ed1bd3907ed6e9f5569fad
    operations.pocharlies.org/approval-id: creator-create-996ba7f-20260727004500
    operations.pocharlies.org/approval-sequence: "20260727004500"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
