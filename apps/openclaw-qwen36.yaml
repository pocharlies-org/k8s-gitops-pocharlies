apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Revision 6c97de4 is Succeeded and Healthy, 2026-07-25T22:43:50Z to
    # 22:46:14Z. Pod openclaw-qwen36-openclaw-84cd7cb9f9-fvpds came up with zero
    # container restarts and no startup errors; both Telegram providers started
    # (@oppocharliesbot isolated polling, @oppocharliesllmbot listen-only
    # webhook). Verified in the live runtime config: "history openclaw pooling"
    # now has requireMention true in Pocharlies Operations, and dense-uncensored
    # is gone from all planes (0 occurrences, was 7). historyLimit 30 on that
    # account is unchanged and still unreviewed. The consumed one-shot
    # production lease is closed; re-consume is already denied by the monotonic
    # approval-sequence rule. Drift outstanding: 1311510c (Tailscale subnet
    # router WebSocket) landed after this approval and needs its own.
    operations.pocharlies.org/state-writer-lease: inactive
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
