apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Approve config-only revision 1277de5: add a top-level `talk` block so
    # native iOS Talk (stt-tts) speaks replies with the self-hosted OmniVoice
    # cloned voice (leila_clean_16s) via the openai talk provider pointed at
    # the OpenAI-compatible backend omnivoice-tts-dgx2.llm:8000/v1 (DGX1,
    # DGX1->DGX2 failover) instead of falling back to the on-device Apple
    # voice; STT stays on-device. Carries the pending 9abd225 (brain_cypher
    # deny) already on deploy/prod. Rendered 1277de5 config validated against
    # the pinned 2026.7.1-3 binary (only known-false plugin-path diagnostics)
    # and POST /v1/audio/speech voice=leila_clean_16s -> 200.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: 1277de5224a5c0d3dd6368c603cdc8231bc1aaa9
    operations.pocharlies.org/approval-id: talk-omnivoice-tts-1277de5
    operations.pocharlies.org/approval-sequence: "20260723143300"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
