apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # APPROVAL OPEN for fd8922a, the reviewed deploy/prod merge of PR #260.
    # This is the bounded retry of the terminated eda322c operation (sequence
    # 20260728122020). That rollout exposed that the in-container OpenClaw CLI
    # rejects an explicit local URL unless separate credentials are also supplied.
    # PR #260 removes only that override and lets the CLI use its configured local
    # target. Live `cron status` and `cron get` calls then succeeded, while the
    # declaration remains unchanged: one declarationKey, 09:05 Europe/Madrid,
    # skirmshop agent, GPT-5.6 Sol, inherited tools including Gmail, no routine
    # delivery, and one-day failure alerts to etiquetas. Validation passed with 539
    # repository tests and 103 promotion-regression tests. The prior operation was
    # terminated through the reviewed Argo-server exception and is terminal Failed.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: fd8922a794cc8af7f5c4bebb1378063c7fc1522f
    operations.pocharlies.org/approval-id: codex-correos-fuel-cron-fd8922a-20260728131238
    operations.pocharlies.org/approval-sequence: "20260728131238"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
