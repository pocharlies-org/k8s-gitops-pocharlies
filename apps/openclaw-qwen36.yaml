apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Revision c939678 is live: Argo Synced/Healthy, the new pod came up 5/5 in 85s with
    # no restarts, all nine namespace Deployments ready, gateway loading 27 plugins.
    # It carried b7d6981, which stops the codex-app-server sidecar from enumerating one
    # subPath mount per agent workspace and mounts the /data parent instead. The
    # enumeration had drifted because the agent list is runtime state the gateway owns
    # on the PVC (/data/config/openclaw.json), so any agent created after the last chart
    # change had no mount in the sidecar and every Codex exec in it died before running
    # with "Failed to create unified exec process: No such file or directory (os error
    # 2)" -- which blocked Project #22 on 2026-07-27.
    # VERIFIED after the sync, per agent workspace in the live agent list, by spawning
    # under the bundled bwrap with that cwd (the exact layer that failed): main,
    # skirmshop, image-cloud, synapse-ops-analyst, local, culturismo and programador all
    # spawn and write. Before the sync four of those seven did not exist in the sidecar.
    # End-to-end confirmed too: a real `codex exec` session in the programador workspace
    # ran `git status --short --branch` in 268ms and returned `## agent/project-22-rho`,
    # the same command that failed six times at 21:39-21:40 UTC.
    # The read boundary held: credentials, config, state, sessions, settings, devices,
    # gitops and workspace-social are all present-and-empty in the sidecar, and
    # writable_roots is unchanged, so write confinement did not widen.
    # LEARNED: enumerating anything per-agent in this chart is a silent-drift trap,
    # because the gateway owns the agent list at runtime and the chart only seeds it.
    # Approval consumed, so the lease returns to inactive.
    operations.pocharlies.org/state-writer-lease: inactive
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
