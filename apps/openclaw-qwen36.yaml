apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Approve revision 5005ddf: route the Programador Telegram forum
    # (-1004319922453) to the operator backend that contains agent programador.
    # PR #256 passed the full chart/security suite (534 general tests and 103
    # post-promotion regressions). The change adds only the missing exact chat
    # route, keeps the default social backend unchanged, and does not prune.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: 5005ddf7b3ce06077481b68a3b1a3f38186f8df5
    operations.pocharlies.org/approval-id: programador-router-5005ddf-20260727182638
    operations.pocharlies.org/approval-sequence: "20260727182638"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
