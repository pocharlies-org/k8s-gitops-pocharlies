apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Reviewed one-shot approval for the Abel/Leila per-group Telegram allowlist
    # fix (8a76be0). Multi-account mode (2nd account @oppocharliesbot) made the
    # core read accounts.<id>.groups and ignore channel-level telegram.groups,
    # silently dropping Abel (Skirmshop ES OP) and Leila (Hogar) while still
    # answering Daniel; 8a76be0 mirrors the per-group allowlists into
    # accounts.default.groups. 8a76be0 is a direct child of the just-deployed
    # b7c97d6, so this also keeps the omnivoice fix. Config-only; prune disabled.
    # Close this lease immediately after the exact revision is verified healthy.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: 8a76be07789488562d0c062366d5bea9b3271191
    operations.pocharlies.org/approval-id: openclaw-abel-allowlist-fix-8a76be0-20260723132049
    operations.pocharlies.org/approval-sequence: "20260723132049"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
