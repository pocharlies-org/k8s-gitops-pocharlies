apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Approve the 2026.7.1-3 image promotion (PR #213 merge 627c64e): bakes
    # the email-topic-model plugin (currently PVC-seeded) plus the batch
    # already validated on 25a8b93. Also picks up config-only commits since:
    # main agent Terra full-tool profile (565acf8) and the ornith binding for
    # Pocharlies Operations (58ac337). Same core 2026.7.1-2 inside the new
    # image (verified: openclaw --version in a one-shot pod) and the rendered
    # 627c64e config validates against that binary with only the known-false
    # plugin-path diagnostics — no schema delta, no typingMode reintroduced.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: 627c64e8f0d911578de66b10890adc86e81f73de
    operations.pocharlies.org/approval-id: openclaw-image-2026.7.1-3-promotion-627c64e
    operations.pocharlies.org/approval-sequence: "20260723080811"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
