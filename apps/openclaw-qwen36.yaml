apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Revision 996ba7f is live: the openclaw Deployment runs 2026.7.1-4
    # (sha256:206627ef...), the pod is Ready and Healthy, and the skirmshop agent config
    # carries synapse__product_creator_create_request without shopify-admin__product_create.
    # The Argo operation itself ended Failed because the rollout crash-looped for ~55min
    # before becoming Ready, which also fired the syncfail hook. Root cause was NOT this
    # revision: on any image change the core runs post-core-update plugin repair, and
    # `npm view <pkg> --json` under npm 12 returns a one-element ARRAY where core
    # 2026.7.1 expects an object, so every npm-managed plugin fails with "npm view
    # produced incomplete package metadata" (firecrawl and codex both did). Only
    # firecrawl was fatal, via its fail-closed missing-package-dir smoke check. Recovered
    # by installing @openclaw/firecrawl-plugin@2026.7.1 into the project dir the smoke
    # check expects; the pod then came up clean. That npm-12 incompatibility is still
    # latent and will bite the next image change until the core or NPM_VERSION is fixed.
    # Approval consumed, so the lease returns to inactive.
    operations.pocharlies.org/state-writer-lease: inactive
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
