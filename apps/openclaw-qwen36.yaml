apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # Revision e4ac15b is live: Argo Synced/Healthy and the pod came up clean (5/5 in
    # ~65s, no crash loop). The registration reached the gateway, which now loads 27
    # plugins including openclaw-self-update (CLI: enabled, status loaded) and the
    # Telegram menu grew from 53 to 57 commands, so /of-update exists.
    # LEARNED: this ConfigMap only SEEDS the runtime config. openclaw OWNS its operating
    # config on the PVC (/data/config/openclaw.json via OPENCLAW_RUNTIME_CONFIG_PATH) and
    # the persisted copy wins after first boot, so a GitOps-only change does NOT reach a
    # running gateway. The plugin also needed `openclaw-self-update` added to plugins.allow
    # in the persisted config (`openclaw plugins enable` refused it: "blocked by
    # allowlist"), then `openclaw plugins enable` plus a gateway restart. load.paths was
    # deliberately NOT touched there: the plugin is discovered as a global plugin, and
    # declaring it as a config plugin too would create the same cosmetic duplicate-id
    # warning firecrawl has. Approval consumed, so the lease returns to inactive.
    operations.pocharlies.org/state-writer-lease: inactive
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
