apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-qwen36
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    # APPROVAL OPEN for b7d6981: the codex-app-server sidecar enumerated one subPath
    # mount per agent workspace, but the agent list is runtime state the gateway owns
    # on the PVC (/data/config/openclaw.json). The enumeration therefore drifted and
    # every Codex exec in an unmounted workspace died before running with
    # "Failed to create unified exec process: No such file or directory (os error 2)".
    # Four of the seven live agents were affected (programador, local, culturismo,
    # image-cloud); it blocked Project #22 on 2026-07-27 while sandboxState=PASS and
    # transportOk=true still reported green, because neither probe touches the session
    # cwd. b7d6981 mounts the /data parent once so every agent the gateway creates from
    # now on works with no chart change, and shadows the operator-state subtrees
    # (credentials, config, state, sessions, settings, devices, gitops) plus
    # workspace-social with empty dirs so the read boundary is preserved.
    # writable_roots is unchanged, so write confinement does not widen.
    # Deploy-only change: no PVC contents are touched, only the sidecar mount set and
    # the codex ConfigMap. Full chart suite green (534 passed). Previous operation is
    # terminal (Succeeded 2026-07-27T20:22:37Z, sequence 20260727202100) and the lease
    # was returned to inactive, so this sequence is strictly newer.
    operations.pocharlies.org/state-writer-lease: active
    operations.pocharlies.org/approved-revision: b7d6981ce6f2e777ac1d982f8358ab4a568956d4
    operations.pocharlies.org/approval-id: codex-sidecar-data-parent-mount-b7d6981-20260728000014
    operations.pocharlies.org/approval-sequence: "20260728000014"
    operations.pocharlies.org/approved-prune: "false"
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: openclaw-controlled
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/openclaw-qwen36
    helm:
      releaseName: openclaw-qwen36
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-qwen36
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      # Fail closed while the state-writer/RWOP migration is incomplete.  A
      # deny sync window alone still lets Argo create a Running operation that
      # can become stuck at "blocked by sync window".
      enabled: false
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
