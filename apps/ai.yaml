    # Sin esto no habia transcripcion EN NINGUN SITIO desde el 09-08: /api/stt/status
    # tiene un unico backend y daba healthy:false. NO se levanta en los Sparks —
    # MemAvailable REAL nvidia-dgx 6.2 GiB / gx10-ec3d 3.3 GiB y el pod tiene limite
