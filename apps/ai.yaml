    - group: apps
      kind: Deployment
      name: omnivoice-tts-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    # vLLM resident on the GB10 (dgx2): the gpu_arbiter scales it 0<->1 to free the
    # single GB10 for on-demand workloads (comfyui/trellis/ltx) and restores it after.
    # ArgoCD must NOT selfHeal that replica change — otherwise it reverts the eviction
    # within minutes and the on-demand pod stays Pending (Insufficient nvidia.com/gpu;
    # verified live 2026-06-17). Same rationale as the BGE/KEDA ignores: the arbiter,
    # not ArgoCD, owns these replicas. (GPU on-demand design decision, approved.)
