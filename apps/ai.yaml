    # No toca DeepSeek ni el perfil: render comparado contra 0f9c58a, el delta son
    # solo el Deployment nuevo y la label del pool.
    # ROLLBACK de SOLO esto: 0f9c58af39fd6f94f0df708022b90f0427f05b31
    # 2026-08-13: 82bf13d = 1e3b23d (ASR intacto) MENOS el tope OMP_NUM_THREADS=6
