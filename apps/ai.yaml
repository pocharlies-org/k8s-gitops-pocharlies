apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies/k8s-ai-pocharlies
  labels:
    e-dani.com/tier: app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies/k8s-ai-pocharlies
    targetRevision: deploy/prod
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # KEDA owns .spec.replicas for the BGE deployments (VRAM/load-gated autoscaling).
  # Scope the ignore to these 6 Deployments only — NOT cluster-wide apps/Deployment,
  # which would also stop ArgoCD healing vLLM replica drift (arbiter-managed baseline).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: bge-m3-embedding
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-m3-embedding-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-m3-embedding-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
