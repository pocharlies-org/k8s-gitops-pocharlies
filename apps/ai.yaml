      name: bge-reranker
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: qwen3-reranker-4b-nvfp4-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
