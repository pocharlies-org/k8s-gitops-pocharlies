apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-ai-pocharlies
    e-dani.com/rho-pin-purpose: nvidia/Qwen3.6-35B-A3B-NVFP4 como residente permanente de DGX1; ornith a replicas 0, recuperable
    e-dani.com/rho-rollback-revision: 6647f34fe1da0365baf8a711f2dc4c7905b1272b
    e-dani.com/rho-restore-target-revision: deploy/prod
  labels:
    e-dani.com/tier: app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-ai-pocharlies
    # RHO pin: Ornith MTP graft profile. Same audited image and weights; the
    # overlay serves a locally grafted checkpoint (base-model BF16 mtp.* head,
    # fail-closed SHA verify in the init container) and turns speculative
    # decoding on. Roll back to the annotated immutable revision (path k8s) to
    # return to the exact baseline identity.
    #
    # Rolled forward 758cd27 -> ac27f46 -> c84b699 on 2026-07-22, dismantling the
    # abandoned "RHO 256K benchmark isolation" in two steps: ac27f46 restored
    # omnivoice-tts-dgx2 and stt-turbo to replicas 1 (the voice stack had been dark
    # for six days), c84b699 un-wedged the DGX1 BGE embedder and reranker, which the
    # same window had pinned at zero behind an unreachable KEDA activationThreshold.
    # Note the pin is what gates all of it: leaving it on an older revision re-zeroes
    # those Deployments on the next root sync, because this app selfHeals
    # /spec/replicas for every Deployment not listed in the ignoreDifferences patch
    # below — and none of them are.
    # 2026-08-09: DeepSeek-V4-Flash-0731 en TP=2 sobre los DOS Sparks. Este pin
    # baja a 0 el 35B de DGX1 y stt-turbo, levanta los dos ranks del modelo, y
    # deja embeddings/reranker/TTS vivos pero REPARTIDOS a mano con nodeSelector
    # (bge-* en nvidia-dgx, omnivoice en gx10-ec3d) para que el scheduler no los
    # amontone: por requests cabrian los tres en un nodo y se cargarian la
    # memoria real del rank que viva alli.
    # El 27B denso de gx10-ec3d NO lo controla este pin: tiene /spec/replicas en
    # el ignoreDifferences de abajo, asi que va con `kubectl scale` aparte.
    #
    # ROLLBACK: devolver este campo a b5c0a4ef5a741916b69bef8795999fe098a76229 y
    # `kubectl -n llm scale deploy/vllm-qwen36-27b-uncensored-dgx2 --replicas=1`.
    # NO sirve parchear la Application con kubectl: el app raiz tiene
    # automated.selfHeal y revierte el drift (paso el 2026-08-09 a las 12:39Z,
    # ~2h despues de un patch a mano).
    # 2026-08-10: c7376db retira Qwen3-Coder-30B del cluster entero (Deployment y
    # Service, via prune). Su predecesor 0a1b67a5 es el mismo perfil DeepSeek con los
    # dos ajustes medidos encima (batched-tokens 8192, MTP k=5).
    # 2026-08-10: fc99a00 = c7376db + SOLO los 6 ficheros bge. El pool de labels pasa
    # a ser agnostico del dispositivo (bge-pool=embedding/reranker en vez de *-gpu) y
    # los deployments CPU entran en el. Con los GPU a 0 replicas, los Services
    # bge-m3-embedding y bge-reranker se habian quedado sin endpoints y el RAG del
    # brain devolvia 200 con cero fuentes. Va sobre la rama deploy/bge-pool-on-pin
    # a proposito: el HEAD de deepseek-v4-flash trae ademas e3ce384 (checkpoint
    # abliterated de DeepSeek), que NO se despliega aqui — reiniciar DeepSeek TP=2
    # deja head y worker en deadlock mudo.
    # ROLLBACK de este cambio: devolver a c7376db49f7335f456e4c1b53cf3576f72b8a220.
    targetRevision: 7ab2dcbfe80142f07e9dd7e92f793f82629484ce
    path: overlays/ornith-sm121v5-lmheadw4-20260721
  destination:
    server: https://kubernetes.default.svc
    namespace: llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Pre-existing: ignore apiserver-defaulted ESO/cnpg fields (kept to avoid regressing
    # the ai app's sync — these match the live state applied previously).
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
    # Replicas of controller-managed Deployments are ignored so ArgoCD doesn't fight the
    # controller: KEDA owns the 6 BGE replicas (VRAM/load-gated autoscaling); the gpu_arbiter
    # owns the resident vLLM replica (on-demand GPU eviction — see the vllm entry below).
    # Scoped by name — NOT cluster-wide apps/Deployment — so any OTHER Deployment still gets
    # its replica drift healed.
    - group: apps
      kind: Deployment
      name: bge-m3-embedding
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: qwen3-embedding-4b-nvfp4-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-m3-embedding-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: qwen3-reranker-4b-nvfp4-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    # vLLM resident on the GB10 (dgx2): the gpu_arbiter scales it 0<->1 to free the
    # single GB10 for on-demand workloads (comfyui/trellis/ltx) and restores it after.
    # ArgoCD must NOT selfHeal that replica change — otherwise it reverts the eviction
    # within minutes and the on-demand pod stays Pending (Insufficient nvidia.com/gpu;
    # verified live 2026-06-17). Same rationale as the BGE/KEDA ignores: the arbiter,
    # not ArgoCD, owns these replicas. (GPU on-demand design decision, approved.)
    - group: apps
      kind: Deployment
      name: vllm-35b-nvfp4-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
