apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies/k8s-ai-pocharlies
  labels:
    e-dani.com/tier: app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies/k8s-ai-pocharlies
    targetRevision: deploy/prod
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Pre-existing: ignore apiserver-defaulted ESO/cnpg fields (kept to avoid regressing
    # the ai app's sync — these match the live state applied previously).
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
    # Replicas of controller-managed Deployments are ignored so ArgoCD doesn't fight the
    # controller: KEDA owns the 6 BGE replicas (VRAM/load-gated autoscaling); the gpu_arbiter
    # owns the resident vLLM replica (on-demand GPU eviction — see the vllm entry below).
    # Scoped by name — NOT cluster-wide apps/Deployment — so any OTHER Deployment still gets
    # its replica drift healed.
    - group: apps
      kind: Deployment
      name: bge-m3-embedding
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: qwen3-embedding-4b-nvfp4-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-m3-embedding-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: qwen3-reranker-4b-nvfp4-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    # vLLM resident on the GB10 (dgx2): the gpu_arbiter scales it 0<->1 to free the
    # single GB10 for on-demand workloads (comfyui/trellis/ltx) and restores it after.
    # ArgoCD must NOT selfHeal that replica change — otherwise it reverts the eviction
    # within minutes and the on-demand pod stays Pending (Insufficient nvidia.com/gpu;
    # verified live 2026-06-17). Same rationale as the BGE/KEDA ignores: the arbiter,
    # not ArgoCD, owns these replicas. (GPU on-demand design decision, approved.)
    - group: apps
      kind: Deployment
      name: vllm-35b-nvfp4-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    # KEDA pause annotation on the BGE-dgx2 ScaledObjects: the gpu_arbiter sets
    # autoscaling.keda.sh/paused-replicas="0" to evict the preemptible BGE embedder/
    # reranker off the GB10 while ComfyUI/Trellis run, and removes it on release. ArgoCD
    # must NOT selfHeal that annotation away mid-job (it would unpause KEDA and let BGE
    # fight ComfyUI for the GPU). Same "arbiter owns this, not ArgoCD" rationale as the
    # replica ignores above.
    - group: keda.sh
      kind: ScaledObject
      name: keda-bge-embedding-gpu-dgx2
      namespace: llm
      jsonPointers: ["/metadata/annotations/autoscaling.keda.sh~1paused-replicas"]
    - group: keda.sh
      kind: ScaledObject
      name: keda-bge-reranker-gpu-dgx2
      namespace: llm
      jsonPointers: ["/metadata/annotations/autoscaling.keda.sh~1paused-replicas"]
