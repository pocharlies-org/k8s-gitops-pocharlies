apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies/k8s-ai-pocharlies
    e-dani.com/rho-pin-purpose: ornith-production-promotion + omnivoice restore
    e-dani.com/rho-rollback-revision: d1548ceace9f0835c47456865a9908fd20af8b47
    e-dani.com/rho-restore-target-revision: deploy/prod
  labels:
    e-dani.com/tier: app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies/k8s-ai-pocharlies
    # RHO pin: Ornith MTP graft profile. Same audited image and weights; the
    # overlay serves a locally grafted checkpoint (base-model BF16 mtp.* head,
    # fail-closed SHA verify in the init container) and turns speculative
    # decoding on. Roll back to the annotated immutable revision (path k8s) to
    # return to the exact baseline identity.
    #
    # Rolled forward 758cd27 -> ac27f46 -> c84b699 on 2026-07-22, dismantling the
    # abandoned "RHO 256K benchmark isolation" in two steps: ac27f46 restored
    # omnivoice-tts-dgx2 and stt-turbo to replicas 1 (the voice stack had been dark
    # for six days), c84b699 un-wedged the DGX1 BGE embedder and reranker, which the
    # same window had pinned at zero behind an unreachable KEDA activationThreshold.
    # Note the pin is what gates all of it: leaving it on an older revision re-zeroes
    # those Deployments on the next root sync, because this app selfHeals
    # /spec/replicas for every Deployment not listed in the ignoreDifferences patch
    # below — and none of them are.
    targetRevision: 34fbfeda347c3ab0d0702dcf778d1521518d7a6d
    path: overlays/ornith-sm121v5-lmheadw4-20260721
  destination:
    server: https://kubernetes.default.svc
    namespace: llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Pre-existing: ignore apiserver-defaulted ESO/cnpg fields (kept to avoid regressing
    # the ai app's sync — these match the live state applied previously).
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.data[]?.remoteRef.nullBytePolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
        - .spec.dataFrom[]?.extract.nullBytePolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
    # Replicas of controller-managed Deployments are ignored so ArgoCD doesn't fight the
    # controller: KEDA owns the 6 BGE replicas (VRAM/load-gated autoscaling); the gpu_arbiter
    # owns the resident vLLM replica (on-demand GPU eviction — see the vllm entry below).
    # Scoped by name — NOT cluster-wide apps/Deployment — so any OTHER Deployment still gets
    # its replica drift healed.
    - group: apps
      kind: Deployment
      name: bge-m3-embedding
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: qwen3-embedding-4b-nvfp4-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-m3-embedding-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: qwen3-reranker-4b-nvfp4-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    # vLLM resident on the GB10 (dgx2): the gpu_arbiter scales it 0<->1 to free the
    # single GB10 for on-demand workloads (comfyui/trellis/ltx) and restores it after.
    # ArgoCD must NOT selfHeal that replica change — otherwise it reverts the eviction
    # within minutes and the on-demand pod stays Pending (Insufficient nvidia.com/gpu;
    # verified live 2026-06-17). Same rationale as the BGE/KEDA ignores: the arbiter,
    # not ArgoCD, owns these replicas. (GPU on-demand design decision, approved.)
    - group: apps
      kind: Deployment
      name: vllm-35b-nvfp4-dgx2
      namespace: llm
      jsonPointers: ["/spec/replicas"]
