    repoURL: https://github.com/pocharlies-org/k8s-ai-pocharlies
    # RHO pin: Ornith MTP graft profile. Same audited image and weights; the
    # overlay serves a locally grafted checkpoint (base-model BF16 mtp.* head,
    # fail-closed SHA verify in the init container) and turns speculative
    # decoding on. Roll back to the annotated immutable revision (path k8s) to
    # return to the exact baseline identity.
    #
    # Rolled forward 758cd27 -> ac27f46 -> c84b699 on 2026-07-22, dismantling the
    # abandoned "RHO 256K benchmark isolation" in two steps: ac27f46 restored
    # omnivoice-tts-dgx2 and stt-turbo to replicas 1 (the voice stack had been dark
    # for six days), c84b699 un-wedged the DGX1 BGE embedder and reranker, which the
    # same window had pinned at zero behind an unreachable KEDA activationThreshold.
    # Note the pin is what gates all of it: leaving it on an older revision re-zeroes
    # those Deployments on the next root sync, because this app selfHeals
    # /spec/replicas for every Deployment not listed in the ignoreDifferences patch
    # below — and none of them are.
    # 2026-08-09: DeepSeek-V4-Flash-0731 en TP=2 sobre los DOS Sparks. Este pin
    # baja a 0 el 35B de DGX1 y stt-turbo, levanta los dos ranks del modelo, y
    # deja embeddings/reranker/TTS vivos pero REPARTIDOS a mano con nodeSelector
    # (bge-* en nvidia-dgx, omnivoice en gx10-ec3d) para que el scheduler no los
    # amontone: por requests cabrian los tres en un nodo y se cargarian la
    # memoria real del rank que viva alli.
    # El 27B denso de gx10-ec3d NO lo controla este pin: tiene /spec/replicas en
    # el ignoreDifferences de abajo, asi que va con `kubectl scale` aparte.
    #
    # ROLLBACK: devolver este campo a b5c0a4ef5a741916b69bef8795999fe098a76229 y
    # `kubectl -n llm scale deploy/vllm-qwen36-27b-uncensored-dgx2 --replicas=1`.
    # NO sirve parchear la Application con kubectl: el app raiz tiene
    # automated.selfHeal y revierte el drift (paso el 2026-08-09 a las 12:39Z,
    # ~2h despues de un patch a mano).
    # 2026-08-10: c7376db retira Qwen3-Coder-30B del cluster entero (Deployment y
    # Service, via prune). Su predecesor 0a1b67a5 es el mismo perfil DeepSeek con los
    # dos ajustes medidos encima (batched-tokens 8192, MTP k=5).
    # 2026-08-10: fc99a00 = c7376db + SOLO los 6 ficheros bge. El pool de labels pasa
    # a ser agnostico del dispositivo (bge-pool=embedding/reranker en vez de *-gpu) y
    # los deployments CPU entran en el. Con los GPU a 0 replicas, los Services
    # bge-m3-embedding y bge-reranker se habian quedado sin endpoints y el RAG del
    # brain devolvia 200 con cero fuentes. Va sobre la rama deploy/bge-pool-on-pin
    # a proposito: el HEAD de deepseek-v4-flash trae ademas e3ce384 (checkpoint
    # abliterated de DeepSeek), que NO se despliega aqui — reiniciar DeepSeek TP=2
    # deja head y worker en deadlock mudo.
    # ROLLBACK de este cambio: devolver a c7376db49f7335f456e4c1b53cf3576f72b8a220.
    # 2026-08-11: 0621af7 restaura los workloads y selectors del perfil global
    # encima de 749178db, revision propiedad de la sesion DeepSeek. No modifica
    # el manifiesto, checkpoint ni launch de DeepSeek; solo recupera los recursos
    # auxiliares que el prune de la resincronizacion habia retirado.
    # 2026-08-11: 1af4deb añade el fallback transaccional del préstamo RTX:
    # OmniVoice CPU en x86 y BGE CPU en Sauvage, todos normalmente a cero.
    # 2026-08-11: 8c0626a reconstruye esas cuatro capas sobre 27600ae, que es
    # la revision oficial de DeepSeek (sin el checkpoint abliterated). Evita que
    # el prune de Argo retire los componentes obligatorios de creative/llm-tp.
    # 2026-08-11: 7b76050 reconstruye las mismas capas sobre 19e48f7, conservando
    # el checkpoint abliterated elegido y evitando que Argo pode los tres
    # auxiliares RTX que Control Nexus exige para abrir la admision local.
    # 2026-08-11: 0d48a3f eleva MAX_MODEL_LEN de ambos ranks DeepSeek a 393216
    # (384K) sobre ese mismo perfil y registra el KV medido del arranque; no
    # cambia pesos, topologia ni ownership.
    # 2026-08-11: 791c8b6 conserva exactamente el DeepSeek oficial y los dos
    # deployments uncensored frios de 8f82bec, y repone encima los cinco
    # residentes declarativos que exige el selector global llm-tp/creative.
    # 2026-08-11: 4a2e532 = candidato A del harness RHO sobre 791c8b6. Cuantiza
    # head.weight a NVFP4 (0,986 -> 0,277 GiB, cos=0,995472) y activa
    # DS4_LMHEAD_NVFP4, que parchea en arranque las DOS construcciones de
    # ParallelLMHead para pasarles un ModelOptNvFp4Config; sin ese parche vLLM
    # crea la cabeza BF16 y el tensor empaquetado ni carga. El checkpoint nuevo
    # vive en models--pocharlies--DeepSeek-V4-Flash-0731-lmheadfp4 (hardlinks:
    # ~1 GB real) y esta en LOS DOS nodos, identico bit a bit.
    # 2026-08-12: f9b063c pasa el PV de pesos a NFS over RDMA (64 hilos nfsd +
    # listener rdma:20049 en nvidia-dgx): 1,5 -> 5,53 GB/s. El head de DeepSeek
    # deja de tener copia local de los pesos y
    # los lee por NFS desde nvidia-dgx (PV hf-cache-nvidia-dgx-ro). Habia 313G
    # duplicados en gx10-ec3d. Los workers no se tocan.
    # ROLLBACK: devolver este campo a 791c8b6607b1d0da963500211e23b9b21d593212.
    # 2026-08-12: a9cea5d pone por Git la imagen rank1 (proyeccion ortogonal en
    # runtime) sobre f9b063c, con el fix de device: r_hat nacia en CPU y vLLM no
    # llama a .to() sobre el modelo, asi que el forward petaba en arranque con
    # "Expected all tensors to be on the same device". Lo que corria antes era
    # DRIFT aplicado a mano (imagen vllm-sm121-ds4-rank1 con el hook activo)
    # mientras Git tenia la imagen base: por eso el crashloop no se corregia solo.
    # Arranca en lambda=0, bit-exacto al base. Mismos 48 shards @9e165c30.
    # ROLLBACK: devolver este campo a f9b063c3709e9330926269ad982884895f680750
    # (imagen base de ghcr, sin hook).
    # 2026-08-13: df14bbe sube la ventana de contexto de 262144 a 393216 (384K)
    # en los DOS ranks. Cherry-pick de d2a6cd4 + 0d48a3f desde
    # codex/deepseek-384k-context-20260811 — SOLO esos dos commits: los otros 4 de
    # esa rama (RTX image borrow, OmniVoice, compute profile) son trabajo ajeno.
    # Cabe: el arranque a 262144 midio 15.06 GiB de KV = 931.649 tokens, y
    # 931.649/393.216 = 2,37 peticiones de contexto COMPLETO. El fallo historico
    # fue a 1048576, que pedia 7,54 GiB con 6,79 disponibles.
    # ROLLBACK: devolver este campo a a9cea5db786dfe64f16cb967bea95c463c6fb68e.
    # 2026-08-13: f6759f2 activa la vision (plugin FlyCockpit dsv4_vision_vllm
    # sobre la imagen rank1f-vision). Sirve /cache/huggingface/dsv4-0731-vision,
    # que son los MISMOS 48 shards por symlink con architectures cambiado.
    # Apagable quitando las tres DSV4_VISION_* del deployment, sin rebuild.
    # ROLLBACK: devolver este campo a df14bbe85b410c692c27b01fc297a0ca0ab6fd06
    # (384K sin vision; acceptance medido 0.5731, mean accept len 3.866).
    #
    # 2026-08-13 REVERTIDO a df14bbe: f6759f2 entra en CrashLoopBackOff. La causa
    # NO es memoria ni los pesos — el rank 1 aborta con
    #     RuntimeError: Model does not support EAGLE3 interface
    # (multiproc_executor.py:898). El camino DSpark de esta imagen exige la
    # interfaz EAGLE3 sobre la clase de nivel superior, y el wrapper
    # DeepseekV4VisionForCausalLM del plugin delega compute_logits,
    # get_mtp_target_hidden_states, get_expert_mapping y embed_input_ids pero NO
    # los metodos de EAGLE3. El head solo reporta "WorkerProc initialization
    # failed ... Failed core proc(s): {}": la excepcion real esta en el LOG DEL
    # WORKER, en el otro nodo.
    # Para volver a intentarlo hacen falta las dos cosas: parchear el wrapper
    # para que delegue EAGLE3, o servir la vision SIN --speculative-config
    # (que es lo que da los 40-50 tps: sin DSpark se cae a ~20).
    # Lo demas del camino de vision quedo VERIFICADO en este intento:
    # DS4_VISION_ACTIVE, "Resolved architecture: DeepseekV4VisionForCausalLM",
    # checkpoint config.tiles=2 y limit_mm_per_prompt {'image': 8}.
    # 2026-08-13: 905086a retira el checkpoint separado
    # `deepseek-v4-flash-0731-unc` (cebeuq abliterated), ya descartado. Mantiene
    # intactos el checkpoint oficial, la proyeccion lambda del runtime y 384K.
    # Argo poda sus dos Deployments y dos Services al mover este pin.
    # 2026-08-13: 94b6009 = 905086a (retirada del uncensored, de la sesion codex)
    # + los dos commits de vision encima, por cherry-pick y fast-forward sobre
    # codex/remove-deepseek-unc-20260813. NO se pisa nada de esa sesion.
    # El intento anterior (f6759f2 / imagen @ac2cd1c0) entro en CrashLoopBackOff
    # por EAGLE3, no por memoria: isinstance(model, SupportsEagle3) se hace sobre
    # la clase de NIVEL SUPERIOR, que con el plugin es el wrapper de vision, y le
    # faltaban los cinco miembros del Protocol. La imagen @de1177fe los delega al
    # backbone y el build-check 3 falla el BUILD si vuelven a faltar.
    # ROLLBACK: devolver a 905086ae5ebfa5f88b66a73bcce97287a9335d6b (sin vision).
    # 2026-08-13: 7e551f8 expone lm_head en el wrapper de vision. 94b6009 ya
    # ARRANCABA (fix de EAGLE3) pero servia con acceptance 0.0124 y ~10 tok/s,
    # SIN un solo error en el log: dspark/utils.py lee
    # getattr(target_model, "lm_head") sobre la clase de nivel superior, que con
    # el plugin es el wrapper, y con has_own_lm_head=False el drafter tiene que
    # heredarla. Sin el atributo el reparto se salta y el drafter usa una cabeza
    # sin pesos. Imagen @acbf7de0 + build-check 4 que lo impide en el futuro.
    # ROLLBACK: 905086ae5ebfa5f88b66a73bcce97287a9335d6b (sin vision, 384K).
    # 2026-08-13: retire the dormant NVIDIA Qwen3.6 35B and Ornith residents,
    # the cold Qwen3 embedder/reranker challengers, and their residual Services.
    # 2026-08-13: caffbd7 ajusta DeepSeek TP=2 a tres secuencias concurrentes,
    # 262144 tokens y GPU_MEMORY_UTILIZATION=0.85; mantiene batch 8192, MTP k=5,
    # sampling probabilistic, pesos y topologia. ROLLBACK: b51fad4a5a98bc67.
    # 2026-08-13: bd570d0 saca el embedder y el reranker de llm-tp de la RTX de x86
    # (borra bge-m3-embedding-rtx y bge-reranker-rtx; con prune:true esto los BORRA
    # del cluster) y los deja en CPU en sauvage, ya no como fallback sino como
    # residentes del perfil. Rebasado sobre caffbd7, asi que se lleva el ajuste de
    # DeepSeek a tres secuencias sin tocarlo.
    # ORDEN OBLIGATORIO: primero ~/dgx-infra@60e01585 (COMPONENTS de compute_mode.py),
    # que ya esta desplegado. Al reves, _structural_conflicts() devuelve 409
    # missing_deployments y bloquea todo cambio de perfil en los dos sentidos.
    # Coste medido: embed p50 498 ms (RTX 123) y rerank p50 730 ms (RTX 77).
    # ROLLBACK: caffbd7e825dd010295d2956f4ca50b2676ee47c — y revertir tambien el
    # COMPONENTS del dashboard, o los -rtx que vuelvan no los gobernara nadie.
    # ── A/B TEMPORAL · brazo B de draft_sample_method (2026-08-13) ────────────
    # fb279923 = bd570d00 + UN delta: DRAFT_SAMPLE_METHOD probabilistic -> greedy
    # en el head y el worker de DeepSeek. Nada mas. Se rebaso sobre bd570d00 a
    # proposito para que la config sea EXACTAMENTE la del brazo A ya medido
    # (max_num_seqs=3, util 0.85); si no, no se compara nada.
    #
    # NO ES UNA MEJORA PROPUESTA. Es la mitad de una medida, y la hipotesis es que
    # PIERDA: a temperature 1.0 / top_p 0.95 (lo que impone FAMILY_SAMPLING de
    # LiteLLM para deepseek-v4) la aceptacion es el test de ratio p/q con la
    # softmax del draft, y `greedy` no la tiene — entra como one-hot.
    #
    # ROLLBACK, y hay que hacerlo en cuanto termine la medida:
    #   targetRevision: 193f99fed91a36ac3ebd8dcf023d1d0d1ddefbed
    # (era bd570d0; actualizado el 13-08-2026 porque 193f99f es el mismo arbol SIN
    # el brazo greedy pero CON el embedder/reranker ya en x86. Volver a bd570d0
    # los devolveria a sauvage, que es justo lo que se acaba de deshacer.)
    # Vive en rama propia (ab-draft-sample-greedy-20260813) justo para que nadie
    # se lo lleve por delante rodando su rama hacia delante.
    #
    # Medida y contexto: k8s/analysis/deepseek-v4-flash-2xspark/bench/ab-draft-sample/
    # 2026-08-13: 193f99f = fb27992 (brazo greedy, intacto) + el embedder y el
    # reranker de llm-tp de vuelta a CPU en x86. Estuvieron unas horas en sauvage y
    # no vale: topology=remote en OVH-FR mete la WAN en cada llamada de RAG.
    # Pareja obligatoria ya desplegada: ~/dgx-infra@acf1d3e1 (COMPONENTS). Los
    # nombres de Deployment no cambian, asi que el orden entre las dos da igual.
    # 2026-08-13: 747a53a = 193f99f + UNA linea: omnivoice-audio de 0 a 1 replica.
    # El brazo greedy del A/B y el embedder/reranker en x86 quedan INTACTOS —
    # verificado renderizando los dos overlays: el diff es esa linea y nada mas.
    # Es el unico servicio que sirve /audio/tts y /audio/transcribe (el modelo
    # crudo solo habla /v1/audio/speech y da 404 en /audio/*), asi que con el a 0
    # OpenClaw y los adapters de Synapse estaban MUDOS, y fallando en silencio.
    # No compite con DeepSeek: es un proxy de 105Mi medidos (pide 192Mi), no toca
    # la memoria unificada. stt-turbo sigue a 0 — el ASR se va al x86 aparte.
    # Se apila sobre la rama del A/B a proposito, para no competir por el pin.
    # ROLLBACK de SOLO esta linea: 193f99fed91a36ac3ebd8dcf023d1d0d1ddefbed
    # 2026-08-13: 2c2ab32 = 747a53a (gateway omnivoice-audio a 1, intacto) + quitar
    # el tope de hilos de los dos bge de CPU. OMP_NUM_THREADS=4 dejaba al embedder
    # clavado en 3 cores con el nodo al 33%, y con EMBEDDING_CONCURRENCY=1 el
    # trafico del brain se ponia en cola (p50 4661 ms, picos de 35 s; aislado
    # contesta en 270 ms).
    # 2026-08-13: 7305c30 acota los dos bge de CPU a 6 hilos. Acotado por medida
    # por los dos lados: con 4 el embedder se quedaba en 3 cores con el nodo al 33%
    # y encolaba el trafico del brain; sin tope, los dos pods cogian 6,3 cores cada
    # uno, x86 se iba al 88% de sus 16 y al reranker se le caian readiness Y
    # liveness. En sauvage (48 cores) esto no hacia falta; en 16 si.
    # 2026-08-13: 0f9c58a = 7305c30 + UN delta: DRAFT_SAMPLE_METHOD vuelve de
    # `greedy` a `probabilistic` en el head y el worker de DeepSeek. Conserva
    # intactos los bge de CPU a 6 hilos y el gateway de omnivoice de 7305c30 — por
    # eso el revert va ENCIMA y no devolviendo el pin a bd570d00.
    #
    # `greedy` entro en produccion sin que nadie lo decidiera: era el brazo B de un
    # A/B, vivia en rama aparte justo para que no pasara, y viajo igual porque esa
    # rama se rebaso dentro de bge-cpu-sauvage-20260813 y el pin la siguio.
    #
    # El A/B lo cierra con medida (3 corridas por condicion, misma config, 0 filas
    # fallidas). A temperature 1.0 / top_p 0.95, que es lo que LiteLLM impone a la
    # familia deepseek-v4, `greedy` pierde en las dos familias de prompt y en las
    # tres metricas: acceptance -7.27 pp (code) y -4.59 pp (varied), accept len
    # -0.366 / -0.230, tok/s -7.4 / -4.2.
    # Evidencia: k8s/analysis/deepseek-v4-flash-2xspark/bench/ab-draft-sample/
    # 2026-08-13: 1e3b23d = 0f9c58a + el ASR. Anade stt-turbo-x86 en `ubuntu`
    # (amd64, RTX compartida) y convierte el Service stt-turbo en pool por label
    # `stt-pool: turbo`. Ningun consumidor cambia de URL: gateway, dashboard y
