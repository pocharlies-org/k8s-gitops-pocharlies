apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
  labels:
    e-dani.com/tier: app
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
    targetRevision: deploy/prod
    path: helm/hermes
    helm:
      releaseName: hermes
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  # 28-09-2026 (Dani): sync MANUAL. Hermes (con los 16 bots de la compañía dentro) se despliega y reinicia SOLO
  # con el pipeline hermes-despliegue.yml del repo k8s-openclaw-qwen36-pocharlies, que hace el reinicio ordenado
  # (drena, espera a los turnos, sincroniza, recupera). Un merge ya no despliega solo; nada de sync ni restart a mano.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
