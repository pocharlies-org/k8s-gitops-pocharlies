name: Setup verified Buildx
description: >
  Instala Buildx y BuildKit verificados por checksum y crea un builder
  docker-container efímero. Una sola fuente para reusable-release y
  reusable-ci (SC-2749): deja BUILDX_BUILDER en el entorno del job.

inputs:
  builder_prefix:
    description: "Prefijo del nombre del builder (el nombre queda único por run)."
    required: false
    default: rho
  buildkit_image:
    description: "Imagen BuildKit fijada por digest."
    required: false
    default: moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

runs:
  using: composite
  steps:
    - name: Install verified Docker Buildx and BuildKit
      shell: bash
      env:
        BUILDX_VERSION: v0.36.0
        BUILDKIT_IMAGE: ${{ inputs.buildkit_image }}
        BUILDER_PREFIX: ${{ inputs.builder_prefix }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64; expected=07823fdfcd82a41be90155a8b16876c1a780a6462de805a9f3f63b3119ccfb99 ;;
          aarch64|arm64) arch=arm64; expected=70382de03915c07c488ae4ddc4f7e169ee978f953e754ecfce110ba017e0132b ;;
          *) echo "Unsupported Buildx runner architecture: $(uname -m)"; exit 1 ;;
        esac
        plugin_dir="$HOME/.docker/cli-plugins"
        mkdir -p "$plugin_dir"
        curl --retry 3 --retry-all-errors -fsSL \
          "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${arch}" \
          -o "$plugin_dir/docker-buildx"
        echo "${expected}  ${plugin_dir}/docker-buildx" | sha256sum --check --strict
        chmod 0755 "$plugin_dir/docker-buildx"
        docker buildx version
        builder="${BUILDER_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        echo "BUILDX_BUILDER=$builder" >> "$GITHUB_ENV"
        docker buildx create --name "$builder" \
          --driver docker-container \
          --driver-opt "image=${BUILDKIT_IMAGE}" \
          --use
        docker buildx inspect --bootstrap
