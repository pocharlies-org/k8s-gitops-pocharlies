name: probe-notify-migrado
on: { workflow_dispatch: {} }
permissions: { contents: read, actions: read }
jobs:
  probe:
    runs-on: arc-k8s
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Avisar con la accion compartida, igual que los reusables
        uses: ./.github/actions/notify-telegram
        with:
          token:   ${{ secrets.TELEGRAM_CI_BOT_TOKEN || secrets.OPENCLAW_TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CI_CHAT_ID  || secrets.OPENCLAW_TELEGRAM_TARGET }}
          thread_id: ${{ secrets.TELEGRAM_CI_THREAD_ID || '69' }}
          state: audit_fail
          text: |
            PRUEBA de la migracion de los 5 reusables (no es un fallo real)
            run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          strict: 'true'
