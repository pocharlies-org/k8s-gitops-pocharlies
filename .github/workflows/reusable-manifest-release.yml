name: Reusable Manifest OCI Release

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: arc-k8s
      source_path:
        description: Directory to publish as an Argo CD-compatible OCI artifact.
        type: string
        default: k8s
      artifact_name:
        description: Harbor artifact name. Empty means the GitHub repository name.
        type: string
        default: ""
      registry:
        type: string
        default: harbor.lan.e-dani.com
      registry_project:
        type: string
        default: homelab
      version:
        description: Artifact tag to publish. Empty means use the pushed Git tag.
        type: string
        default: ""
      deploy_branch:
        description: Branch Argo CD tracks after a successful release.
        type: string
        default: deploy/prod
      promotion_mode:
        description: "pull-request (recommended) or legacy-direct for callers not migrated yet."
        type: string
        default: legacy-direct
      oras_version:
        type: string
        default: "1.2.3"
    secrets:
      HARBOR_USER:
        required: true
      HARBOR_PASSWORD:
        required: true
      OPENCLAW_GITHUB_NOTIFY_URL:
        required: false
      OPENCLAW_GITHUB_NOTIFY_TOKEN:
        required: false
      OPENCLAW_TELEGRAM_BOT_TOKEN:
        required: false
      OPENCLAW_TELEGRAM_TARGET:
        required: false
      OPENCLAW_TELEGRAM_THREAD_ID:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish manifest bundle and promote deploy branch
    permissions:
      contents: write
      pull-requests: write
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine release metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_ARTIFACT: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            echo "Release must run from a Git tag or receive an explicit version input"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "OCI tag is not registry-compatible: $VERSION"
            exit 1
          fi

          case "${{ inputs.promotion_mode }}" in
            pull-request|legacy-direct) ;;
            *) echo "promotion_mode must be pull-request or legacy-direct"; exit 1 ;;
          esac

          if [ -n "$REQUESTED_ARTIFACT" ]; then
            ARTIFACT_NAME="$REQUESTED_ARTIFACT"
          else
            ARTIFACT_NAME="${GITHUB_REPOSITORY#*/}"
          fi

          SHORT_SHA="${GITHUB_SHA::12}"
          {
            echo "VERSION=$VERSION"
            echo "SHA_TAG=sha-${SHORT_SHA}"
            echo "ARTIFACT_NAME=$ARTIFACT_NAME"
          } >> "$GITHUB_ENV"

      - name: Install ORAS
        env:
          ORAS_VERSION: ${{ inputs.oras_version }}
        run: |
          set -euo pipefail
          if [ "$ORAS_VERSION" != "1.2.3" ]; then
            echo "oras_version must be the reviewed 1.2.3 release"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/oras" "$RUNNER_TEMP/bin"
          archive="$RUNNER_TEMP/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --retry 3 -fsSL \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            -o "$archive"
          echo "b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP/oras" oras
          install -m 0755 "$RUNNER_TEMP/oras/oras" "$RUNNER_TEMP/bin/oras"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Login to Harbor
        env:
          REGISTRY: ${{ inputs.registry }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          oras login "$REGISTRY" --username "$HARBOR_USER" --password-stdin <<< "$HARBOR_PASSWORD"

      - name: Publish Argo CD OCI manifest bundle
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PROJECT: ${{ inputs.registry_project }}
        run: |
          set -euo pipefail
          if [ ! -d "$SOURCE_PATH" ]; then
            echo "Source path does not exist: $SOURCE_PATH"
            exit 1
          fi

          REF="${REGISTRY}/${REGISTRY_PROJECT}/${ARTIFACT_NAME}:${VERSION}"
          SHA_REF="${REGISTRY}/${REGISTRY_PROJECT}/${ARTIFACT_NAME}:${SHA_TAG}"
          BUNDLE="$RUNNER_TEMP/${ARTIFACT_NAME}.tar.gz"

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.pnpm-store' \
            -czf "$BUNDLE" \
            -C "$SOURCE_PATH" .

          oras push \
            --disable-path-validation \
            --annotation "org.opencontainers.image.title=${ARTIFACT_NAME}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            "$REF" "$BUNDLE:application/vnd.oci.image.layer.v1.tar+gzip"
          oras copy "$REF" "$SHA_REF"

          ARTIFACT_DIGEST="$(oras resolve "$REF")"
          {
            echo "ARTIFACT_REF=$REF"
            echo "ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Promote deploy branch directly (deprecated compatibility mode)
        if: ${{ inputs.promotion_mode == 'legacy-direct' }}
        env:
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "HEAD:refs/heads/${DEPLOY_BRANCH}" --force-with-lease

      - name: Prepare promotion commit on latest Argo branch
        if: ${{ inputs.promotion_mode == 'pull-request' }}
        env:
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$GITHUB_SHA"
          PROMOTION_BRANCH="promotion/manifest-${VERSION}-${GITHUB_RUN_ID}"
          SOURCE_DATE="$(git show -s --format=%cI "$SOURCE_SHA")"

          git fetch origin "$DEPLOY_BRANCH"
          git checkout -B "$PROMOTION_BRANCH" "origin/$DEPLOY_BRANCH"
          git read-tree --reset -u "$SOURCE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "PROMOTION_NOOP=true" >> "$GITHUB_ENV"
            echo "Production tree already matches $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          GIT_AUTHOR_DATE="$SOURCE_DATE" GIT_COMMITTER_DATE="$SOURCE_DATE" \
            git commit -m "chore(prod): promote ${VERSION}"
          git push origin "HEAD:refs/heads/${PROMOTION_BRANCH}"
          {
            echo "PROMOTION_BRANCH=$PROMOTION_BRANCH"
            echo "PROMOTION_NOOP=false"
          } >> "$GITHUB_ENV"

      - name: Open production promotion pull request
        if: ${{ inputs.promotion_mode == 'pull-request' && env.PROMOTION_NOOP == 'false' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${process.env.PROMOTION_BRANCH}`;
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              head,
              base: process.env.DEPLOY_BRANCH,
              state: 'open',
              per_page: 1,
            });

            let url;
            if (existing.data.length > 0) {
              url = existing.data[0].html_url;
            } else {
              const body = [
                `Automated GitOps promotion for \`${process.env.VERSION}\`.`,
                '',
                `- source commit: \`${context.sha}\``,
                `- manifest artifact: \`${process.env.ARTIFACT_REF}@${process.env.ARTIFACT_DIGEST}\``,
                `- target branch: \`${process.env.DEPLOY_BRANCH}\``,
                '',
                `This branch was created from the latest \`${process.env.DEPLOY_BRANCH}\`; Argo CD must`,
                'reconcile only after this PR passes required checks and is reviewed/merged.',
                'No workflow will auto-merge this PR.',
              ].join('\n');
              const created = await github.rest.pulls.create({
                owner,
                repo,
                head: process.env.PROMOTION_BRANCH,
                base: process.env.DEPLOY_BRANCH,
                title: `chore(prod): promote ${process.env.VERSION}`,
                body,
              });
              url = created.data.html_url;
            }
            await core.summary.addRaw(`Promotion PR: ${url}\n`).write();

  notify:
    name: Notify OpenClaw on manifest release failure
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    needs: [publish]
    if: ${{ always() && (needs.publish.result == 'failure' || needs.publish.result == 'cancelled') }}
    timeout-minutes: 10
    steps:
      - name: Send failure report
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          OPENCLAW_GITHUB_NOTIFY_URL: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_URL }}
          OPENCLAW_GITHUB_NOTIFY_TOKEN: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_TOKEN }}
          OPENCLAW_TELEGRAM_BOT_TOKEN: ${{ secrets.OPENCLAW_TELEGRAM_BOT_TOKEN }}
          OPENCLAW_TELEGRAM_TARGET: ${{ secrets.OPENCLAW_TELEGRAM_TARGET }}
          OPENCLAW_TELEGRAM_THREAD_ID: ${{ secrets.OPENCLAW_TELEGRAM_THREAD_ID }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = [
              `GitHub Actions manifest release failed`,
              `repo: ${context.repo.owner}/${context.repo.repo}`,
              `ref: ${context.ref}`,
              `sha: ${context.sha.slice(0, 12)}`,
              `run: ${runUrl}`,
            ].join('\n');

            async function postWebhook() {
              const url = process.env.OPENCLAW_GITHUB_NOTIFY_URL;
              if (!url) return false;
              const headers = { 'content-type': 'application/json' };
              if (process.env.OPENCLAW_GITHUB_NOTIFY_TOKEN) {
                headers.authorization = `Bearer ${process.env.OPENCLAW_GITHUB_NOTIFY_TOKEN}`;
              }
              const response = await fetch(url, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  source: 'github-actions',
                  destination: { group: 'synaspte', topic: 'github' },
                  event: 'manifest_release_failed',
                  repo: `${context.repo.owner}/${context.repo.repo}`,
                  workflow: context.workflow,
                  runId: context.runId,
                  runNumber: context.runNumber,
                  ref: context.ref,
                  sha: context.sha,
                  actor: context.actor,
                  runUrl,
                  text,
                }),
              });
              if (!response.ok) core.warning(`OpenClaw webhook returned HTTP ${response.status}`);
              return true;
            }

            async function sendTelegramBotFallback() {
              if (!process.env.OPENCLAW_TELEGRAM_BOT_TOKEN) return false;
              if (!process.env.OPENCLAW_TELEGRAM_TARGET || !process.env.OPENCLAW_TELEGRAM_THREAD_ID) return false;
              const response = await fetch(
                `https://api.telegram.org/bot${process.env.OPENCLAW_TELEGRAM_BOT_TOKEN}/sendMessage`,
                {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    chat_id: process.env.OPENCLAW_TELEGRAM_TARGET,
                    message_thread_id: Number(process.env.OPENCLAW_TELEGRAM_THREAD_ID),
                    text,
                    disable_web_page_preview: true,
                  }),
                },
              );
              if (!response.ok) core.warning(`Telegram fallback returned HTTP ${response.status}`);
              return response.ok;
            }

            const webhookSent = await postWebhook();
            const telegramSent = webhookSent ? false : await sendTelegramBotFallback();
            if (!webhookSent && !telegramSent) {
              core.warning('OpenClaw notification skipped: configure OPENCLAW_GITHUB_NOTIFY_URL or OPENCLAW_TELEGRAM_BOT_TOKEN secrets');
            }
