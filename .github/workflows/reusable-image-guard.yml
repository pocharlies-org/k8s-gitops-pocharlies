name: Reusable image-guard

# Guard de tamaño de imágenes, estándar de la org (INFRA-536 C4 · INFRA-1298).
# Falla si la imagen pasa del tope absoluto, o si crece sobre la línea base
# (`docs/images/sizes-baseline.json` de `k8s-infra-pocharlies`, rama main) por
# encima del umbral; en modo `avisar` el crecimiento es un ::warning:: y el
# check pasa. La imagen sin línea base se propone en el log y no falla.
#
# Patrón de `reusable-duplicados.yml` y `reusable-alibaba-key-guard.yml`: este
# YAML es fino (runner, checkout del framework, herramientas fijadas); toda la
# lógica de decisión vive en `scripts/image-guard.py` con sus unittest en
# `tests/test_image_guard.py` (dentro del YAML no se prueban en CI).
#
# Herramientas, las dos como IMAGEN FIJADA POR DIGEST (skill `ci-runners-arc`:
# el runner arc-k8s no las trae; hadolint no se instala en ningún sitio):
#   - hadolint/hadolint@sha256:a1d49ae1… (v2.15.1-alpine, índice OCI): lee el
#     Dockerfile por stdin (`- < Dockerfile`), sin volúmenes — en DinD los
#     bind-mounts los resuelve el daemon del sidecar y solo se comparte lo que
#     está bajo /home/runner/_work.
#   - gcr.io/go-containerregistry/crane@sha256:1f968817… (v0.22.1): `manifest
#     --platform` (el comprimido es la suma de `layers[].size`, mismo método
#     que el inventario de INFRA-1296) y `digest --platform` para resolver el
#     tag a la clave de la baseline. `--platform` SIEMPRE, incluso con índices
#     de una sola plataforma.
#
# Credenciales (INFRA-1363): el consumidor pasa `HARBOR_USER`/`HARBOR_PASSWORD`
# (secretos opcionales del workflow_call) y el guard hace login en el registry de
# la imagen antes de medir con crane. Como crane corre como contenedor contra el
# daemon DinD (que no ve el $HOME del runner), el paso de login fija
# DOCKER_CONFIG bajo $GITHUB_WORKSPACE (única ruta compartida con el sidecar):
# ahí escribe el login la CLI de docker y desde ahí se monta en el contenedor de
# crane. Sin secretos el comportamiento es el de siempre: medición anónima,
# pública.
#
# Baseline (`baseline`): ruta en el repo que llama (p. ej. una copia en
# `docs/images/`), URL https, o el JSON en línea (empieza por `{`). La línea
# base canónica vive en `k8s-infra-pocharlies@main:docs/images/`. Una entrada
# de la baseline cuyo `comprimido` lleve el marcador `{"sin_dato": motivo}`
# (así marca el inventario el dato no obtenible) se trata como SIN línea base:
# el guard la propone y no falla — el no-dato no pone en rojo a una imagen sana.
#
# Consumidores: `uses:
# pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-image-guard.yml@{sha}`
# — fijado por SHA (los reusables se consumen así; `@main` no vale aquí porque
# el check de pins de este repo solo lo admite para acciones propias).

on:
  workflow_call:
    inputs:
      runner:
        description: Runner ARC del cluster.
        type: string
        default: arc-k8s
      dockerfile:
        description: Ruta del Dockerfile a lintear (relativa al repo que llama).
        type: string
        default: Dockerfile
      imagen:
        description: >
          Imagen a medir: repo@sha256:... (digest de manifiesto) o repo:tag
          (el tag lo resuelve el guard con `crane digest --platform`).
        type: string
        required: true
      baseline:
        description: >
          sizes-baseline.json: ruta en el repo que llama, URL https o JSON en
          línea. La canónica es la de k8s-infra-pocharlies@main:docs/images/.
        type: string
        default: docs/images/sizes-baseline.json
      modo:
        description: bloquear (el crecimiento falla) o avisar (::warning::).
        type: string
        default: bloquear
      tope:
        description: Tope absoluto en bytes (0 = sin tope). Falla en ambos modos.
        type: number
        default: 0
      crecimiento:
        description: Crecimiento relativo admitido sobre la baseline, en %.
        type: number
        default: 20
      plataforma:
        description: Plataforma al resolver el manifiesto (arc-k8s es amd64).
        type: string
        default: linux/amd64
      nombre:
        description: >
          Discriminador de concurrencia: dos guards del mismo PR (p. ej. el
          mismo Dockerfile en modo bloquear y en modo avisar, o dos imagenes)
          necesitan nombres distintos o el segundo cancela al primero. Un solo
          guard por PR: se deja vacio.
        type: string
        default: ''
      framework_sha:
        description: >
          SHA del framework (este repo) del que se trae scripts/image-guard.py.
          Vacio = el del propio reusable o main (lo normal). Solo para probar
          el guard contra una rama antes de fusionar el framework; los
          consumidores no lo pasan.
        type: string
        default: ''
    secrets:
      # Patrón SC-2685 (reusable-ci, reusable-release): en un workflow llamado,
      # un secreto no declarado se resuelve vacío. crane lee imágenes privadas
      # de Harbor (homelab/*): sin credenciales el guard muere en UNAUTHORIZED
      # al pull (INFRA-1363, run 43674488640 de skirmshop-labels). Opcionales:
      # una imagen en registry público (docker.io, ghcr) sigue midéndose sin
      # login. El consumidor los pasa: secrets: HARBOR_USER: secrets.HARBOR_USER…
      HARBOR_USER:
        required: false
      HARBOR_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  image-guard:
    name: image-guard
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Como en el job docker de reusable-ci: el `if` del login decide sobre
      # env, no sobre secrets (un secreto no pasado llega vacío, no undefined).
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
    concurrency:
      # Un push encima cancela la medición anterior: revisamos el ultimo
      # commit, no el penultimo. `nombre` separa los guards de un mismo PR
      # (medido en las PRs de prueba: sin él, el segundo job cancelaba al
      # primero).
      group: image-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.nombre && format('-{0}', inputs.nombre) || '' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the image-guard framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Mismo truco que duplicados y alibaba-key-guard: `job.workflow_*` no
          # es contexto documentado; si no resuelve quedan vacios y el fallback
          # deja las dos ramas apuntando al framework. `framework_sha` (vacio
          # para los consumidores) permite probar el guard contra una rama
          # antes de que el script exista en main.
          repository: ${{ job.workflow_repository || 'pocharlies-org/k8s-gitops-pocharlies' }}
          ref: ${{ inputs.framework_sha || job.workflow_sha || 'main' }}
          token: ${{ github.token }}
          persist-credentials: false
          path: .image-guard-framework

      - name: Lint the Dockerfile with pinned hadolint
        env:
          # Los inputs entran por entorno, nunca interpolados en el `run`:
          # `check-workflow-pins.py` lo rechaza y son texto de terceros.
          DOCKERFILE: ${{ inputs.dockerfile }}
          HADOLINT_IMAGE: hadolint/hadolint@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
        run: |
          set -euo pipefail
          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error::no existe el Dockerfile $DOCKERFILE"
            exit 1
          fi
          # La imagen fijada no trae ENTRYPOINT (su CMD es `/bin/hadolint -`):
          # el binario se pasa a mano. `-` = stdin: sin bind-mounts, nada que el
          # daemon de DinD pueda resolver mal.
          docker run --rm -i "$HADOLINT_IMAGE" /bin/hadolint - < "$DOCKERFILE"

      - name: Detect the registry of the image
        id: registry
        env:
          IMAGEN: ${{ inputs.imagen }}
        run: |
          set -euo pipefail
          # El primer segmento es registry solo si la referencia lleva '/' y el
          # segmento trae punto o puerto (harbor.e-dani.com/img:tag);
          # "alpine@sha256:…" y "alpine:3.19" son docker.io: sin login.
          host=""
          case "$IMAGEN" in
            */*)
              first="${IMAGEN%%/*}"
              case "$first" in
                *.*|*:*) host="$first" ;;
              esac
              ;;
          esac
          printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"

      - name: Log in to the image registry (private Harbor)
        # Solo con credenciales y registry propio: las imágenes de registry
        # público se miden anónimas como hasta ahora (superficie aditiva).
        # DOCKER_CONFIG bajo $GITHUB_WORKSPACE: la CLI de docker escribe el login
        # ahí y el contenedor de crane lo monta. Ni el $HOME del runner ni
        # $RUNNER_TEMP los ve el daemon DinD del sidecar (medido en
        # skirmshop-labels#274 con runner ARC: workspace=/github/workspace,
        # runner_temp=/github/runner_temp; solo el workspace se comparte). Va en
        # el env del paso, no del job: el contexto `runner`/`github` —el que sea—
        # no está permitido en el env del job y el workflow del consumidor no
        # cargaría (actionlint lo pilla; a nivel de paso sí lo está).
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/docker-config
        if: ${{ env.HARBOR_USER != '' && steps.registry.outputs.host != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Resolve the image manifest with pinned crane
        env:
          IMAGEN: ${{ inputs.imagen }}
          PLATAFORMA: ${{ inputs.plataforma }}
          CRANE_IMAGE: gcr.io/go-containerregistry/crane@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
        run: |
          set -euo pipefail
          crane_auth=()
          if [ -f "$GITHUB_WORKSPACE/docker-config/config.json" ]; then
            # La CLI de docker escribe config.json con modo 0600 y el contenedor
            # de crane corre como usuario sin privilegios: sin abrir el permiso
            # el montaje llega vacío de hecho y crane mide anónimo (medido con
            # job de diagnóstico en skirmshop-labels#274: 600 runner(1001) ->
            # UNAUTHORIZED; con a+rX -> manifiesto OK). El workspace es efímero
            # del job y la credencial es del propio consumidor: la exposición no
            # sale del runner que ya la tiene.
            chmod a+rX "$GITHUB_WORKSPACE/docker-config" "$GITHUB_WORKSPACE/docker-config/config.json"
            crane_auth=(-e DOCKER_CONFIG=/kaniko/.docker -v "$GITHUB_WORKSPACE/docker-config:/kaniko/.docker:ro")
          fi
          crane() { docker run --rm "${crane_auth[@]}" "$CRANE_IMAGE" "$@"; }
          crane manifest --platform "$PLATAFORMA" "$IMAGEN" > "$RUNNER_TEMP/manifest.json"
          case "$IMAGEN" in
            *@sha256:*) printf '%s' "${IMAGEN#*@}" > "$RUNNER_TEMP/digest.txt" ;;
            *) crane digest --platform "$PLATAFORMA" "$IMAGEN" > "$RUNNER_TEMP/digest.txt" ;;
          esac

      - name: Fetch the sizes baseline
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          case "$BASELINE" in
            http://*|https://*)
              curl --retry 3 --retry-all-errors -fsSL "$BASELINE" -o "$RUNNER_TEMP/baseline.json"
              ;;
            '{'*)
              printf '%s' "$BASELINE" > "$RUNNER_TEMP/baseline.json"
              ;;
            *)
              if [ ! -f "$BASELINE" ]; then
                echo "::error::no existe la baseline $BASELINE (ruta en el repo, URL https o JSON en línea)"
                exit 1
              fi
              cp "$BASELINE" "$RUNNER_TEMP/baseline.json"
              ;;
          esac

      - name: Guard size against the baseline
        env:
          IMAGEN: ${{ inputs.imagen }}
          MODO: ${{ inputs.modo }}
          TOPE: ${{ inputs.tope }}
          CRECIMIENTO: ${{ inputs.crecimiento }}
        run: |
          set -uo pipefail
          guard=.image-guard-framework/scripts/image-guard.py
          if [ ! -f "$guard" ]; then
            echo "::error::no se pudo traer el framework de image-guard"
            exit 1
          fi
          digesto=""
          [ -s "$RUNNER_TEMP/digest.txt" ] && digesto="$(cat "$RUNNER_TEMP/digest.txt")"
          # `--digest` se pasa siempre: vacio, el script usa el del @digest.
          python3 "$guard" \
            --imagen "$IMAGEN" \
            --digest "$digesto" \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --baseline "$RUNNER_TEMP/baseline.json" \
            --modo "$MODO" \
            --tope "$TOPE" \
            --crecimiento "$CRECIMIENTO"
