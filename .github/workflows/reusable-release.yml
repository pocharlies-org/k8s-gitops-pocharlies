name: Reusable Release

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: arc-k8s
      node_version:
        type: string
        default: "20"
      registry:
        type: string
        default: harbor.lan.e-dani.com
      registry_project:
        type: string
        default: homelab
      images:
        description: JSON array of {name, context, dockerfile}
        type: string
        required: true
      version:
        description: Image tag to publish. Empty means use the pushed Git tag.
        type: string
        default: ""
      docker_build_timeout:
        description: Per-image docker build timeout, passed to GNU timeout.
        type: string
        default: 30m
    secrets:
      HARBOR_USER:
        required: true
      HARBOR_PASSWORD:
        required: true
      OPENCLAW_GITHUB_NOTIFY_URL:
        required: false
      OPENCLAW_GITHUB_NOTIFY_TOKEN:
        required: false
      OPENCLAW_TELEGRAM_BOT_TOKEN:
        required: false
      OPENCLAW_TELEGRAM_TARGET:
        required: false
      OPENCLAW_TELEGRAM_THREAD_ID:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build and publish tagged images
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Determine image tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            echo "Release must run from a Git tag or receive an explicit version input"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "Image tag is not Docker-compatible: $VERSION"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::12}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA_TAG=sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: true

      # cosign-installer v4 documents that self-hosted runners may not work and
      # currently assumes `envsubst` is installed. ARC images intentionally do
      # not carry that package, so install the same upstream release from its
      # checksummed binary instead of weakening or skipping the signing gate.
      - name: Install verified Cosign
        env:
          COSIGN_VERSION: v3.0.6
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64)
              filename=cosign-linux-amd64
              expected=c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
              ;;
            aarch64|arm64)
              filename=cosign-linux-arm64
              expected=bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          install_dir="$RUNNER_TEMP/cosign-bin"
          mkdir -p "$install_dir"
          curl --retry 3 -fsSL \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${filename}" \
            -o "$install_dir/cosign"
          echo "${expected}  ${install_dir}/cosign" | sha256sum --check --strict
          chmod 0755 "$install_dir/cosign"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/cosign" version

      - name: Build and push release images
        env:
          IMAGES: ${{ inputs.images }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PROJECT: ${{ inputs.registry_project }}
          DOCKER_BUILD_TIMEOUT: ${{ inputs.docker_build_timeout }}
        run: |
          set -euo pipefail
          if ! echo "$DOCKER_BUILD_TIMEOUT" | grep -Eq '^[1-9][0-9]*[smh]$'; then
            echo "docker_build_timeout must be a positive duration ending in s, m or h"
            exit 1
          fi

          node <<'NODE' > "$RUNNER_TEMP/images.tsv"
          const images = JSON.parse(process.env.IMAGES || "[]");
          if (!Array.isArray(images) || images.length === 0) {
            throw new Error("images must be a non-empty JSON array");
          }
          const imageName = /^[a-z0-9][a-z0-9._/-]{0,127}$/;
          const safePath = /^(?!\/)(?!.*(?:^|\/)\.\.(?:\/|$))[^\t\r\n]+$/;
          for (const image of images) {
            if (!image || typeof image !== "object" || !imageName.test(image.name || "")) {
              throw new Error("each image name must be a registry-safe relative path");
            }
            const context = image.context || ".";
            const dockerfile = image.dockerfile || "Dockerfile";
            if (!safePath.test(context) || !safePath.test(dockerfile)) {
              throw new Error(`unsafe context or dockerfile for ${image.name}`);
            }
            console.log([
              image.name,
              context,
              dockerfile,
            ].join("\t"));
          }
          NODE

          evidence_dir="$RUNNER_TEMP/release-security-evidence"
          mkdir -p "$evidence_dir/sbom" "$evidence_dir/provenance"
          : > "$evidence_dir/evidence.ndjson"

          push_image() {
            ref="$1"
            for attempt in 1 2 3 4 5; do
              if docker push "$ref"; then
                return 0
              fi
              sleep "$((attempt * 5))"
            done
            echo "Failed to push $ref"
            return 1
          }

          while IFS=$'\t' read -r name context dockerfile; do
            [ -n "$name" ] || continue
            base="${REGISTRY}/${REGISTRY_PROJECT}/${name}"
            version_ref="${base}:${VERSION}"
            sha_ref="${base}:${SHA_TAG}"
            safe_name="${name//\//-}"
            sbom="$evidence_dir/sbom/${safe_name}.spdx.json"
            provenance="$evidence_dir/provenance/${safe_name}.slsa-v1.json"
            build_started_on="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            timeout "$DOCKER_BUILD_TIMEOUT" docker build \
              --progress=plain \
              --network=host \
              --file "$dockerfile" \
              --tag "$version_ref" \
              --tag "$sha_ref" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              "$context"

            # Fail before publication when a fixable HIGH/CRITICAL
            # vulnerability or an embedded secret is detected.
            trivy image \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --timeout 15m \
              "$version_ref"
            trivy image \
              --scanners vuln \
              --format spdx-json \
              --output "$sbom" \
              --timeout 15m \
              "$version_ref"

            push_image "$version_ref"
            push_image "$sha_ref"

            manifest="$(docker buildx imagetools inspect "$version_ref" --format '{{json .Manifest}}')"
            digest="$(MANIFEST="$manifest" node -e '
              const manifest = JSON.parse(process.env.MANIFEST);
              if (!/^sha256:[a-f0-9]{64}$/.test(manifest.digest || "")) process.exit(1);
              process.stdout.write(manifest.digest);
            ')"
            unset manifest
            digest_ref="${base}@${digest}"

            build_finished_on="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            NAME="$name" CONTEXT="$context" DOCKERFILE="$dockerfile" \
              VERSION_REF="$version_ref" SHA_REF="$sha_ref" \
              BUILD_STARTED_ON="$build_started_on" BUILD_FINISHED_ON="$build_finished_on" \
              PROVENANCE_FILE="$provenance" node <<'NODE'
          const fs = require("fs");
          const predicate = {
            buildDefinition: {
              buildType: "https://github.com/Attestations/GitHubActionsWorkflow@v1",
              externalParameters: {
                repository: process.env.GITHUB_REPOSITORY,
                ref: process.env.GITHUB_REF,
                workflow: process.env.GITHUB_WORKFLOW_REF,
                image: {
                  name: process.env.NAME,
                  context: process.env.CONTEXT,
                  dockerfile: process.env.DOCKERFILE,
                  tags: [process.env.VERSION_REF, process.env.SHA_REF],
                },
              },
              internalParameters: {
                githubRunId: process.env.GITHUB_RUN_ID,
                githubRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
              },
              resolvedDependencies: [{
                uri: `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git@${process.env.GITHUB_REF}`,
                digest: { sha1: process.env.GITHUB_SHA },
              }],
            },
            runDetails: {
              builder: {
                id: "https://github.com/pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-release.yml",
              },
              metadata: {
                invocationId: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`,
                startedOn: process.env.BUILD_STARTED_ON,
                finishedOn: process.env.BUILD_FINISHED_ON,
              },
            },
          };
          fs.writeFileSync(process.env.PROVENANCE_FILE, `${JSON.stringify(predicate, null, 2)}\n`);
          NODE

            # The OIDC signature is created only after the scan passes. Attach
            # the SPDX SBOM and SLSA v1 build provenance as independently
            # verifiable, signed in-toto attestations to the same digest.
            cosign sign --yes "$digest_ref"
            cosign attest --yes --type spdxjson --predicate "$sbom" "$digest_ref"
            cosign attest --yes --type slsaprovenance1 --predicate "$provenance" "$digest_ref"

            # GitHub records the reusable workflow in Sigstore's
            # `job_workflow_ref` claim.  The caller repository remains in the
            # image provenance labels, but it is not the certificate SAN.
            # Trust only this centrally reviewed release workflow, whether a
            # caller pins it by branch/tag or by an immutable commit SHA.
            certificate_identity="^https://github.com/pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-release\\.yml@(refs/(heads|tags)/.+|[0-9a-f]{40})$"
            certificate_issuer="https://token.actions.githubusercontent.com"
            cosign verify \
              --certificate-identity-regexp "$certificate_identity" \
              --certificate-oidc-issuer "$certificate_issuer" \
              "$digest_ref" >/dev/null
            cosign verify-attestation \
              --type spdxjson \
              --certificate-identity-regexp "$certificate_identity" \
              --certificate-oidc-issuer "$certificate_issuer" \
              "$digest_ref" >/dev/null
            cosign verify-attestation \
              --type slsaprovenance1 \
              --certificate-identity-regexp "$certificate_identity" \
              --certificate-oidc-issuer "$certificate_issuer" \
              "$digest_ref" >/dev/null

            NAME="$name" VERSION_REF="$version_ref" SHA_REF="$sha_ref" \
              DIGEST_REF="$digest_ref" SBOM_FILE="sbom/${safe_name}.spdx.json" \
              PROVENANCE_FILE="provenance/${safe_name}.slsa-v1.json" \
              node <<'NODE' >> "$evidence_dir/evidence.ndjson"
          const record = {
            image: process.env.NAME,
            versionRef: process.env.VERSION_REF,
            shaRef: process.env.SHA_REF,
            digestRef: process.env.DIGEST_REF,
            sourceRevision: process.env.GITHUB_SHA,
            sbom: process.env.SBOM_FILE,
            provenance: process.env.PROVENANCE_FILE,
            vulnerabilityGate: "fixable HIGH/CRITICAL and embedded secrets",
            signature: "sigstore-keyless",
            attestations: ["https://spdx.dev/Document", "https://slsa.dev/provenance/v1"],
          };
          process.stdout.write(`${JSON.stringify(record)}\n`);
          NODE
          done < "$RUNNER_TEMP/images.tsv"

          EVIDENCE_DIR="$evidence_dir" node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const dir = process.env.EVIDENCE_DIR;
          const records = fs.readFileSync(path.join(dir, "evidence.ndjson"), "utf8")
            .split("\n").filter(Boolean).map(JSON.parse);
          fs.writeFileSync(path.join(dir, "release-evidence.json"), `${JSON.stringify(records, null, 2)}\n`);
          const rows = records.map((r) => `| ${r.image} | \`${r.digestRef}\` | signed + SBOM + SLSA v1 provenance attested |`).join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Immutable release evidence\n\n| Image | Digest | Gates |\n|---|---|---|\n${rows}\n`);
          NODE

      - name: Upload release security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-security-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/release-security-evidence
          if-no-files-found: error
          retention-days: 90

  notify:
    name: Notify OpenClaw on release failure
    runs-on: ${{ inputs.runner }}
    needs: [release]
    if: ${{ always() && (needs.release.result == 'failure' || needs.release.result == 'cancelled') }}
    timeout-minutes: 10
    steps:
      - name: Send failure report
        uses: actions/github-script@v8
        env:
          OPENCLAW_GITHUB_NOTIFY_URL: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_URL }}
          OPENCLAW_GITHUB_NOTIFY_TOKEN: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_TOKEN }}
          OPENCLAW_TELEGRAM_BOT_TOKEN: ${{ secrets.OPENCLAW_TELEGRAM_BOT_TOKEN }}
          OPENCLAW_TELEGRAM_TARGET: ${{ secrets.OPENCLAW_TELEGRAM_TARGET }}
          OPENCLAW_TELEGRAM_THREAD_ID: ${{ secrets.OPENCLAW_TELEGRAM_THREAD_ID }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = [
              `GitHub Actions release failed`,
              `repo: ${context.repo.owner}/${context.repo.repo}`,
              `ref: ${context.ref}`,
              `sha: ${context.sha.slice(0, 12)}`,
              `run: ${runUrl}`,
            ].join('\n');

            async function postWebhook() {
              const url = process.env.OPENCLAW_GITHUB_NOTIFY_URL;
              if (!url) return false;
              const headers = { 'content-type': 'application/json' };
              if (process.env.OPENCLAW_GITHUB_NOTIFY_TOKEN) {
                headers.authorization = `Bearer ${process.env.OPENCLAW_GITHUB_NOTIFY_TOKEN}`;
              }
              const response = await fetch(url, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  source: 'github-actions',
                  destination: { group: 'synaspte', topic: 'github' },
                  event: 'release_failed',
                  repo: `${context.repo.owner}/${context.repo.repo}`,
                  workflow: context.workflow,
                  runId: context.runId,
                  runNumber: context.runNumber,
                  ref: context.ref,
                  sha: context.sha,
                  actor: context.actor,
                  runUrl,
                  text,
                }),
              });
              if (!response.ok) core.warning(`OpenClaw webhook returned HTTP ${response.status}`);
              return true;
            }

            async function sendTelegramBotFallback() {
              if (!process.env.OPENCLAW_TELEGRAM_BOT_TOKEN) return false;
              if (!process.env.OPENCLAW_TELEGRAM_TARGET || !process.env.OPENCLAW_TELEGRAM_THREAD_ID) return false;
              const response = await fetch(
                `https://api.telegram.org/bot${process.env.OPENCLAW_TELEGRAM_BOT_TOKEN}/sendMessage`,
                {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    chat_id: process.env.OPENCLAW_TELEGRAM_TARGET,
                    message_thread_id: Number(process.env.OPENCLAW_TELEGRAM_THREAD_ID),
                    text,
                    disable_web_page_preview: true,
                  }),
                },
              );
              if (!response.ok) core.warning(`Telegram fallback returned HTTP ${response.status}`);
              return response.ok;
            }

            const webhookSent = await postWebhook();
            const telegramSent = webhookSent ? false : await sendTelegramBotFallback();
            if (!webhookSent && !telegramSent) {
              core.warning('OpenClaw notification skipped: configure OPENCLAW_GITHUB_NOTIFY_URL or OPENCLAW_TELEGRAM_BOT_TOKEN secrets');
            }
