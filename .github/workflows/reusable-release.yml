name: Reusable Release

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: arc-k8s
      node_version:
        description: "Reviewed Node line: 22 or 24 (mapped to an exact checksummed patch)."
        type: string
        default: "24"
      registry:
        type: string
        default: harbor.lan.e-dani.com
      registry_project:
        type: string
        default: homelab
      images:
        description: JSON array of {name, context, dockerfile}
        type: string
        required: true
      version:
        description: Image tag to publish. Empty means use the pushed Git tag.
        type: string
        default: ""
      docker_build_timeout:
        description: Per-image docker build timeout, passed to GNU timeout.
        type: string
        default: 30m
    secrets:
      HARBOR_USER:
        required: true
      HARBOR_PASSWORD:
        required: true
      OPENCLAW_TELEGRAM_BOT_TOKEN:
        required: false
      OPENCLAW_TELEGRAM_TARGET:
        required: false
      OPENCLAW_TELEGRAM_THREAD_ID:
        required: false
    outputs:
      release_images:
        description: Canonical JSON array of registry-verified image digests.
        value: ${{ jobs.release.outputs.release_images }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish tagged images
    outputs:
      release_images: ${{ steps.publish.outputs.release_images }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install verified Node.js
        env:
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          case "$NODE_VERSION" in
            22|22.23.2) version=v22.23.2 ;;
            24|24.19.0) version=v24.19.0 ;;
            *) echo "node_version must be reviewed line 22 or 24"; exit 1 ;;
          esac
          case "${version}:$(uname -m)" in
            v22.23.2:x86_64|v22.23.2:amd64) arch=x64; expected=b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a ;;
            v22.23.2:aarch64|v22.23.2:arm64) arch=arm64; expected=013b59cfd2819703a6f4a14ab891fc46fc2a4e3f5bcd92de3fb4929b43e35b30 ;;
            v24.19.0:x86_64|v24.19.0:amd64) arch=x64; expected=f625d97cd707df4ff96254916fbc5ff014f09c09effe5a1e0ca8f6d41a8789d4 ;;
            v24.19.0:aarch64|v24.19.0:arm64) arch=arm64; expected=d28c8a5bf0a808f0ed434a1dce8c54ae98f0371c0bd86ac58abc613f73e6643f ;;
            *) echo "Unsupported Node runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/node-${version}-${arch}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://nodejs.org/dist/${version}/node-${version}-linux-${arch}.tar.gz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${version}-linux-${arch}/bin" >> "$GITHUB_PATH"

      - name: Determine image tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            echo "Release must run from a Git tag or receive an explicit version input"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "Image tag is not Docker-compatible: $VERSION"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::12}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA_TAG=sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Validate fixed release registry
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PROJECT: ${{ inputs.registry_project }}
        run: |
          set -euo pipefail
          if [ "$REGISTRY" != "harbor.lan.e-dani.com" ]; then
            echo "Release registry is not allowlisted: $REGISTRY"
            exit 1
          fi
          if ! echo "$REGISTRY_PROJECT" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,62}$'; then
            echo "Invalid registry project: $REGISTRY_PROJECT"
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Install verified Docker Buildx and BuildKit
        env:
          BUILDX_VERSION: v0.36.0
          BUILDKIT_IMAGE: moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64; expected=07823fdfcd82a41be90155a8b16876c1a780a6462de805a9f3f63b3119ccfb99 ;;
            aarch64|arm64) arch=arm64; expected=70382de03915c07c488ae4ddc4f7e169ee978f953e754ecfce110ba017e0132b ;;
            *) echo "Unsupported Buildx runner architecture: $(uname -m)"; exit 1 ;;
          esac
          plugin_dir="$HOME/.docker/cli-plugins"
          mkdir -p "$plugin_dir"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${arch}" \
            -o "$plugin_dir/docker-buildx"
          echo "${expected}  ${plugin_dir}/docker-buildx" | sha256sum --check --strict
          chmod 0755 "$plugin_dir/docker-buildx"
          docker buildx version
          builder="rho-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BUILDX_BUILDER=$builder" >> "$GITHUB_ENV"
          docker buildx create --name "$builder" \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use
          docker buildx inspect --bootstrap

      - name: Install verified Trivy
        env:
          TRIVY_VERSION: v0.70.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) arch=64bit; expected=8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9 ;;
            aarch64|arm64) arch=ARM64; expected=2f6bb988b553a1bbac6bdd1ce890f5e412439564e17522b88a4541b4f364fc8d ;;
            *) echo "Unsupported Trivy runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/trivy-${TRIVY_VERSION}-${arch}.tar.gz"
          install_dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$install_dir"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-${arch}.tar.gz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$install_dir" trivy
          chmod 0755 "$install_dir/trivy"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/trivy" --version

      # cosign-installer v4 documents that self-hosted runners may not work and
      # currently assumes `envsubst` is installed. ARC images intentionally do
      # not carry that package, so install the same upstream release from its
      # checksummed binary instead of weakening or skipping the signing gate.
      - name: Install verified Cosign
        env:
          COSIGN_VERSION: v3.0.6
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64)
              filename=cosign-linux-amd64
              expected=c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
              ;;
            aarch64|arm64)
              filename=cosign-linux-arm64
              expected=bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          install_dir="$RUNNER_TEMP/cosign-bin"
          mkdir -p "$install_dir"
          curl --retry 3 -fsSL \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${filename}" \
            -o "$install_dir/cosign"
          echo "${expected}  ${install_dir}/cosign" | sha256sum --check --strict
          chmod 0755 "$install_dir/cosign"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/cosign" version

      - name: Build and push release images
        id: publish
        env:
          IMAGES: ${{ inputs.images }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PROJECT: ${{ inputs.registry_project }}
          DOCKER_BUILD_TIMEOUT: ${{ inputs.docker_build_timeout }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          if ! echo "$DOCKER_BUILD_TIMEOUT" | grep -Eq '^[1-9][0-9]*[smh]$'; then
            echo "docker_build_timeout must be a positive duration ending in s, m or h"
            exit 1
          fi
          if ! echo "$JOB_WORKFLOW_REF" | grep -Eq '^pocharlies-org/k8s-gitops-pocharlies/\.github/workflows/reusable-release\.yml@[0-9a-f]{40}$'; then
            echo "Reusable release workflow must be called by immutable commit SHA"
            exit 1
          fi
          if [ "${JOB_WORKFLOW_REF##*@}" != "$JOB_WORKFLOW_SHA" ]; then
            echo "Reusable release workflow ref/SHA mismatch"
            exit 1
          fi

          node <<'NODE' > "$RUNNER_TEMP/images.tsv"
          const images = JSON.parse(process.env.IMAGES || "[]");
          if (!Array.isArray(images) || images.length === 0) {
            throw new Error("images must be a non-empty JSON array");
          }
          const imageName = /^[a-z0-9][a-z0-9._/-]{0,127}$/;
          const imageSegment = /^[a-z0-9][a-z0-9._-]*$/;
          const safePath = /^(?:\.|[A-Za-z0-9_][A-Za-z0-9._/-]*)$/;
          const names = new Set();
          for (const image of images) {
            if (!image || typeof image !== "object" || !imageName.test(image.name || "") ||
                image.name.split("/").some((segment) => !imageSegment.test(segment))) {
              throw new Error("each image name must be a registry-safe relative path");
            }
            if (names.has(image.name)) {
              throw new Error(`duplicate image name: ${image.name}`);
            }
            names.add(image.name);
            const context = image.context || ".";
            const dockerfile = image.dockerfile || "Dockerfile";
            if (!safePath.test(context) || !safePath.test(dockerfile) ||
                context.split("/").includes("..") || dockerfile.split("/").includes("..")) {
              throw new Error(`unsafe context or dockerfile for ${image.name}`);
            }
            console.log([
              image.name,
              context,
              dockerfile,
            ].join("\t"));
          }
          NODE

          evidence_dir="$RUNNER_TEMP/release-security-evidence"
          mkdir -p "$evidence_dir/sbom" "$evidence_dir/provenance" "$evidence_dir/trivy"
          : > "$evidence_dir/evidence.ndjson"
          : > "$evidence_dir/promotions.tsv"

          if [ -e .trivyignore ]; then
            echo "Legacy .trivyignore is forbidden; use typed JSON-subset .trivyignore.yaml"
            exit 1
          fi
          policy_source=""
          if [ -e .trivyignore.yaml ]; then
            policy_source=.trivyignore.yaml
          fi
          POLICY_SOURCE="$policy_source" POLICY_OUTPUT="$evidence_dir/trivy-policy.trivyignore.yaml" node <<'NODE'
          const fs = require("fs");
          const source = process.env.POLICY_SOURCE;
          const policy = source
            ? JSON.parse(fs.readFileSync(source, "utf8"))
            : { vulnerabilities: [], misconfigurations: [], secrets: [], licenses: [] };
          const schemas = {
            vulnerabilities: new Set(["id", "paths", "purls", "expired_at", "statement"]),
            misconfigurations: new Set(["id", "paths", "expired_at", "statement"]),
            secrets: new Set(["id", "paths", "expired_at", "statement"]),
            licenses: new Set(["id", "paths", "expired_at", "statement"]),
          };
          if (!policy || typeof policy !== "object" || Array.isArray(policy)) {
            throw new Error("Trivy policy must be an object");
          }
          for (const key of Object.keys(policy)) {
            if (!schemas[key]) throw new Error(`unknown Trivy policy section: ${key}`);
          }
          const today = new Date().toISOString().slice(0, 10);
          const ids = new Set();
          for (const [section, allowed] of Object.entries(schemas)) {
            const entries = policy[section] ?? [];
            if (!Array.isArray(entries)) throw new Error(`${section} must be an array`);
            policy[section] = entries;
            for (const [index, entry] of entries.entries()) {
              if (!entry || typeof entry !== "object" || Array.isArray(entry)) {
                throw new Error(`${section}[${index}] must be an object`);
              }
              for (const key of Object.keys(entry)) {
                if (!allowed.has(key)) throw new Error(`unknown ${section}[${index}] field: ${key}`);
              }
              if (typeof entry.id !== "string" || !entry.id.trim()) {
                throw new Error(`${section}[${index}].id is required`);
              }
              if (ids.has(entry.id)) throw new Error(`duplicate Trivy policy id: ${entry.id}`);
              ids.add(entry.id);
              if (typeof entry.statement !== "string" || !entry.statement.trim()) {
                throw new Error(`${section}[${index}].statement is required`);
              }
              if (!/^\d{4}-\d{2}-\d{2}$/.test(entry.expired_at || "") || entry.expired_at <= today) {
                throw new Error(`${section}[${index}].expired_at must be a future UTC date`);
              }
              if (new Date(`${entry.expired_at}T00:00:00Z`).toISOString().slice(0, 10) !== entry.expired_at) {
                throw new Error(`${section}[${index}].expired_at is not a calendar date`);
              }
              for (const field of ["paths", "purls"]) {
                if (entry[field] !== undefined && (
                  !Array.isArray(entry[field]) || entry[field].some((value) => typeof value !== "string" || !value)
                )) throw new Error(`${section}[${index}].${field} must contain non-empty strings`);
              }
            }
          }
          // Authors write `expired_at` as a bare calendar date (enforced above),
          // which is what the Trivy docs show — but their examples are real YAML,
          // where the parser coerces an unquoted date to a timestamp natively.
          // This file is emitted as JSON, so the date arrives QUOTED and Trivy's
          // Go decoder, which maps the field onto time.Time with an RFC3339
          // layout, dies with:
          //   parse error: yaml decode error: parsing time "2026-09-14" as
          //   "2006-01-02T15:04:05Z07:00": cannot parse "" as "T"
          // Reproduced against trivy v0.70.0, the version this workflow pins.
          // Normalise to midnight UTC on the way out: same instant, same
          // human-friendly input contract, and a layout Trivy can decode.
          const serialisable = Object.fromEntries(
            Object.entries(policy).map(([section, entries]) => [
              section,
              entries.map((entry) => ({ ...entry, expired_at: `${entry.expired_at}T00:00:00Z` })),
            ]),
          );
          fs.writeFileSync(process.env.POLICY_OUTPUT, `${JSON.stringify(serialisable, null, 2)}\n`);
          NODE
          policy_file="$evidence_dir/trivy-policy.trivyignore.yaml"
          policy_sha="$(sha256sum "$policy_file" | cut -d' ' -f1)"

          harbor_netrc="$RUNNER_TEMP/harbor-release.netrc"
          printf 'machine %s login %s password %s\n' "$REGISTRY" "$HARBOR_USER" "$HARBOR_PASSWORD" > "$harbor_netrc"
          chmod 0600 "$harbor_netrc"

          push_image() {
            ref="$1"
            for attempt in 1 2 3 4 5; do
              if docker push "$ref"; then
                return 0
              fi
              sleep "$((attempt * 5))"
            done
            echo "Failed to push $ref"
            return 1
          }

          while IFS=$'\t' read -r name context dockerfile; do
            [ -n "$name" ] || continue
            base="${REGISTRY}/${REGISTRY_PROJECT}/${name}"
            version_ref="${base}:${VERSION}"
            sha_ref="${base}:${SHA_TAG}"
            candidate_ref="${base}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            safe_name="$(printf '%s' "$name" | sha256sum | cut -c1-32)"
            sbom="$evidence_dir/sbom/${safe_name}.spdx.json"
            provenance="$evidence_dir/provenance/${safe_name}.slsa-v1.json"
            trivy_report="$evidence_dir/trivy/${safe_name}.json"
            build_started_on="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            timeout "$DOCKER_BUILD_TIMEOUT" docker buildx build \
              --load \
              --progress=plain \
              --file "$dockerfile" \
              --tag "$candidate_ref" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              "$context"

            # Fail before publication when a fixable HIGH/CRITICAL
            # vulnerability or an embedded secret is detected.
            trivy image \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile "$policy_file" \
              --show-suppressed \
              --format json \
              --output "$trivy_report" \
              --exit-code 1 \
              --timeout 15m \
              "$candidate_ref"
            trivy image \
              --scanners vuln \
              --ignorefile "$policy_file" \
              --format spdx-json \
              --output "$sbom" \
              --timeout 15m \
              "$candidate_ref"

            suppressed_count="$(POLICY_FILE="$policy_file" REPORT_FILE="$trivy_report" node <<'NODE'
          const fs = require("fs");
          const policy = JSON.parse(fs.readFileSync(process.env.POLICY_FILE, "utf8"));
          const allowed = new Set(Object.values(policy).flat().map((entry) => entry.id));
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, "utf8"));
          let count = 0;
          for (const result of report.Results || []) {
            for (const finding of result.ModifiedFindings || []) {
              const id = finding.VulnerabilityID || finding.RuleID || finding.ID;
              if (!id || !allowed.has(id)) throw new Error(`unapproved suppressed Trivy finding: ${id || "unknown"}`);
              count += 1;
            }
          }
          process.stdout.write(String(count));
          NODE
            )"

            # Publish only an explicitly non-release candidate until every
            # image has passed scan, signature, attestation and verification.
            push_image "$candidate_ref"

            manifest="$(docker buildx imagetools inspect "$candidate_ref" --format '{{json .Manifest}}')"
            digest="$(MANIFEST="$manifest" node -e '
              const manifest = JSON.parse(process.env.MANIFEST);
              if (!/^sha256:[a-f0-9]{64}$/.test(manifest.digest || "")) process.exit(1);
              process.stdout.write(manifest.digest);
            ')"
            unset manifest
            digest_ref="${base}@${digest}"

            build_finished_on="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            NAME="$name" CONTEXT="$context" DOCKERFILE="$dockerfile" \
              VERSION_REF="$version_ref" SHA_REF="$sha_ref" \
              BUILD_STARTED_ON="$build_started_on" BUILD_FINISHED_ON="$build_finished_on" \
              PROVENANCE_FILE="$provenance" node <<'NODE'
          const fs = require("fs");
          const predicate = {
            buildDefinition: {
              buildType: "https://github.com/Attestations/GitHubActionsWorkflow@v1",
              externalParameters: {
                repository: process.env.GITHUB_REPOSITORY,
                ref: process.env.GITHUB_REF,
                workflow: process.env.GITHUB_WORKFLOW_REF,
                image: {
                  name: process.env.NAME,
                  context: process.env.CONTEXT,
                  dockerfile: process.env.DOCKERFILE,
                  tags: [process.env.VERSION_REF, process.env.SHA_REF],
                },
              },
              internalParameters: {
                githubRunId: process.env.GITHUB_RUN_ID,
                githubRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
                jobWorkflowSha: process.env.JOB_WORKFLOW_SHA,
              },
              resolvedDependencies: [{
                uri: `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git@${process.env.GITHUB_REF}`,
                digest: { sha1: process.env.GITHUB_SHA },
              }],
            },
            runDetails: {
              builder: {
                id: `https://github.com/${process.env.JOB_WORKFLOW_REF}`,
              },
              metadata: {
                invocationId: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`,
                startedOn: process.env.BUILD_STARTED_ON,
                finishedOn: process.env.BUILD_FINISHED_ON,
              },
            },
          };
          fs.writeFileSync(process.env.PROVENANCE_FILE, `${JSON.stringify(predicate, null, 2)}\n`);
          NODE

            # The OIDC signature is created only after the scan passes. Attach
            # the SPDX SBOM and SLSA v1 build provenance as independently
            # verifiable, signed in-toto attestations to the same digest.
            cosign sign --yes "$digest_ref"
            cosign attest --yes --type spdxjson --predicate "$sbom" "$digest_ref"
            cosign attest --yes --type slsaprovenance1 --predicate "$provenance" "$digest_ref"

            # GitHub records the exact called workflow in Sigstore's
            # `job_workflow_ref` claim. It was validated above as a commit
            # SHA; verify that one identity, never a mutable branch or tag.
            certificate_identity="https://github.com/${JOB_WORKFLOW_REF}"
            certificate_issuer="https://token.actions.githubusercontent.com"
            cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer "$certificate_issuer" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              "$digest_ref" >/dev/null
            cosign verify-attestation \
              --type spdxjson \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer "$certificate_issuer" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              "$digest_ref" >/dev/null
            cosign verify-attestation \
              --type slsaprovenance1 \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer "$certificate_issuer" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              "$digest_ref" >/dev/null

            NAME="$name" VERSION_REF="$version_ref" SHA_REF="$sha_ref" \
              DIGEST_REF="$digest_ref" SBOM_FILE="sbom/${safe_name}.spdx.json" \
              PROVENANCE_FILE="provenance/${safe_name}.slsa-v1.json" \
              TRIVY_REPORT="trivy/${safe_name}.json" TRIVY_POLICY_SHA="$policy_sha" \
              SUPPRESSED_COUNT="$suppressed_count" \
              node <<'NODE' >> "$evidence_dir/evidence.ndjson"
          const record = {
            image: process.env.NAME,
            versionRef: process.env.VERSION_REF,
            shaRef: process.env.SHA_REF,
            digestRef: process.env.DIGEST_REF,
            sourceRevision: process.env.GITHUB_SHA,
            sbom: process.env.SBOM_FILE,
            provenance: process.env.PROVENANCE_FILE,
            trivyReport: process.env.TRIVY_REPORT,
            trivyPolicySha256: process.env.TRIVY_POLICY_SHA,
            suppressedFindings: Number(process.env.SUPPRESSED_COUNT),
            vulnerabilityGate: "fixable HIGH/CRITICAL vulnerabilities and embedded secrets after validated, time-bound typed policy",
            signature: "sigstore-keyless",
            attestations: ["https://spdx.dev/Document", "https://slsa.dev/provenance/v1"],
          };
          process.stdout.write(`${JSON.stringify(record)}\n`);
          NODE
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$name" "$candidate_ref" "$digest_ref" "$version_ref" "$sha_ref" \
              >> "$evidence_dir/promotions.tsv"
          done < "$RUNNER_TEMP/images.tsv"

          # All candidates are now verified by digest. Only at this point may
          # release/SHA tags become visible. A later promotion failure can
          # leave a partial release, but never an unsigned or unattested final
          # reference.
          verify_harbor_tag_on_digest() {
            local expected_tag="$1"
            local repository_path="$2"
            local digest_path="$3"
            local response_prefix="$4"
            local page=1 tags_file tags_status tag_page tag_state tag_count
            while [ "$page" -le 1000 ]; do
              tags_file="${response_prefix}-page-${page}.json"
              tags_status="$(curl --silent --show-error \
                --netrc-file "$harbor_netrc" \
                --output "$tags_file" \
                --write-out '%{http_code}' \
                "https://${REGISTRY}/api/v2.0/projects/${project_encoded}/repositories/${repository_path}/artifacts/${digest_path}/tags?page=${page}&page_size=100")"
              if [ "$tags_status" != "200" ]; then
                echo "Harbor nested tag lookup failed: HTTP $tags_status"
                head -c 1000 "$tags_file" || true
                return 1
              fi
              tag_page="$(EXPECTED_TAG="$expected_tag" TAGS_FILE="$tags_file" node -e '
                const fs = require("fs");
                const tags = JSON.parse(fs.readFileSync(process.env.TAGS_FILE, "utf8"));
                if (!Array.isArray(tags)) process.exit(1);
                const found = tags.some((entry) => entry && entry.name === process.env.EXPECTED_TAG);
                process.stdout.write(`${found ? "found" : "missing"}\t${tags.length}`);
              ')"
              tag_state="${tag_page%%$'\t'*}"
              tag_count="${tag_page##*$'\t'}"
              if [ "$tag_state" = "found" ]; then
                return 0
              fi
              if [ "$tag_count" -lt 100 ]; then
                break
              fi
              page="$((page + 1))"
            done
            echo "Harbor immutable tag collision: ${expected_tag} is not attached to ${digest}"
            return 1
          }

          while IFS=$'\t' read -r name candidate_ref digest_ref version_ref sha_ref; do
            [ -n "$candidate_ref" ] || continue
            safe_name="$(printf '%s' "$name" | sha256sum | cut -c1-32)"
            repository_encoded="$(NAME="$name" node -e '
              process.stdout.write(encodeURIComponent(process.env.NAME).replace(/%2F/gi, "%252F"));
            ')"
            project_encoded="$(PROJECT="$REGISTRY_PROJECT" node -e '
              process.stdout.write(encodeURIComponent(process.env.PROJECT));
            ')"
            digest="${digest_ref##*@}"
            digest_encoded="$(DIGEST="$digest" node -e 'process.stdout.write(encodeURIComponent(process.env.DIGEST))')"
            # Publish the immutable source-revision tag first. VERSION is the
            # final externally visible release boundary.
            for promoted_ref in "$sha_ref" "$version_ref"; do
              tag="${promoted_ref##*:}"
              response_file="$RUNNER_TEMP/harbor-create-tag-${safe_name}.json"
              payload="$(TAG="$tag" node -e 'process.stdout.write(JSON.stringify({name: process.env.TAG}))')"
              status="$(curl --silent --show-error \
                --netrc-file "$harbor_netrc" \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --header 'content-type: application/json' \
                --request POST \
                --data "$payload" \
                "https://${REGISTRY}/api/v2.0/projects/${project_encoded}/repositories/${repository_encoded}/artifacts/${digest_encoded}/tags")"
              case "$status" in
                201) echo "Atomically created immutable release tag: $promoted_ref" ;;
                409) echo "Release tag already exists; verifying digest: $promoted_ref" ;;
                *)
                  echo "Harbor atomic tag creation failed for $promoted_ref: HTTP $status"
                  head -c 1000 "$response_file" || true
                  exit 1
                  ;;
              esac
              verify_harbor_tag_on_digest \
                "$tag" "$repository_encoded" "$digest_encoded" \
                "$RUNNER_TEMP/harbor-tags-${safe_name}-${tag}"
              promoted_manifest="$(docker buildx imagetools inspect "$promoted_ref" --format '{{json .Manifest}}')"
              promoted_digest="$(MANIFEST="$promoted_manifest" node -e '
                const manifest = JSON.parse(process.env.MANIFEST);
                if (!/^sha256:[a-f0-9]{64}$/.test(manifest.digest || "")) process.exit(1);
                process.stdout.write(manifest.digest);
              ')"
              if [ "$promoted_digest" != "${digest_ref##*@}" ]; then
                echo "Promoted digest mismatch for $promoted_ref"
                exit 1
              fi
            done
          done < "$evidence_dir/promotions.tsv"

          EVIDENCE_DIR="$evidence_dir" node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const dir = process.env.EVIDENCE_DIR;
          const records = fs.readFileSync(path.join(dir, "evidence.ndjson"), "utf8")
            .split("\n").filter(Boolean).map(JSON.parse);
          fs.writeFileSync(path.join(dir, "release-evidence.json"), `${JSON.stringify(records, null, 2)}\n`);
          const rows = records.map((r) => `| ${r.image} | \`${r.digestRef}\` | signed + SBOM + SLSA v1 provenance attested |`).join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Immutable release evidence\n\n| Image | Digest | Gates |\n|---|---|---|\n${rows}\n`);
          NODE

          RELEASE_EVIDENCE="$evidence_dir/release-evidence.json" node <<'NODE' > "$RUNNER_TEMP/release-images.json"
          const fs = require("fs");
          const records = JSON.parse(fs.readFileSync(process.env.RELEASE_EVIDENCE, "utf8"));
          if (!Array.isArray(records) || records.length === 0) {
            throw new Error("verified release evidence is empty");
          }
          const seen = new Set();
          const output = records.map((record) => {
            if (!record || typeof record.image !== "string" || seen.has(record.image)) {
              throw new Error("release evidence contains an invalid or duplicate image");
            }
            seen.add(record.image);
            const digest = String(record.digestRef || "").split("@")[1] || "";
            const repository = String(record.digestRef || "").split("@")[0] || "";
            if (!/^sha256:[a-f0-9]{64}$/.test(digest)) {
              throw new Error(`invalid verified digest for ${record.image}`);
            }
            if (!repository.endsWith(`/${record.image}`)) {
              throw new Error(`verified repository/name mismatch for ${record.image}`);
            }
            return {
              name: record.image,
              repository,
              versionRef: record.versionRef,
              shaRef: record.shaRef,
              digest,
              ref: `${repository}@${digest}`,
            };
          }).sort((left, right) => left.name.localeCompare(right.name));
          process.stdout.write(`${JSON.stringify(output)}\n`);
          NODE
          {
            echo "release_images<<RHO_RELEASE_IMAGES"
            cat "$RUNNER_TEMP/release-images.json"
            echo "RHO_RELEASE_IMAGES"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-security-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/release-security-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Remove ephemeral Buildx builder
        if: ${{ always() }}
        run: docker buildx rm "$BUILDX_BUILDER" || true

  notify:
    name: Notify OpenClaw on release failure
    permissions:
      contents: read
      actions: read
    runs-on: ${{ inputs.runner }}
    needs: [release]
    if: ${{ always() && (needs.release.result == 'failure' || needs.release.result == 'cancelled') }}
    timeout-minutes: 10
    steps:
      - name: Avisar por Telegram
        # La MISMA accion que usan el release-bot y openclaw. Antes esto eran
        # ~90 lineas de JS inline repetidas en CINCO reusables.
        # Ruta ABSOLUTA con @main, no `./`: dentro de un reusable, `./` se
        # resuelve contra el repo que LLAMA, no contra este, asi que desde
        # cualquiera de los 37 consumidores esa ruta no existe. @main es
        # ademas la convencion de la casa para reusables propios (93 usos).
        uses: pocharlies-org/k8s-gitops-pocharlies/.github/actions/notify-telegram@main
        with:
          # Se acepta el par de la ORG y el del repo: en plan free los secretos
          # de organizacion NO alcanzan a los repos privados, y 13 de los 37
          # consumidores lo son. El que exista, gana.
          token:   ${{ secrets.TELEGRAM_CI_BOT_TOKEN || secrets.OPENCLAW_TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CI_CHAT_ID  || secrets.OPENCLAW_TELEGRAM_TARGET }}
          # El thread NO es un secreto, es configuracion: un id de topic no
          # abre nada por si solo. Va en claro y con fallback al secreto por si
          # algun repo quiere desviar sus avisos a otro sitio.
          #
          # 63 = topic `ci` del grupo "github pocharlies-org", creado el
          # 22-08-2026 para esto. Antes se usaba OPENCLAW_TELEGRAM_THREAD_ID,
          # que apunta a un thread del grupo VIEJO de OpenClaw: probado en vivo
          # y Telegram respondia 400 "message thread not found".
          thread_id: ${{ secrets.TELEGRAM_CI_THREAD_ID || '63' }}
          state: audit_fail
          text: |
            ${{ github.repository }} — CI en rojo
            ref: ${{ github.ref_name }}  sha: ${{ github.sha }}
            run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # false: un aviso perdido no puede tumbar un job que ya esta rojo por
          # otra razon, y el propio paso ya deja ::warning:: si Telegram falla.
          strict: 'false'
