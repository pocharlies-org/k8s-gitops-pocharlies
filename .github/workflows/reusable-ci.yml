name: Reusable CI

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: arc-k8s
      node_version:
        description: "Reviewed Node line: 22 or 24 (mapped to an exact checksummed patch)."
        type: string
        default: "24"
      registry:
        description: Container registry to authenticate against for base-image pulls.
        type: string
        default: harbor.lan.e-dani.com
      python_version:
        type: string
        default: "3.12"
      pnpm_version:
        type: string
        default: "8.15.0"
      app_path:
        type: string
        default: "."
      images:
        description: JSON array of {name, context, dockerfile}
        type: string
        default: "[]"
      kustomize_paths:
        description: Space-separated directories that may contain kustomization.yaml
        type: string
        default: ". k8s"
      run_node:
        type: boolean
        default: true
      run_docker_build:
        type: boolean
        default: true
      run_kustomize:
        type: boolean
        default: true
      docker_build_timeout:
        description: Per-image docker build timeout, passed to GNU timeout.
        type: string
        default: 15m
    secrets:
      OPENCLAW_GITHUB_NOTIFY_URL:
        required: false
      OPENCLAW_GITHUB_NOTIFY_TOKEN:
        required: false
      OPENCLAW_IDENTITY_B64:
        required: false
      OPENCLAW_GATEWAY_URL:
        required: false
      OPENCLAW_GATEWAY_TOKEN:
        required: false
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:
        required: false
      OPENCLAW_TELEGRAM_BOT_TOKEN:
        required: false
      OPENCLAW_TELEGRAM_ACCOUNT:
        required: false
      OPENCLAW_TELEGRAM_TARGET:
        required: false
      OPENCLAW_TELEGRAM_THREAD_ID:
        required: false
      FRAMEWORK_REPO_TOKEN:
        required: false
      HARBOR_USER:
        required: false
      HARBOR_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  app:
    name: Lint, test, build
    runs-on: ${{ inputs.runner }}
    if: ${{ inputs.run_node }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect package.json
        id: package
        env:
          APP_PATH: ${{ inputs.app_path }}
        run: |
          set -euo pipefail
          if ! echo "$APP_PATH" | grep -Eq '^(\.|[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)$' || echo "$APP_PATH" | grep -Eq '(^|/)\.\.(/|$)'; then
            echo "app_path must be a safe repository-relative path"
            exit 1
          fi
          if [ -f "$APP_PATH/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install verified Python
        if: ${{ steps.package.outputs.present == 'true' }}
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          set -euo pipefail
          case "$PYTHON_VERSION" in
            3.12|3.12.13) version=3.12.13 ;;
            *) echo "python_version must be the reviewed 3.12 line"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=x86_64; expected=5854aa6ec71cad00334d5065633c210b2e7feb40956767a59a91791cadcf0b79 ;;
            aarch64|arm64) arch=aarch64; expected=f226576b91491ffa5739aa85726521e9031f4d87f80627d64ed348ac77cb31e9 ;;
            *) echo "Unsupported Python runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/cpython-${version}-${arch}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-${version}%2B20260718-${arch}-unknown-linux-gnu-install_only_stripped.tar.gz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python/bin/python3" --version

      - name: Install verified Node.js
        if: ${{ steps.package.outputs.present == 'true' }}
        env:
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          case "$NODE_VERSION" in
            22|22.23.2) version=v22.23.2 ;;
            24|24.19.0) version=v24.19.0 ;;
            *) echo "node_version must be reviewed line 22 or 24"; exit 1 ;;
          esac
          case "${version}:$(uname -m)" in
            v22.23.2:x86_64|v22.23.2:amd64) arch=x64; expected=b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a ;;
            v22.23.2:aarch64|v22.23.2:arm64) arch=arm64; expected=013b59cfd2819703a6f4a14ab891fc46fc2a4e3f5bcd92de3fb4929b43e35b30 ;;
            v24.19.0:x86_64|v24.19.0:amd64) arch=x64; expected=f625d97cd707df4ff96254916fbc5ff014f09c09effe5a1e0ca8f6d41a8789d4 ;;
            v24.19.0:aarch64|v24.19.0:arm64) arch=arm64; expected=d28c8a5bf0a808f0ed434a1dce8c54ae98f0371c0bd86ac58abc613f73e6643f ;;
            *) echo "Unsupported Node runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/node-${version}-${arch}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://nodejs.org/dist/${version}/node-${version}-linux-${arch}.tar.gz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${version}-linux-${arch}/bin" >> "$GITHUB_PATH"

      - name: Enable pnpm
        if: ${{ steps.package.outputs.present == 'true' }}
        env:
          PNPM_VERSION: ${{ inputs.pnpm_version }}
        run: |
          set -euo pipefail
          case "$PNPM_VERSION" in
            8.15.0)
              expected=ea45517d5285d123eac02c3793505fa1fd6da90a2fc60d1e8d9e0c1e9292886ecfaff513f062b9d1cc8021bb8615033b1ac5bea3b2ee3fc165a6d7034bbe6b03
              ;;
            11.17.0)
              expected=cca3cea332ad254bb84145f966d19f4879615210346fc92c79a047f23a0d7b3cca3c3792f0076ba1f1831d277efbcf0a9119b31a9a60eca7fb3d6231f331ef72
              ;;
            *) echo "pnpm_version must be reviewed 8.15.0 or 11.17.0"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/pnpm-${PNPM_VERSION}.tgz"
          install_dir="$RUNNER_TEMP/pnpm-${PNPM_VERSION}"
          mkdir -p "$install_dir" "$RUNNER_TEMP/bin"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://registry.npmjs.org/pnpm/-/pnpm-${PNPM_VERSION}.tgz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha512sum --check --strict
          tar xzf "$archive" -C "$install_dir"
          pnpm_cli="$install_dir/package/bin/pnpm.cjs"
          test -f "$pnpm_cli"
          chmod 0755 "$pnpm_cli"
          ln -s "$pnpm_cli" "$RUNNER_TEMP/bin/pnpm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/pnpm" --version
          [ "$("$RUNNER_TEMP/bin/pnpm" --version)" = "$PNPM_VERSION" ]

      - name: Install native Node build tools
        if: ${{ steps.package.outputs.present == 'true' }}
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends make g++
            else
              apt-get update
              apt-get install -y --no-install-recommends make g++
            fi
          else
            echo "apt-get not available; assuming native build tools are already present"
          fi

      - name: Install dependencies
        if: ${{ steps.package.outputs.present == 'true' }}
        working-directory: ${{ inputs.app_path }}
        run: pnpm install --frozen-lockfile

      - name: Run lint when available
        if: ${{ steps.package.outputs.present == 'true' }}
        working-directory: ${{ inputs.app_path }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            pnpm lint
          else
            echo "No lint script"
          fi

      - name: Run tests when available
        if: ${{ steps.package.outputs.present == 'true' }}
        working-directory: ${{ inputs.app_path }}
        env:
          NODE_ENV: test
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm test
          else
            echo "No test script"
          fi

      - name: Run build when available
        if: ${{ steps.package.outputs.present == 'true' }}
        working-directory: ${{ inputs.app_path }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            pnpm build
          else
            echo "No build script"
          fi

  manifests:
    name: Lint and validate manifests
    runs-on: ${{ inputs.runner }}
    if: ${{ inputs.run_kustomize }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install verified Python
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          set -euo pipefail
          case "$PYTHON_VERSION" in
            3.12|3.12.13) version=3.12.13 ;;
            *) echo "python_version must be the reviewed 3.12 line"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=x86_64; expected=5854aa6ec71cad00334d5065633c210b2e7feb40956767a59a91791cadcf0b79 ;;
            aarch64|arm64) arch=aarch64; expected=f226576b91491ffa5739aa85726521e9031f4d87f80627d64ed348ac77cb31e9 ;;
            *) echo "Unsupported Python runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/cpython-${version}-${arch}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-${version}%2B20260718-${arch}-unknown-linux-gnu-install_only_stripped.tar.gz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python/bin/python3" --version

      - name: Install YAML and Kubernetes tools
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          download_file() {
            url="$1"
            output="$2"
            for attempt in 1 2 3 4 5; do
              if curl -fsSL \
                --connect-timeout 20 \
                --max-time 180 \
                --retry 3 \
                --retry-all-errors \
                --retry-delay 2 \
                -o "$output" \
                "$url"; then
                return 0
              fi
              sleep "$((attempt * 2))"
            done
            echo "Failed to download $url"
            return 1
          }

          yaml_lib="$RUNNER_TEMP/yamllint-libs"
          mkdir -p "$yaml_lib"
          download_file \
            "https://files.pythonhosted.org/packages/71/60/917329f640924b18ff085ab889a11c763e0b573da888e8404ff486657602/pyyaml-6.0.3-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" \
            "$RUNNER_TEMP/pyyaml.whl"
          echo "b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d  $RUNNER_TEMP/pyyaml.whl" | sha256sum --check --strict
          download_file \
            "https://files.pythonhosted.org/packages/cc/20/ff623b09d963f88bfde16306a54e12ee5ea43e9b597108672ff3a408aad6/pathspec-0.12.1-py3-none-any.whl" \
            "$RUNNER_TEMP/pathspec.whl"
          echo "a0d503e138a4c123b27490a4f7beda6a01c6f288df0e4a8b79c7eb0dc7b4cc08  $RUNNER_TEMP/pathspec.whl" | sha256sum --check --strict
          download_file \
            "https://files.pythonhosted.org/packages/dd/b9/be7a4cfdf47e03785f657f94daea8123e838d817be76c684298305bd789f/yamllint-1.37.1-py3-none-any.whl" \
            "$RUNNER_TEMP/yamllint.whl"
          echo "364f0d79e81409f591e323725e6a9f4504c8699ddf2d7263d8d2b539cd66a583  $RUNNER_TEMP/yamllint.whl" | sha256sum --check --strict
          for wheel in "$RUNNER_TEMP/pyyaml.whl" "$RUNNER_TEMP/pathspec.whl" "$RUNNER_TEMP/yamllint.whl"; do
            python3 -m zipfile -e "$wheel" "$yaml_lib"
          done
          echo "PYTHONPATH=$yaml_lib" >> "$GITHUB_ENV"

          KUSTOMIZE_VERSION=v5.5.0
          KUSTOMIZE_TGZ="$RUNNER_TEMP/kustomize.tar.gz"
          download_file \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            "$KUSTOMIZE_TGZ"
          echo "6703a3a70a0c47cf0b37694030b54f1175a9dfeb17b3818b623ed58b9dbc2a77  $KUSTOMIZE_TGZ" \
            | sha256sum --check --strict
          tar xzf "$KUSTOMIZE_TGZ" -C "$RUNNER_TEMP/bin" kustomize

          KUBECONFORM_VERSION=v0.6.7
          KUBECONFORM_TGZ="$RUNNER_TEMP/kubeconform.tar.gz"
          download_file \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            "$KUBECONFORM_TGZ"
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  $KUBECONFORM_TGZ" \
            | sha256sum --check --strict
          tar xzf "$KUBECONFORM_TGZ" -C "$RUNNER_TEMP/bin" kubeconform

      - name: YAML lint
        run: |
          set -euo pipefail
          mapfile -d '' yaml_files < <(
            find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
              -not -path './.git/*' \
              -not -path './docs/audit-*/*' \
              -not -path './templates/*' \
              -print0 | sort -z
          )

          if [ "${#yaml_files[@]}" -eq 0 ]; then
            echo "No YAML files found"
            exit 0
          fi

          python3 -m yamllint -d '{extends: relaxed, rules: {line-length: {max: 220}}}' "${yaml_files[@]}"

      - name: kubeconform raw manifests
        run: |
          set -euo pipefail
          manifests=()
          while IFS= read -r -d '' file; do
            case "$file" in
              ./.git/*|./docs/audit-*/*|./templates/*|*/overlays/*/patch*.yaml|*/overlays/*/patch*.yml) continue ;;
            esac
            if grep -q '^apiVersion:' "$file"; then
              manifests+=("$file")
            fi
          done < <(find . -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 | sort -z)

          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Kubernetes manifests found"
            exit 0
          fi

          kubeconform \
            -kubernetes-version 1.32.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            -skip IngressRoute,ClusterExternalSecret \
            -summary \
            -output pretty \
            "${manifests[@]}"

      - name: Configure git auth for private kustomize bases
        env:
          FRAMEWORK_REPO_TOKEN: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${FRAMEWORK_REPO_TOKEN:-}" ]; then
            git config --global \
              url."https://x-access-token:${FRAMEWORK_REPO_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
            echo "HTTPS token configured for private kustomize bases."
          else
            echo "No FRAMEWORK_REPO_TOKEN secret; assuming public bases."
          fi

      - name: Render kustomize overlays
        env:
          KUSTOMIZE_PATHS: ${{ inputs.kustomize_paths }}
        run: |
          set -euo pipefail
          if ! echo "$KUSTOMIZE_PATHS" | grep -Eq '^[A-Za-z0-9_./ -]+$' || echo "$KUSTOMIZE_PATHS" | grep -Eq '(^|[ /])\.\.([ /]|$)'; then
            echo "kustomize_paths contains an unsafe path"
            exit 1
          fi
          for path in $KUSTOMIZE_PATHS; do
            if [ ! -f "$path/kustomization.yaml" ] && [ ! -f "$path/kustomization.yml" ]; then
              echo "Skipping missing kustomization: $path"
              continue
            fi

            out="$RUNNER_TEMP/$(echo "$path" | tr '/ ' '__').yaml"
            kustomize build "$path" > "$out"
            kubeconform \
              -kubernetes-version 1.32.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -ignore-missing-schemas \
              -skip IngressRoute,ClusterExternalSecret \
              -summary \
              -output pretty \
              "$out"
          done

  docker:
    name: Build images
    runs-on: ${{ inputs.runner }}
    if: ${{ inputs.run_docker_build && inputs.images != '[]' }}
    timeout-minutes: 90
    env:
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install verified Node.js
        env:
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          case "$NODE_VERSION" in
            22|22.23.2) version=v22.23.2 ;;
            24|24.19.0) version=v24.19.0 ;;
            *) echo "node_version must be reviewed line 22 or 24"; exit 1 ;;
          esac
          case "${version}:$(uname -m)" in
            v22.23.2:x86_64|v22.23.2:amd64) arch=x64; expected=b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a ;;
            v22.23.2:aarch64|v22.23.2:arm64) arch=arm64; expected=013b59cfd2819703a6f4a14ab891fc46fc2a4e3f5bcd92de3fb4929b43e35b30 ;;
            v24.19.0:x86_64|v24.19.0:amd64) arch=x64; expected=f625d97cd707df4ff96254916fbc5ff014f09c09effe5a1e0ca8f6d41a8789d4 ;;
            v24.19.0:aarch64|v24.19.0:arm64) arch=arm64; expected=d28c8a5bf0a808f0ed434a1dce8c54ae98f0371c0bd86ac58abc613f73e6643f ;;
            *) echo "Unsupported Node runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/node-${version}-${arch}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://nodejs.org/dist/${version}/node-${version}-linux-${arch}.tar.gz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${version}-linux-${arch}/bin" >> "$GITHUB_PATH"

      - name: Validate fixed CI registry
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          if [ "$REGISTRY" != "harbor.lan.e-dani.com" ]; then
            echo "CI registry is not allowlisted: $REGISTRY"
            exit 1
          fi

      # Dockerfiles pull base images through the Harbor docker-hub proxy-cache
      # project (harbor.lan/cache/...), which requires authentication. This job
      # does not push, but it must log in to pull those base layers (else 401).
      - name: Log in to Harbor (base-image cache proxy)
        if: ${{ env.HARBOR_USER != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build images without pushing
        env:
          IMAGES: ${{ inputs.images }}
          DOCKER_BUILD_TIMEOUT: ${{ inputs.docker_build_timeout }}
        run: |
          set -euo pipefail
          if ! echo "$DOCKER_BUILD_TIMEOUT" | grep -Eq '^[1-9][0-9]*[smh]$'; then
            echo "docker_build_timeout must be a positive duration ending in s, m or h"
            exit 1
          fi
          node <<'NODE' > "$RUNNER_TEMP/images.tsv"
          const images = JSON.parse(process.env.IMAGES || "[]");
          if (!Array.isArray(images) || images.length === 0) throw new Error("images must be a non-empty JSON array");
          const segment = /^[a-z0-9][a-z0-9._-]*$/;
          const safePath = /^(?:\.|[A-Za-z0-9_][A-Za-z0-9._/-]*)$/;
          const names = new Set();
          for (const image of images) {
            if (!image || typeof image !== "object" || typeof image.name !== "string" ||
                image.name.length > 128 || image.name.split("/").some((value) => !segment.test(value))) {
              throw new Error("each image name must be a registry-safe relative path");
            }
            if (names.has(image.name)) throw new Error(`duplicate image name: ${image.name}`);
            names.add(image.name);
            const context = image.context || ".";
            const dockerfile = image.dockerfile || "Dockerfile";
            if (!safePath.test(context) || !safePath.test(dockerfile) ||
                context.split("/").includes("..") || dockerfile.split("/").includes("..")) {
              throw new Error(`unsafe path for ${image.name}`);
            }
            console.log([
              image.name,
              context,
              dockerfile,
            ].join("\t"));
          }
          NODE

          while IFS=$'\t' read -r name context dockerfile; do
            [ -n "$name" ] || continue
            timeout "$DOCKER_BUILD_TIMEOUT" docker build \
              --progress=plain \
              --file "$dockerfile" \
              --tag "ci-local/${name}:${GITHUB_SHA}" \
              "$context"
          done < "$RUNNER_TEMP/images.tsv"

  contracts:
    name: Contract surface
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The push rules compare against the previous commit, so a shallow
          # clone of depth 1 cannot see what actually changed.
          fetch-depth: 0

      # Repos that declare no contract surface skip everything below, so this job
      # costs nothing for the callers that do not opt in.
      - name: Detect CONTRACTS.yaml
        id: detect
        run: |
          if [ -f CONTRACTS.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No CONTRACTS.yaml; this repo declares no contract surface."
          fi

      - name: Install verified Python
        if: ${{ steps.detect.outputs.present == 'true' }}
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          set -euo pipefail
          case "$PYTHON_VERSION" in
            3.12|3.12.13) version=3.12.13 ;;
            *) echo "python_version must be the reviewed 3.12 line"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=x86_64; expected=5854aa6ec71cad00334d5065633c210b2e7feb40956767a59a91791cadcf0b79 ;;
            aarch64|arm64) arch=aarch64; expected=f226576b91491ffa5739aa85726521e9031f4d87f80627d64ed348ac77cb31e9 ;;
            *) echo "Unsupported Python runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/cpython-${version}-${arch}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-${version}%2B20260718-${arch}-unknown-linux-gnu-install_only_stripped.tar.gz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python/bin/python3" --version

      - name: Check out the contract checker
        if: ${{ steps.detect.outputs.present == 'true' }}
        id: checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
          persist-credentials: false
          path: .contracts-checker

      - name: Enforce the contract rules
        if: ${{ steps.detect.outputs.present == 'true' }}
        run: |
          set -euo pipefail
          checker=.contracts-checker/scripts/check-contracts.py
          if [ ! -f "$checker" ]; then
            echo "CONTRACTS.yaml is present but the pinned checker could not be fetched"
            exit 1
          fi
          wheel="$RUNNER_TEMP/pyyaml-6.0.3.whl"
          yaml_lib="$RUNNER_TEMP/contracts-yaml"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://files.pythonhosted.org/packages/71/60/917329f640924b18ff085ab889a11c763e0b573da888e8404ff486657602/pyyaml-6.0.3-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" \
            -o "$wheel"
          echo "b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d  $wheel" | sha256sum --check --strict
          mkdir -p "$yaml_lib"
          python3 -m zipfile -e "$wheel" "$yaml_lib"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if ! echo "$PR_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$' || ! echo "$PR_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Pull request range does not contain full Git commit SHAs"
              exit 1
            fi
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            range="${GITHUB_EVENT_BEFORE}..${GITHUB_SHA}"
          else
            range=""
          fi
          if [ -n "$range" ]; then
            PYTHONPATH="$yaml_lib" python3 "$checker" --repo . --range "$range"
          else
            # First push of a branch: validate the tree, skip the push rules.
            PYTHONPATH="$yaml_lib" python3 "$checker" --repo .
          fi
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  notify:
    name: Notify OpenClaw on failure
    runs-on: ${{ inputs.runner }}
    needs: [app, manifests, docker, contracts]
    if: ${{ always() && (needs.app.result == 'failure' || needs.app.result == 'cancelled' || needs.manifests.result == 'failure' || needs.manifests.result == 'cancelled' || needs.docker.result == 'failure' || needs.docker.result == 'cancelled' || needs.contracts.result == 'failure' || needs.contracts.result == 'cancelled') }}
    timeout-minutes: 10
    steps:
      - name: Send failure report
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          OPENCLAW_GITHUB_NOTIFY_URL: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_URL }}
          OPENCLAW_GITHUB_NOTIFY_TOKEN: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_TOKEN }}
          OPENCLAW_IDENTITY_B64: ${{ secrets.OPENCLAW_IDENTITY_B64 }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${{ secrets.OPENCLAW_ALLOW_INSECURE_PRIVATE_WS }}
          OPENCLAW_TELEGRAM_BOT_TOKEN: ${{ secrets.OPENCLAW_TELEGRAM_BOT_TOKEN }}
          OPENCLAW_TELEGRAM_ACCOUNT: ${{ secrets.OPENCLAW_TELEGRAM_ACCOUNT }}
          OPENCLAW_TELEGRAM_TARGET: ${{ secrets.OPENCLAW_TELEGRAM_TARGET }}
          OPENCLAW_TELEGRAM_THREAD_ID: ${{ secrets.OPENCLAW_TELEGRAM_THREAD_ID }}
          GITHUB_TOKEN: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_TOKEN || github.token }}
        with:
          # Use the notify PAT (if configured) so the enriched report can read
          # job logs (needs actions:read) without the workflow token requiring
          # it — keeps the reusable startable under the org's default-read token.
          # Falls back to the default token (log excerpt is skipped if it lacks
          # actions:read, handled by the script's try/catch).
          github-token: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_TOKEN || github.token }}
          script: |
            const FAILURE_CONCLUSIONS = new Set(['failure', 'cancelled', 'timed_out', 'action_required']);

            function failureExcerpt(text, maxLines = 220, maxChars = 16000) {
              const lines = String(text || '').split(/\r?\n/).filter((line) => line.trim());
              if (!lines.length) return '';
              const markerPatterns = [
                /##\[error\]/i,
                /\bERR_[A-Z0-9_]+\b/,
                /\bELIFECYCLE\b/,
                /prettier\/prettier/i,
                /\u2716\s+\d+\s+problems/i,
                /\berror\s{2,}/i,
                /failed/i,
                /exit (status|code) \d+/i,
              ];
              const cleanupPatterns = [
                /Post job cleanup/i,
                /Cleaning up orphan processes/i,
                /actions are deprecated/i,
              ];
              let markerIndex = -1;
              for (let index = lines.length - 1; index >= 0; index -= 1) {
                const line = lines[index];
                if (cleanupPatterns.some((pattern) => pattern.test(line))) continue;
                if (markerPatterns.some((pattern) => pattern.test(line))) {
                  markerIndex = index;
                  break;
                }
              }
              if (markerIndex < 0) markerIndex = lines.length - 1;
              const before = Math.floor(maxLines * 0.75);
              const after = maxLines - before;
              let selected = lines.slice(
                Math.max(0, markerIndex - before),
                Math.min(lines.length, markerIndex + after),
              );
              let out = selected.join('\n');
              if (out.length > maxChars) {
                selected = lines
                  .filter(
                    (line) =>
                      !cleanupPatterns.some((pattern) => pattern.test(line)) &&
                      markerPatterns.some((pattern) => pattern.test(line)),
                  )
                  .slice(-maxLines);
                out = selected.join('\n');
              }
              if (out.length > maxChars) {
                out = out.slice(-maxChars);
                const firstNewline = out.indexOf('\n');
                if (firstNewline > 0) out = out.slice(firstNewline + 1);
              }
              return out;
            }

            function redact(text) {
              let out = String(text || '');
              for (const value of [
                process.env.GITHUB_TOKEN,
                process.env.OPENCLAW_GITHUB_NOTIFY_TOKEN,
                process.env.OPENCLAW_TELEGRAM_BOT_TOKEN,
                process.env.OPENCLAW_GATEWAY_TOKEN,
              ]) {
                if (value && value.length > 6) out = out.split(value).join('***');
              }
              return out
                .replace(/gh[pousr]_[A-Za-z0-9_]+/g, '***')
                .replace(/github_pat_[A-Za-z0-9_]+/g, '***');
            }

            async function fetchJobLogTail(job) {
              if (!process.env.GITHUB_TOKEN || !job.id) return '';
              const url = `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/actions/jobs/${job.id}/logs`;
              try {
                const response = await fetch(url, {
                  headers: {
                    authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                    accept: 'application/vnd.github+json',
                    'x-github-api-version': '2022-11-28',
                  },
                });
                if (!response.ok) {
                  core.warning(`Failed to fetch logs for job ${job.id}: HTTP ${response.status}`);
                  return '';
                }
                return failureExcerpt(redact(await response.text()));
              } catch (error) {
                core.warning(`Failed to fetch logs for job ${job.id}: ${error.message}`);
                return '';
              }
            }

            async function collectFailedJobDetails() {
              const jobs = [];
              try {
                for (let page = 1; page <= 5; page += 1) {
                  const response = await github.rest.actions.listJobsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: context.runId,
                    per_page: 100,
                    page,
                  });
                  jobs.push(...response.data.jobs);
                  if (response.data.jobs.length < 100) break;
                }
              } catch (error) {
                core.warning(`Failed to list workflow jobs for run ${context.runId}: ${error.message}`);
                return [];
              }
              const failedJobs = jobs.filter((job) => FAILURE_CONCLUSIONS.has(String(job.conclusion || '').toLowerCase()));
              const details = [];
              for (const job of failedJobs) {
                const steps = Array.isArray(job.steps) ? job.steps : [];
                const failedSteps = steps.filter((step) => FAILURE_CONCLUSIONS.has(String(step.conclusion || '').toLowerCase()));
                details.push({
                  id: job.id,
                  name: job.name,
                  status: job.status,
                  conclusion: job.conclusion,
                  url: job.html_url,
                  startedAt: job.started_at,
                  completedAt: job.completed_at,
                  failedSteps: failedSteps.map((step) => ({
                    name: step.name,
                    number: step.number,
                    status: step.status,
                    conclusion: step.conclusion,
                    startedAt: step.started_at,
                    completedAt: step.completed_at,
                  })),
                  logTail: await fetchJobLogTail(job),
                });
              }
              return details;
            }

            const failedJobs = {
              app: '${{ needs.app.result }}',
              manifests: '${{ needs.manifests.result }}',
              docker: '${{ needs.docker.result }}',
              contracts: '${{ needs.contracts.result }}',
            };
            const failed = Object.entries(failedJobs)
              .filter(([, result]) => ['failure', 'cancelled'].includes(result))
              .map(([name, result]) => `${name}:${result}`);
            const jobDetails = await collectFailedJobDetails();
            const firstFailedStep = jobDetails
              .flatMap((job) => job.failedSteps || [])
              .map((step) => step.name)
              .find(Boolean);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = [
              `GitHub Actions CI failed`,
              `repo: ${context.repo.owner}/${context.repo.repo}`,
              `ref: ${context.ref}`,
              `sha: ${context.sha.slice(0, 12)}`,
              `jobs: ${failed.join(', ')}`,
              firstFailedStep ? `failed step: ${firstFailedStep}` : null,
              `run: ${runUrl}`,
            ].filter(Boolean).join('\n');
            const payload = {
              source: 'github-actions',
              destination: { group: 'synapse', topic: 'github' },
              event: 'ci_failed',
              repo: `${context.repo.owner}/${context.repo.repo}`,
              workflow: context.workflow,
              runId: context.runId,
              runNumber: context.runNumber,
              runAttempt: context.runAttempt,
              eventName: context.eventName,
              ref: context.ref,
              sha: context.sha,
              actor: context.actor,
              failedJobs: failed,
              jobs: jobDetails,
              runUrl,
              text,
            };

            async function postWebhook() {
              const url = process.env.OPENCLAW_GITHUB_NOTIFY_URL;
              if (!url) return false;
              const headers = { 'content-type': 'application/json' };
              if (process.env.OPENCLAW_GITHUB_NOTIFY_TOKEN) {
                headers.authorization = `Bearer ${process.env.OPENCLAW_GITHUB_NOTIFY_TOKEN}`;
              }
              try {
                const response = await fetch(url, {
                  method: 'POST',
                  headers,
                  body: JSON.stringify(payload),
                });
                if (!response.ok) {
                  core.warning(`OpenClaw webhook returned HTTP ${response.status}`);
                  return false;
                }
                return true;
              } catch (error) {
                core.warning(`OpenClaw webhook failed: ${error.message}`);
                return false;
              }
            }

            async function sendTelegramBotFallback() {
              if (!process.env.OPENCLAW_TELEGRAM_BOT_TOKEN) return false;
              if (!process.env.OPENCLAW_TELEGRAM_TARGET || !process.env.OPENCLAW_TELEGRAM_THREAD_ID) {
                core.warning('OPENCLAW_TELEGRAM_BOT_TOKEN is set, but Telegram target/thread secrets are missing');
                return false;
              }

              const body = {
                chat_id: process.env.OPENCLAW_TELEGRAM_TARGET,
                message_thread_id: Number(process.env.OPENCLAW_TELEGRAM_THREAD_ID),
                text,
                disable_web_page_preview: true,
              };
              try {
                const response = await fetch(
                  `https://api.telegram.org/bot${process.env.OPENCLAW_TELEGRAM_BOT_TOKEN}/sendMessage`,
                  {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify(body),
                  },
                );
                if (!response.ok) {
                  core.warning(`Telegram fallback returned HTTP ${response.status}`);
                  return false;
                }
                return true;
              } catch (error) {
                core.warning(`Telegram fallback failed: ${error.message}`);
                return false;
              }
            }

            const webhookSent = await postWebhook();
            const telegramSent = webhookSent ? false : await sendTelegramBotFallback();
            if (!webhookSent && !telegramSent) {
              core.warning('OpenClaw notification skipped: configure OPENCLAW_GITHUB_NOTIFY_URL or OPENCLAW_TELEGRAM_BOT_TOKEN secrets');
            }
