name: Reusable PR review

# Bot de review de PRs. Dos motores, elegidos con `inputs.engine` (INFRA-298, D6):
#
#   propio   (por defecto) review.py: manda el diff a un LLM por LiteLLM y publica
#            UN comentario con los hallazgos. Es lo que siguen usando los 108 repos
#            de la plantilla hasta el rollout (INFRA-334); se retira en F4.
#   pr-agent PR-Agent 0.46.0 en contenedor, orquestado en tres pasos (INFRA-332):
#            contexto (scripts/review-context.py) -> PR-Agent (imagen de Harbor por
#            digest) -> distribucion (scripts/review-distribute.py: payload del
#            contrato pr_review.v1, brain local-ops, etiquetas, y el hallazgo de contrato
#            en linea por la API, determinista). Diseño: adjunto
#            nota-architect-diseno.md de INFRA-298; runbook: docs/ci-pr-review.md.
#
# Pensado para que los 113 repos activos lo enciendan copiando
# `templates/ci/pr-review.yml`, cinco lineas.
#
# Tres decisiones que parecen raras y no lo son:
#
# 1. `pull_request`, NUNCA `pull_request_target`. El segundo corre con el token
#    del repo base y acceso a los secretos sobre codigo del PR: cualquiera con
#    un fork se lleva la key de LiteLLM. El precio es que un PR desde un fork
#    trae token de solo lectura y no puede comentar; el review queda entonces
#    en el resumen del job y el check sigue verde.
#
# 2. El review NO se invoca con `uses:`. `scripts/check-workflow-pins.py`
#    rechaza cualquier `uses:` que no sea `./` o un SHA de 40 hex, y pinear por
#    SHA esta descartado (la casa referencia `@main`). Y `./.github/actions/...`
#    dentro de un workflow reutilizable se resuelve contra el workspace de
#    QUIEN LLAMA, donde la accion no existe. Asi que se hace lo mismo que ya
#    hace `reusable-ci.yml` con su checker de contratos: checkout del repo del
#    framework en un subdirectorio y ejecucion directa del script. La accion
#    compuesta de `.github/actions/llm-review` sigue siendo el envoltorio
#    documentado para quien la quiera usar con `uses:` desde su propio job.
#
# 3. Modelo no disponible = VERDE. Los Sparks sirven un perfil de computo a la
#    vez; en `creative` DeepSeek no tiene endpoints. 113 checks en rojo porque
#    el arbitro cambio de perfil es peor que no tener bot.

on:
  workflow_call:
    inputs:
      engine:
        # D6 de INFRA-298: `propio` hasta que el piloto F1 de verde y el rollout
        # (INFRA-334) cambie la plantilla. Un valor que no sea uno de los dos es
        # uso invalido y pone el check en rojo (no se adivina el motor).
        description: "Motor de review: `propio` (review.py) o `pr-agent`."
        type: string
        default: propio
      runner:
        description: Runner ARC del cluster.
        type: string
        default: arc-k8s
      model:
        # `alibaba-q38-flash` (el gemelo cloud del residente, mismo Qwen3.8-Flash)
        # y no `tooling`, desde el 25-09-2026. En el residente el review no
        # tenia arreglo: cada diff es nuevo (acierto de cache ~4 %) y su prefill
        # entraba en los mismos pasos del motor que los 80k de las sesiones
        # interactivas, a ~1 s por paso; acababa en cola, en el timeout de 120 s
        # o en un 503. Era <0,3 % de los tokens del residente, asi que sacarlo
        # no le quita nada y le ahorra la cola. En Alibaba, 10 s con un diff de
        # 11k tokens (ver `reasoning_effort` en review.py).
        # Consecuencia asumida: el diff sale de la maquina al plan Team de
        # Alibaba, tambien el de los repos privados.
        description: Alias del modelo en LiteLLM.
        type: string
        default: alibaba-q38-flash
      litellm_url:
        # Servicio interno del cluster: el namespace es `litellm`, no `llm`.
        # Desde CI NO se usa litellm.lan.e-dani.com. Medido: sin key devuelve
        # 401 en ~64 ms, o sea alcanzable y con el gate activo.
        description: Endpoint de LiteLLM.
        type: string
        default: http://litellm.litellm.svc.cluster.local:4000
      max_diff_bytes:
        description: >
          Tope duro del diff. Por encima se recorta por ficheros enteros.
        type: number
        default: 120000
      telegram_topic:
        description: Nombre del topic del aviso.
        type: string
        default: ci
      telegram_thread_id:
        description: message_thread_id explicito. Gana sobre el topic.
        type: string
        default: ''
      notificar:
        description: Avisar por Telegram al terminar.
        type: boolean
        default: true
    secrets:
      # Nombres deliberados con prefijo CI: un secreto de organizacion queda
      # ENSOMBRECIDO por uno de repo con el mismo nombre, y ya hay repos con
      # TELEGRAM_BOT_TOKEN propio (release-bot-pocharlies).
      LITELLM_CI_KEY:
        required: false
      TELEGRAM_CI_BOT_TOKEN:
        required: false
      TELEGRAM_CI_CHAT_ID:
        required: false
      FRAMEWORK_REPO_TOKEN:
        description: Solo si este repo dejara de ser publico.
        required: false
      # Motor pr-agent. Por repo, no de organizacion: el plan es `free` y un
      # secreto de organizacion no llega a los repos privados (INFRA-331,
      # scripts/review-distribute-secrets.sh los reparte).
      PR_AGENT_LITELLM_KEY:
        description: Key `pr-agent-ci` de LiteLLM (solo alibaba-q38-flash).
        required: false
      JIRA_EMAIL:
        description: Cuenta Jira de solo lectura para el cumplimiento del ticket.
        required: false
      JIRA_API_TOKEN:
        required: false
      BRAIN_CI_KEY:
        description: Brain local-ops. Sin ella la memoria y el push-ingest van degradados.
        required: false
      HARBOR_USER:
        description: Pull de la imagen de PR-Agent desde harbor.e-dani.com/homelab (privado).
        required: false
      HARBOR_PASSWORD:
        required: false
    outputs:
      veredicto:
        description: "`ok` | `hallazgos` | `omitido`."
        value: ${{ jobs.revisar_pr.outputs.veredicto || jobs.revisar_pr_agent.outputs.veredicto || jobs.revisar_commit.outputs.veredicto }}
      n_hallazgos:
        description: Numero de hallazgos.
        value: ${{ jobs.revisar_pr.outputs.n_hallazgos || jobs.revisar_pr_agent.outputs.n_hallazgos || jobs.revisar_commit.outputs.n_hallazgos }}
      status:
        description: "Motor pr-agent: `ok` | `degraded` | `skipped` (contrato pr_review.v1). Vacio con `propio`."
        value: ${{ jobs.revisar_pr_agent.outputs.status }}

permissions:
  contents: read

jobs:
  # Modo PR. Permisos minimos: escribir en el PR, leer el codigo.
  revisar_pr:
    name: Review del PR
    if: ${{ github.event_name == 'pull_request' && inputs.engine != 'pr-agent' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      # Un push encima cancela el review anterior: el backend corre con
      # --max-num-seqs 5 y no sobra GPU para revisar diffs ya obsoletos.
      group: llm-review-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      # Con los pasos saltados (PR de un fork) el paso no deja salida y el job
      # publica igualmente un veredicto, que es `omitido`.
      veredicto: ${{ steps.revisar.outputs.veredicto || 'omitido' }}
      resumen: ${{ steps.revisar.outputs.resumen || steps.guarda.outputs.motivo }}
      n_hallazgos: ${{ steps.revisar.outputs.n_hallazgos || '0' }}
    steps:
      - name: Check the review engine
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          set -uo pipefail
          if [ "${ENGINE}" != "propio" ]; then
            echo "::error::inputs.engine='${ENGINE}' no es un motor: usa 'propio' o 'pr-agent'"
            exit 2
          fi

      # Un PR desde un FORK trae GITHUB_TOKEN de solo lectura y NO recibe los
      # secretos: el bot no puede ni leer la key ni comentar. Se sale en verde
      # y se dice por que. Lo que lo "arreglaria" es `pull_request_target`, que
      # ejecutaria con los secretos del repo base sobre codigo de un fork: es
      # precisamente el agujero que no se abre.
      - name: Skip pull requests from forks
        id: guarda
        env:
          # `head.repo.fork` es cierto cuando el repo de la rama ES un fork —
          # incluso si el PR es INTERNO de ese mismo repo. Con el, en nuestros
          # propios forks (aurora, openchamber, opencode-claude, shield,
          # loki...) toda review se saltaba como si viniera de fuera: run en
          # verde, aviso en verde y ningun comentario. Lo que de verdad
          # distingue un PR ajeno es que la rama viva en OTRO repositorio.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ESTE_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -n "${HEAD_REPO}" ] && [ "${HEAD_REPO}" != "${ESTE_REPO}" ]; then
            echo "::notice::PR desde un fork: sin secretos y con token de solo lectura; review omitida"
            echo "fork=true" >> "$GITHUB_OUTPUT"
            echo "motivo=PR desde un fork: sin secretos, review omitida" >> "$GITHUB_OUTPUT"
          else
            echo "fork=false" >> "$GITHUB_OUTPUT"
            echo "motivo=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.guarda.outputs.fork != 'true' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the review framework
        if: ${{ steps.guarda.outputs.fork != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `job.workflow_repository` / `job.workflow_sha` no son contexto
          # documentado: si no resuelven quedan en cadena VACIA y el checkout
          # se traeria el repo de quien llama. El fallback deja las dos ramas
          # apuntando al framework.
          repository: ${{ job.workflow_repository || 'pocharlies-org/k8s-gitops-pocharlies' }}
          ref: ${{ job.workflow_sha || 'main' }}
          token: ${{ github.token }}
          persist-credentials: false
          path: .llm-review-framework

      - name: Compute the diff
        if: ${{ steps.guarda.outputs.fork != 'true' }}
        env:
          # Del payload del evento y por entorno: los nombres de rama son texto
          # de terceros. El rango se toma del evento, no de `origin/<base>`,
          # porque el checkout de un PR no deja la base como rama local.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for s in "$PR_BASE_SHA" "$PR_HEAD_SHA"; do
            echo "$s" | grep -Eq '^[0-9a-f]{40}$' || {
              echo "::error::el rango del PR no trae SHAs completos"; exit 1; }
            # Los dos extremos, no solo la base: antes que dejar el check en
            # rojo por un objeto que no vino en el fetch, se trae al vuelo.
            git cat-file -e "${s}^{commit}" 2>/dev/null || \
              git fetch --no-tags --depth=1 origin "$s"
          done
          git diff -M --no-color "$PR_BASE_SHA" "$PR_HEAD_SHA" \
            > "$RUNNER_TEMP/review.diff"
          echo "diff: $(wc -c < "$RUNNER_TEMP/review.diff") bytes"

      - name: Review
        id: revisar
        if: ${{ steps.guarda.outputs.fork != 'true' }}
        env:
          REVIEW_LITELLM_URL: ${{ inputs.litellm_url }}
          REVIEW_LITELLM_KEY: ${{ secrets.LITELLM_CI_KEY }}
          REVIEW_MODEL: ${{ inputs.model }}
          REVIEW_DIFF_FILE: ${{ runner.temp }}/review.diff
          REVIEW_MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
          # Muy por debajo de los 600 s del proxy: con maxRunners=3 un job
          # colgado es un tercio del CI de la organizacion parado.
          REVIEW_TIMEOUT_SECONDS: '120'
          REVIEW_GITHUB_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          revisor=.llm-review-framework/.github/actions/llm-review/review.py
          if [ ! -f "$revisor" ]; then
            echo "::error::no se pudo traer el framework de review"
            exit 1
          fi
          python3 "$revisor"

  # Motor pr-agent (INFRA-332): contexto -> PR-Agent -> distribucion (+ inline de contratos,
  # determinista, en la distribucion).
  #
  # Permisos: `pull-requests: write` basta para comentar, publicar los inline y
  # poner/quitar/crear etiquetas (tabla oficial «Permissions required for GitHub
  # Apps», seccion Pull requests: POST /issues/{n}/comments, /issues/{n}/labels,
  # /labels). NO se pide `issues: write` aqui: un job de un workflow llamado que
  # pide un permiso que el llamador no concede tumba el run ENTERO al arrancar
  # (startup_failure), aunque su `if:` lo salte — medido el 22-08-2026 con
  # `contents: write`, ver `revisar_commit`. La plantilla de los 108 repos solo
  # concede `contents: read` + `pull-requests: write`. Y nunca `contents: write`:
  # PR-Agent no empuja codigo (restricted_mode, abajo, doble).
  #
  # D3 (no bloqueante): el job solo sale en rojo por 401/403 (credencial rota:
  # LiteLLM, GitHub, Harbor, brain) o por uso invalido. Modelo caido, cola,
  # timeout, config invalida o secreto sin configurar = verde con aviso y
  # `status` degraded|skipped en el payload.
  revisar_pr_agent:
    name: Review del PR (PR-Agent)
    if: ${{ github.event_name == 'pull_request' && inputs.engine == 'pr-agent' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pr-agent-review-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # Espejo en Harbor del manifiesto linux/amd64 de
      # docker.io/pragent/pr-agent:0.46.0-github_action (F0, INFRA-329 §3-4), nunca
      # Docker Hub por job. Por digest: el tag es solo legible. Lo vigila la entrada
      # `pr-agent` de dgx-infra ci/update-watch.yaml; el bump es copiar la version
      # nueva a Harbor (crane cp) y cambiar ESTA linea, con check-pr-agent-config
      # contra el configuration.toml de la version nueva.
      PR_AGENT_IMAGE: harbor.e-dani.com/homelab/pr-agent:0.46.0-github_action@sha256:42c7833a3fbdf354387ab3469fe67c34e11b38f9b90370553398a36b47ad6bc0
      # Espejo del secret para poder compararlo en un `if:` de paso (el contexto
      # `secrets` no esta disponible ahi); lo usa la puerta del checkout del
      # registry de Synapse (INFRA-334).
      FRAMEWORK_REPO_TOKEN: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
    outputs:
      veredicto: ${{ steps.estado.outputs.veredicto || 'omitido' }}
      resumen: ${{ steps.estado.outputs.resumen || steps.guarda.outputs.motivo }}
      n_hallazgos: ${{ steps.estado.outputs.n_hallazgos || '0' }}
      status: ${{ steps.estado.outputs.status || 'skipped' }}
    steps:
      - name: Skip pull requests from forks
        id: guarda
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ESTE_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -n "${HEAD_REPO}" ] && [ "${HEAD_REPO}" != "${ESTE_REPO}" ]; then
            echo "::notice::PR desde un fork: sin secretos y con token de solo lectura; review omitida"
            echo "fork=true" >> "$GITHUB_OUTPUT"
            echo "motivo=PR desde un fork: sin secretos, review omitida" >> "$GITHUB_OUTPUT"
          else
            echo "fork=false" >> "$GITHUB_OUTPUT"
            echo "motivo=" >> "$GITHUB_OUTPUT"
          fi

      # El pull cuesta ~30 s por job (dind efimero, F0): arranca YA, en segundo
      # plano, y corre en paralelo con los checkouts y el contexto. Las
      # credenciales de Harbor van por stdin; el resultado, a ficheros.
      - name: Start pulling the PR-Agent image
        if: ${{ steps.guarda.outputs.fork != 'true' }}
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -uo pipefail
          # `runner.temp` no existe en el `env:` de un job: se fija aqui para los pasos siguientes.
          PR_AGENT_DIR="$RUNNER_TEMP/pr-agent"
          echo "PR_AGENT_DIR=$PR_AGENT_DIR" >> "$GITHUB_ENV"
          rm -rf "$PR_AGENT_DIR" && mkdir -p "$PR_AGENT_DIR/out"
          # El contenedor no escribe como el usuario del runner (F0: GITHUB_OUTPUT
          # montado a mano dio Permission denied): su directorio de salida es 0777.
          chmod 0777 "$PR_AGENT_DIR/out"
          if [ -z "${HARBOR_USER}" ] || [ -z "${HARBOR_PASSWORD}" ]; then
            echo "sin HARBOR_USER/HARBOR_PASSWORD" > "$PR_AGENT_DIR/pull.err"
            echo 3 > "$PR_AGENT_DIR/pull.rc"
            exit 0
          fi
          (
            if ! printf '%s' "${HARBOR_PASSWORD}" | docker login harbor.e-dani.com \
                 -u "${HARBOR_USER}" --password-stdin > "$PR_AGENT_DIR/login.log" 2>&1; then
              cp "$PR_AGENT_DIR/login.log" "$PR_AGENT_DIR/pull.err"
              if grep -qiE 'unauthorized|authentication required|incorrect username|40[13]' "$PR_AGENT_DIR/login.log"; then
                echo 4 > "$PR_AGENT_DIR/pull.rc"
              else
                echo 1 > "$PR_AGENT_DIR/pull.rc"
              fi
              exit 0
            fi
            inicio=$(date +%s)
            ok=1
            for _ in 1 2; do
              if docker pull -q "$PR_AGENT_IMAGE" > "$PR_AGENT_DIR/pull.err" 2>&1; then ok=0; break; fi
            done
            echo "$(( $(date +%s) - inicio ))" > "$PR_AGENT_DIR/pull.seconds"
            docker logout harbor.e-dani.com > /dev/null 2>&1 || true
            echo "$ok" > "$PR_AGENT_DIR/pull.rc"
          ) > /dev/null 2>&1 &
          echo "pull en segundo plano (pid $!)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.guarda.outputs.fork != 'true' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the review framework
        if: ${{ steps.guarda.outputs.fork != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository || 'pocharlies-org/k8s-gitops-pocharlies' }}
          ref: ${{ job.workflow_sha || 'main' }}
          token: ${{ github.token }}
          persist-credentials: false
          path: .llm-review-framework

      # Registro de Synapse para la seccion «Consumidores del registry». Synapse
      # es privado: sin un token que lo alcance el checkout falla y
      # review-context.py lo anota en «Degradaciones» (exit 0). No bloquea nada.
      # Puerta determinista (INFRA-334, fijada por el architect en el delta-review
      # del #493): sin FRAMEWORK_REPO_TOKEN el paso NO se ejecuta. Intentar el
      # checkout sin token costaba 25-41 s por job: actions/checkout reintenta con
      # backoff el 404 de la resolucion de ref/fetch (esperas de 19 s y 14 s en el
      # log del run 37265193905), y `ref: main` no lo evita (medido en los runs
      # aislados del PR #211: el paso seguia en 28-35 s). El token se compara via
      # env del JOB porque el contexto `secrets` no esta disponible en un `if:` de
      # paso. `fetch-depth: 1`: el registry se lee como fichero del HEAD
      # (review-context.py: registry_consumers sobre registry.yaml; ningun
      # git -C .review-synapse), no hace falta el historial.
      - name: Check out the Synapse contract registry
        id: registry
        if: ${{ steps.guarda.outputs.fork != 'true' && env.FRAMEWORK_REPO_TOKEN != '' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pocharlies-org/synapse
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
          persist-credentials: false
          path: .review-synapse
          fetch-depth: 1
          sparse-checkout: libs/synapse-contracts
          sparse-checkout-cone-mode: true

      - name: Install hash-locked PyYAML for the context script
        if: ${{ steps.guarda.outputs.fork != 'true' }}
        run: |
          set -uo pipefail
          # Mismo wheel y hash que reusable-ci.yml; sin pip. Sin el, review-context.py
          # degrada las secciones de contratos (exit 0), no falla.
          wheel="$RUNNER_TEMP/pyyaml-review.whl"
          yaml_lib="$RUNNER_TEMP/review-yaml-lib"
          if curl --retry 3 --retry-all-errors -fsSL \
               "https://files.pythonhosted.org/packages/71/60/917329f640924b18ff085ab889a11c763e0b573da888e8404ff486657602/pyyaml-6.0.3-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" \
               -o "$wheel" \
             && echo "b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d  $wheel" | sha256sum --check --strict; then
            mkdir -p "$yaml_lib" && python3 -m zipfile -e "$wheel" "$yaml_lib"
            echo "PYTHONPATH=$yaml_lib" >> "$GITHUB_ENV"
          else
            echo "::warning::PyYAML no disponible: las secciones de contratos iran degradadas"
          fi

      - name: Build the review context
        id: contexto
        if: ${{ steps.guarda.outputs.fork != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRAIN_CI_KEY: ${{ secrets.BRAIN_CI_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # `.review/` lo escribe el CI, nunca el PR: un PR que traiga su propio
          # `.review/` (o un symlink ahi) no llega a lo que se escribe ni se monta.
          rm -rf .review && mkdir -p .review
          for s in "$PR_BASE_SHA" "$PR_HEAD_SHA"; do
            git cat-file -e "${s}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$s" || true
          done
          python3 .llm-review-framework/scripts/review-context.py \
            --repo "$REPO" --pr "$PR_NUMBER" --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" \
            --registry .review-synapse/libs/synapse-contracts/registry.yaml \
            --out .review/context.md --workdir .
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            4) echo "::error::review-context: una API respondio 401/403 (credencial rota)" ;;
            *) echo "::warning::review-context salio $rc; PR-Agent revisa sin contexto extra" ;;
          esac
          [ -f .review/context.md ] && sed -n '/^## Degradaciones/,$p' .review/context.md
          exit 0

      - name: Wait for the image pull
        id: imagen
        if: ${{ steps.guarda.outputs.fork != 'true' }}
        run: |
          set -uo pipefail
          # Acotado: `timeout` corta a los 240 s si el pull se cuelga.
          timeout 240 bash -c 'while [ ! -s "$0/pull.rc" ]; do sleep 1; done' "$PR_AGENT_DIR" || true
          rc="$(cat "$PR_AGENT_DIR/pull.rc" 2>/dev/null || echo 124)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "pull: rc=$rc en $(cat "$PR_AGENT_DIR/pull.seconds" 2>/dev/null || echo '?') s"
          case "$rc" in
            0) echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "::warning::sin HARBOR_USER/HARBOR_PASSWORD en este repo: PR-Agent no se lanza"
               echo "ok=false" >> "$GITHUB_OUTPUT" ;;
            4) echo "::error::Harbor rechazo las credenciales (401/403): HARBOR_USER/HARBOR_PASSWORD de este repo"
               # La salida de docker login no lleva la contraseña (va por stdin).
               tail -3 "$PR_AGENT_DIR/pull.err" 2>/dev/null || true
               echo "ok=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::no se pudo traer $PR_AGENT_IMAGE (rc=$rc); review degradada"
               tail -3 "$PR_AGENT_DIR/pull.err" 2>/dev/null || true
               echo "ok=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Defensa (a) del CTO (INFRA-298, comentario 17496): PR-Agent se traga en
      # silencio un TOML roto y arranca con sus valores por defecto. Se valida el
      # fichero EXACTAMENTE montado, en la ruta donde lo carga, contra el
      # configuration.toml de la imagen fijada y con el Python de esa imagen.
      # Si no pasa, el motor NO se lanza y el job sigue en verde (D3).
      - name: Validate the mounted PR-Agent configuration
        id: config
        if: ${{ steps.imagen.outputs.ok == 'true' }}
        run: |
          set -uo pipefail
          install -m 0444 .llm-review-framework/.pr_agent.toml "$PR_AGENT_DIR/host.toml"
          install -m 0444 .llm-review-framework/scripts/check-pr-agent-config.py "$PR_AGENT_DIR/check-pr-agent-config.py"
          sha="$(sha256sum "$PR_AGENT_DIR/host.toml" | cut -c1-64)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          if docker run --rm --network none --entrypoint python \
               -v "$PR_AGENT_DIR/host.toml:/app/pr_agent/settings_prod/.secrets.toml:ro" \
               -v "$PR_AGENT_DIR/check-pr-agent-config.py:/opt/check-pr-agent-config.py:ro" \
               "$PR_AGENT_IMAGE" /opt/check-pr-agent-config.py \
               --config /app/pr_agent/settings_prod/.secrets.toml \
               --upstream /app/pr_agent/settings/configuration.toml; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::la configuracion de PR-Agent (sha256 $sha) no pasa check-pr-agent-config.py: NO se lanza el motor (status skipped)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add the Jira keys the PR cites
        if: ${{ steps.config.outputs.ok == 'true' }}
        run: |
          set -uo pipefail
          # Hecho, no juicio: que claves Jira de la allowlist de la config
          # (jira.project_keys) aparecen en titulo, cuerpo o rama. Sin ninguna, las
          # instrucciones de [artifacts] piden el hallazgo «sin criterios de
          # aceptacion que verificar» (criterio 3 de la epica).
          python3 - "$PR_AGENT_DIR/host.toml" "$GITHUB_EVENT_PATH" > .review/tickets.md <<'PY'
          import json, re, sys, tomllib
          keys = tomllib.load(open(sys.argv[1], "rb")).get("jira", {}).get("project_keys", [])
          pr = json.load(open(sys.argv[2])).get("pull_request", {})
          text = "\n".join([pr.get("title") or "", pr.get("body") or "", (pr.get("head") or {}).get("ref") or ""])
          pat = r"\b(?:%s)-\d+\b" % "|".join(map(re.escape, keys))
          found = sorted(set(re.findall(pat, text))) if keys else []
          print("## Tickets Jira citados en el PR\n")
          print(", ".join(found) if found else "ninguno")
          PY
          { cat .review/context.md 2>/dev/null || echo "_contexto no disponible_"; echo; cat .review/tickets.md; } \
            > .review/pr-agent-context.md
          cat .review/tickets.md

      - name: Run PR-Agent
        id: motor
        if: ${{ steps.config.outputs.ok == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_KEY: ${{ secrets.PR_AGENT_LITELLM_KEY }}
          OPENAI__API_BASE: ${{ inputs.litellm_url }}
          JIRA__JIRA_API_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA__JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${OPENAI_KEY}" ]; then
            echo "::warning::sin PR_AGENT_LITELLM_KEY en este repo: PR-Agent no se lanza (status skipped)"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "${JIRA__JIRA_API_TOKEN}" ] || echo "::notice::sin JIRA_EMAIL/JIRA_API_TOKEN: sin cumplimiento de ticket (SC-1400)"
          : > "$PR_AGENT_DIR/out/github_output" && chmod 0666 "$PR_AGENT_DIR/out/github_output"
          inicio=$(date +%s)
          # Secretos con `-e NOMBRE` (sin valor): docker los toma del entorno del
          # paso y nunca aparecen en su argv. Defensa (b): los valores criticos van
          # ADEMAS por entorno, la capa que PR-Agent reaplica encima de cualquier
          # .pr_agent.toml del repo (git_providers/utils.py _reapply_env_overrides).
          # Medido con la imagen fijada (INFRA-332, 50-entrega.md): sin entorno, un
          # .pr_agent.toml en el tronco del repo revierte restricted_mode, auto_describe,
          # el modelo y los DESTINOS de las credenciales (openai.api_base,
          # github.base_url, jira.jira_site); con estas variables, ninguno.
          # WorkingDir /app y solo `.review/` montado: el codigo del PR (su
          # pyproject.toml incluido) no entra en el contenedor.
          timeout 420 docker run --rm --name "pr-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -v "$PR_AGENT_DIR/host.toml:/app/pr_agent/settings_prod/.secrets.toml:ro" \
            -v "$GITHUB_EVENT_PATH:/github/event.json:ro" \
            -v "$GITHUB_WORKSPACE/.review:/github/workspace/.review:ro" \
            -v "$PR_AGENT_DIR/out:/github/out" \
            -e GITHUB_EVENT_NAME -e GITHUB_REPOSITORY -e GITHUB_RUN_ID \
            -e GITHUB_EVENT_PATH=/github/event.json \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_OUTPUT=/github/out/github_output \
            -e GITHUB_TOKEN -e OPENAI_KEY -e OPENAI__API_BASE \
            -e JIRA__JIRA_API_EMAIL -e JIRA__JIRA_API_TOKEN \
            -e CONFIG__RESTRICTED_MODE=true \
            -e GITHUB_ACTION_CONFIG__AUTO_DESCRIBE=false \
            -e CONFIG__MODEL=openai/alibaba-q38-flash \
            -e 'CONFIG__FALLBACK_MODELS=[]' \
            -e GITHUB__BASE_URL=https://api.github.com \
            -e JIRA__JIRA_SITE=e-dani \
            -e ARTIFACT_PATH=.review/pr-agent-context.md \
            -e PUSH_OUTPUTS__ENABLE=true \
            -e 'PUSH_OUTPUTS__CHANNELS=["file"]' \
            -e PUSH_OUTPUTS__FILE_PATH=/github/out/pr-agent-outputs.jsonl \
            -e GITHUB_ACTION_CONFIG__ENABLE_OUTPUT=true \
            "$PR_AGENT_IMAGE" 2>&1 | tee "$PR_AGENT_DIR/pr-agent.log"
          rc=${PIPESTATUS[0]}
          echo "ran=true" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - inicio ))" >> "$GITHUB_OUTPUT"
          [ "$rc" = 124 ] && docker rm -f "pr-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > /dev/null 2>&1
          # 401/403 = credencial rota (key de LiteLLM, token de GitHub): rojo (D3).
          # Timeout, cola, 429, 5xx o conexion rechazada = modelo no disponible: verde.
          # Decide scripts/pr-agent-auth-check.py (INFRA-620): solo lineas ERROR/WARNING/
          # CRITICAL o traceback; el volcado DEBUG del diff y del prompt no cuenta.
          python3 .llm-review-framework/scripts/pr-agent-auth-check.py \
            "$PR_AGENT_DIR/pr-agent.log" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Distribute the review
        id: distribucion
        if: ${{ always() && steps.guarda.outputs.fork != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRAIN_CI_KEY: ${{ secrets.BRAIN_CI_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MOTOR_RAN: ${{ steps.motor.outputs.ran }}
        run: |
          set -uo pipefail
          mkdir -p .review
          out="$PR_AGENT_DIR/out/pr-agent-outputs.jsonl"
          # Contrato de review-distribute.py: sin fichero = skipped (el motor no
          # corrio); vacio = degraded (corrio y no publico review).
          rm -f .review/review.md
          if [ "${MOTOR_RAN}" = "true" ]; then
            : > .review/review.md
            if [ -s "$out" ]; then
              cp "$out" .review/pr-agent-outputs.jsonl
              jq -r 'select(.type=="review" or .type=="improve") | .markdown // empty' "$out" \
                > .review/review.md || : > .review/review.md
            fi
            if [ -s "$PR_AGENT_DIR/out/github_output" ]; then
              cp "$PR_AGENT_DIR/out/github_output" .review/pr-agent-github-output.txt
            fi
          fi
          distribuidor=.llm-review-framework/scripts/review-distribute.py
          if [ ! -f "$distribuidor" ]; then
            echo "::warning::sin scripts/review-distribute.py en el framework: distribucion degradada"
            echo "rc=127" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--repo "$REPO" --pr "$PR_NUMBER" --head-sha "$PR_HEAD_SHA" --out-dir .review)
          [ -f .review/review.md ] && args+=(--review-md .review/review.md)
          # Hallazgo de contrato en linea, determinista: review-context.py ya sabe el fichero
          # y la linea del value que cambio; review-distribute.py lo publica por la API de
          # GitHub sin depender de que el modelo obedezca (seguimiento D, INFRA-332/333).
          [ -f .review/contract-findings.json ] && args+=(--findings .review/contract-findings.json)
          python3 "$distribuidor" "${args[@]}"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            4) echo "::error::review-distribute: una API respondio 401/403 (credencial rota)" ;;
            *) echo "::warning::review-distribute salio $rc; la review sigue publicada en el PR" ;;
          esac
          exit 0

      - name: Upload the review record
        if: ${{ always() && steps.guarda.outputs.fork != 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: .review/
          # `.review/` es un directorio oculto: sin esto upload-artifact (v4+) no
          # sube nada y scripts/review-health.py no ve ningun run (INFRA-333).
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      - name: Review verdict
        id: estado
        if: ${{ always() && steps.guarda.outputs.fork != 'true' }}
        env:
          CONTEXTO_RC: ${{ steps.contexto.outputs.rc }}
          PULL_RC: ${{ steps.imagen.outputs.rc }}
          CONFIG_OK: ${{ steps.config.outputs.ok }}
          CONFIG_SHA: ${{ steps.config.outputs.sha256 }}
          MOTOR_RAN: ${{ steps.motor.outputs.ran }}
          MOTOR_RC: ${{ steps.motor.outputs.rc }}
          MOTOR_SECONDS: ${{ steps.motor.outputs.seconds }}
          MOTOR_AUTH: ${{ steps.motor.outputs.auth }}
          DIST_RC: ${{ steps.distribucion.outputs.rc }}
        run: |
          set -uo pipefail
          p=.review/payload.json
          if [ -s "$p" ]; then
            status="$(jq -r '.status' "$p")"
            reco="$(jq -r '.merge_recommendation' "$p")"
            n="$(jq -r '.findings | length' "$p")"
          else
            status=skipped; reco=unknown; n=0
          fi
          # Sin motor no hay review publicada, diga lo que diga el payload.
          [ "${MOTOR_RAN}" = "true" ] || status=skipped
          if [ "$status" != "ok" ]; then veredicto=omitido
          elif [ "$reco" = "changes_required" ] || [ "$n" -gt 0 ]; then veredicto=hallazgos
          else veredicto=ok; fi
          resumen="$(head -c 300 .review/notify.txt 2>/dev/null | tr '\n' ' ')"
          [ -n "$resumen" ] || resumen="review ${status}"
          {
            echo "status=$status"
            echo "veredicto=$veredicto"
            echo "n_hallazgos=$n"
            echo "resumen=$resumen"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Review del PR (PR-Agent) · status: \`$status\`"
            echo
            echo "| paso | resultado |"
            echo "|---|---|"
            echo "| contexto (review-context.py) | rc=${CONTEXTO_RC:-no corrio} |"
            echo "| imagen (Harbor, por digest) | rc=${PULL_RC:-no corrio} |"
            echo "| config montada (sha256 ${CONFIG_SHA:0:12}) | valida=${CONFIG_OK:-no} |"
            echo "| PR-Agent | corrio=${MOTOR_RAN:-false} rc=${MOTOR_RC:--} ${MOTOR_SECONDS:-?} s |"
            echo "| distribucion (review-distribute.py) | rc=${DIST_RC:-no corrio} |"
            echo
            echo "recomendacion: \`$reco\` · hallazgos: $n"
            if [ -f .review/notify.txt ]; then echo; echo '```'; cat .review/notify.txt; echo '```'; fi
            if [ -f .review/context.md ]; then echo; sed -n '/^## Degradaciones/,$p' .review/context.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
          # D3: rojo solo por credencial rota (401/403) o uso invalido.
          fallo=""
          [ "${MOTOR_AUTH}" = "true" ] && fallo="$fallo LiteLLM/GitHub 401-403 en PR-Agent;"
          [ "${PULL_RC}" = "4" ] && fallo="$fallo Harbor 401-403;"
          [ "${CONTEXTO_RC}" = "4" ] && fallo="$fallo review-context 401-403;"
          [ "${CONTEXTO_RC}" = "2" ] && fallo="$fallo review-context uso invalido;"
          [ "${DIST_RC}" = "4" ] && fallo="$fallo review-distribute 401-403;"
          [ "${DIST_RC}" = "2" ] && fallo="$fallo review-distribute uso invalido;"
          if [ -n "$fallo" ]; then
            echo "::error::review en rojo por credencial rota o uso invalido:${fallo}"
            exit 1
          fi
          if [ "$status" != "ok" ]; then
            echo "::warning::review ${status}: no bloquea nada (D3). Detalle en el resumen del job."
          fi

  # Modo validacion: comenta el ultimo commit del tronco, sin ensuciar con PRs
  # de prueba. Job aparte porque la API de comentarios de commit exige
  # `contents: write`, y ese permiso no tiene por que vivir en el modo PR.
  revisar_commit:
    name: Review del ultimo commit
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      # `contents: read`, no `write`. Con write, GitHub rechaza el run ENTERO
      # al arrancar (startup_failure, sin jobs y sin anotacion util) porque el
      # llamador solo concede lectura: la validacion de permisos ocurre antes
      # que el `if:`, asi que no basta con que este job no llegue a correr.
      # Medido el 22-08-2026 con el primer PR piloto.
      # Consecuencia asumida: en modo `workflow_dispatch` la review se queda en
      # el resumen del job en vez de comentarse en el commit.
      contents: read
    outputs:
      veredicto: ${{ steps.revisar.outputs.veredicto }}
      resumen: ${{ steps.revisar.outputs.resumen }}
      n_hallazgos: ${{ steps.revisar.outputs.n_hallazgos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the review framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository || 'pocharlies-org/k8s-gitops-pocharlies' }}
          ref: ${{ job.workflow_sha || 'main' }}
          token: ${{ github.token }}
          persist-credentials: false
          path: .llm-review-framework

      - name: Compute the diff
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "HEAD~1" >/dev/null; then
            base="$(git rev-parse HEAD~1)"
          else
            # Arbol vacio: el primer commit del repo se revisa entero.
            base=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          fi
          git diff -M --no-color "$base" HEAD > "$RUNNER_TEMP/review.diff"
          echo "diff: $(wc -c < "$RUNNER_TEMP/review.diff") bytes"

      - name: Review
        id: revisar
        env:
          REVIEW_LITELLM_URL: ${{ inputs.litellm_url }}
          REVIEW_LITELLM_KEY: ${{ secrets.LITELLM_CI_KEY }}
          REVIEW_MODEL: ${{ inputs.model }}
          REVIEW_DIFF_FILE: ${{ runner.temp }}/review.diff
          REVIEW_MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
          # Muy por debajo de los 600 s del proxy: con maxRunners=3 un job
          # colgado es un tercio del CI de la organizacion parado.
          REVIEW_TIMEOUT_SECONDS: '120'
          REVIEW_GITHUB_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR_NUMBER: ''
          REVIEW_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          revisor=.llm-review-framework/.github/actions/llm-review/review.py
          if [ ! -f "$revisor" ]; then
            echo "::error::no se pudo traer el framework de review"
            exit 1
          fi
          python3 "$revisor"

  avisar:
    name: Aviso en Telegram
    needs: [revisar_pr, revisar_pr_agent, revisar_commit]
    # Los dos modos son excluyentes: uno de los dos jobs queda SIEMPRE en
    # `skipped`, y un need saltado salta tambien a quien depende de el salvo
    # que la condicion diga otra cosa. Se avisa cuando el que toco ejecutar
    # termino, con exito o con fallo (un 401 de LiteLLM es justo el aviso que
    # hace falta). `skipped` es el otro modo y `cancelled` es un push que
    # adelanto a este: ninguno de los dos merece aviso.
    # `always()` NO es decoracion: `needs` incluye los DOS modos y solo uno
    # corre, asi que el otro queda `skipped` — y un job cuyo `needs` tiene un
    # skipped se salta entero, por mucho que la condicion de despues sea
    # cierta. Medido en el primer PR piloto: review publicada y aviso mudo.
    if: >-
      ${{ always() && inputs.notificar && (
          needs.revisar_pr.result == 'success' ||
          needs.revisar_pr.result == 'failure' ||
          needs.revisar_pr_agent.result == 'success' ||
          needs.revisar_pr_agent.result == 'failure' ||
          needs.revisar_commit.result == 'success' ||
          needs.revisar_commit.result == 'failure') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the review framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository || 'pocharlies-org/k8s-gitops-pocharlies' }}
          ref: ${{ job.workflow_sha || 'main' }}
          token: ${{ github.token }}
          persist-credentials: false
          path: .llm-review-framework

      - name: Compose the notice
        id: componer
        env:
          # El contexto `secrets` no existe en un `if:`, asi que la ausencia de
          # secretos se resuelve aqui: sin ellos no se avisa, y el job no
          # inventa un fallo por algo que el repo no ha configurado.
          TG_TOKEN: ${{ secrets.TELEGRAM_CI_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CI_CHAT_ID }}
          # `resumen` es TEXTO DEL MODELO: entra por entorno, jamas por `${{ }}`
          # dentro del `run`.
          VEREDICTO: ${{ needs.revisar_pr.outputs.veredicto || needs.revisar_pr_agent.outputs.veredicto || needs.revisar_commit.outputs.veredicto }}
          # Con pr-agent, RESUMEN es `.review/notify.txt` de review-distribute.py:
          # ese script no envia Telegram, lo envia este job (diseño §6).
          RESUMEN: ${{ needs.revisar_pr.outputs.resumen || needs.revisar_pr_agent.outputs.resumen || needs.revisar_commit.outputs.resumen }}
          N_HALLAZGOS: ${{ needs.revisar_pr.outputs.n_hallazgos || needs.revisar_pr_agent.outputs.n_hallazgos || needs.revisar_commit.outputs.n_hallazgos }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
            echo "::notice::sin secretos de Telegram; no se avisa"
            echo "hay=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `omitido` NO es "sin novedades": es que la review NO SE HIZO. Con
          # `sin_cambios` el aviso salia "sin novedades / no hay que hacer
          # nada" encima de un 503, que es mentir en dos lineas seguidas.
          case "${VEREDICTO}" in
            ok)        estado=ok ;;
            hallazgos) estado=fallo ;;
            omitido)   estado=no_hecho ;;
            *)         estado=fallo; VEREDICTO="sin veredicto (review no ejecutada)" ;;
          esac
          destino="commit ${GITHUB_SHA:0:12}"
          [ -n "${PR_NUMERO}" ] && destino="PR #${PR_NUMERO}"
          # El RESUMEN puede ser un volcado JSON de LiteLLM. Se recorta a lo
          # que se entiende: el resto esta en el run.
          motivo="$(printf '%s' "${RESUMEN}" | head -c 300 | tr '\n' ' ')"
          {
            case "${VEREDICTO}" in
              ok)        echo "He revisado ${destino} y no he visto nada que corregir." ;;
              hallazgos) echo "He revisado ${destino} y hay ${N_HALLAZGOS:-0} cosa(s) que mirar." ;;
              omitido)   echo "No he podido revisar ${destino}." ;;
              *)         echo "La revisión de ${destino} no llegó a hacerse." ;;
            esac
            [ -n "${motivo}" ] && echo "${motivo}"
            echo "run: ${RUN_URL}"
          } > "$RUNNER_TEMP/aviso.txt"
          echo "hay=true" >> "$GITHUB_OUTPUT"
          echo "estado=${estado}" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        # `strict: true` + `continue-on-error: true`: un aviso perdido se ve en
        # rojo en el paso, pero no tumba el job ni inventa un exito.
        if: ${{ steps.componer.outputs.hay == 'true' }}
        continue-on-error: true
        env:
          NOTIFY_TOKEN: ${{ secrets.TELEGRAM_CI_BOT_TOKEN }}
          NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_CI_CHAT_ID }}
          NOTIFY_STATE: ${{ steps.componer.outputs.estado }}
          NOTIFY_TOPIC: ${{ inputs.telegram_topic }}
          # El input gana; si viene vacio, el secreto de ORGANIZACION
          # TELEGRAM_CI_THREAD_ID pone el thread para los 113 repos sin tocar
          # sus plantillas. Sin ninguno de los dos, el topic `ci` no se puede
          # resolver (el mapa vive en el repo del release-bot) y el aviso caeria
          # en General marcado como no disponible.
          # Tercer escalon en claro a proposito: la organizacion esta en plan
          # FREE, donde los secretos de organizacion NO alcanzan a los repos
          # privados — y 65 de los 113 activos lo son. Un id de topic no abre
          # nada por si solo, asi que el destino sigue funcionando ahi sin
          # replicar un secreto en 65 repos.
          NOTIFY_THREAD_ID: ${{ inputs.telegram_thread_id || secrets.TELEGRAM_CI_THREAD_ID || '63' }}
          NOTIFY_STRICT: 'true'
        run: |
          set -uo pipefail
          notificador=.llm-review-framework/.github/actions/notify-telegram/notify_telegram.py
          if [ ! -f "$notificador" ]; then
            echo "::error::no se pudo traer el notificador"
            exit 1
          fi
          NOTIFY_TEXT="$(cat "$RUNNER_TEMP/aviso.txt")" python3 "$notificador"
