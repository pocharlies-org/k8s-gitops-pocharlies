name: probe-thread
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: arc-k8s
    timeout-minutes: 8
    steps:
      - name: ¿Qué thread gana realmente?
        env:
          S: ${{ secrets.TELEGRAM_CI_THREAD_ID }}
          F: ${{ secrets.TELEGRAM_CI_THREAD_ID || '63' }}
        run: |
          set -uo pipefail
          echo "secreto declara: '${S:-VACIO}'"
          echo "expresion resuelve a: '$F'"
          [ "$F" = "63" ] && echo "OK: usaria el topic ci real" || echo "PROBLEMA: usaria '$F', que no es 63"
