name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  standard:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner: arc-k8s
      run_node: false
      run_docker_build: false
      kustomize_paths: "."
    secrets: inherit

  release-contract:
    name: GitOps and release security contracts
    runs-on: arc-k8s
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install verified Python
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) arch=x86_64; expected=5854aa6ec71cad00334d5065633c210b2e7feb40956767a59a91791cadcf0b79 ;;
            aarch64|arm64) arch=aarch64; expected=f226576b91491ffa5739aa85726521e9031f4d87f80627d64ed348ac77cb31e9 ;;
            *) echo "Unsupported Python runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/cpython-3.12.13-${arch}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-${arch}-unknown-linux-gnu-install_only_stripped.tar.gz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python/bin/python3" --version
      - name: Install hash-locked checker dependency
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/pyyaml-6.0.3.whl"
          yaml_lib="$RUNNER_TEMP/release-contract-yaml"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://files.pythonhosted.org/packages/71/60/917329f640924b18ff085ab889a11c763e0b573da888e8404ff486657602/pyyaml-6.0.3-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" \
            -o "$wheel"
          echo "b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d  $wheel" \
            | sha256sum --check --strict
          mkdir -p "$yaml_lib"
          python3 -m zipfile -e "$wheel" "$yaml_lib"
          echo "PYTHONPATH=$yaml_lib" >> "$GITHUB_ENV"
      - run: python3 scripts/check-workflow-pins.py
      - run: python3 scripts/check-manifest-promotion.py
      - run: python3 scripts/check-release-supply-chain.py
      - run: python3 -m unittest tests/test_synapse_sre_foundation_app.py
