name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  standard:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      # Bootstrap only: arc-k8s cannot run this repair until its DinD init is
      # fixed. arc-openclaw is scoped to a different repository, so use the
      # hosted runner once; the follow-up token-boundary PR restores arc-k8s
      # after a live canary proves the pool healthy.
      runner: ubuntu-latest
      run_node: false
      run_docker_build: false
      kustomize_paths: "."
    secrets: inherit
  application-contracts:
    name: Application contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
