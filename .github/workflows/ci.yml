name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  standard:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner: arc-k8s
      run_node: false
      run_docker_build: false
      kustomize_paths: "."
    secrets: inherit

  release-contract:
    name: GitOps and release security contracts
    runs-on: arc-k8s
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-manifest-promotion.py
      - run: python3 scripts/check-release-supply-chain.py
