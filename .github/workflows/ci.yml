name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  standard:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner: arc-k8s
      run_node: false
      run_docker_build: false
      kustomize_paths: "."
    secrets: inherit

  release-contract:
    name: GitOps and release security contracts
    runs-on: arc-k8s
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11.14"
          architecture: x64
      - name: Install hash-locked checker dependency
        run: |
          set -euo pipefail
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d' \
            > "$RUNNER_TEMP/release-contract-requirements.txt"
          python3 -m pip install \
            --quiet --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes -r "$RUNNER_TEMP/release-contract-requirements.txt"
      - run: python3 scripts/check-workflow-pins.py
      - run: python3 scripts/check-manifest-promotion.py
      - run: python3 scripts/check-release-supply-chain.py
      - run: python3 -m unittest tests/test_synapse_sre_foundation_app.py
