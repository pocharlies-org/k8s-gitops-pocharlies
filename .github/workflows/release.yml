name: Release Production

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional explicit image tag, for example v1.2.3
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: release-prod-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner: arc-k8s
      run_node: false
      run_docker_build: false
      kustomize_paths: "."
    # inherit y no una lista: el notificador compartido necesita el token de
    # Telegram, y enumerarlo aqui obligaria a tocar este fichero cada vez que
    # el reusable cambie de secretos. Es lo que ya hacen los otros 83 llamantes.
    secrets: inherit

  release:
    needs: [ci]
    uses: ./.github/workflows/reusable-manifest-pr-release.yml
    with:
      runner: arc-k8s
      source_path: "."
      artifact_name: k8s-gitops-pocharlies
      version: ${{ inputs.image_tag || (github.ref_type == 'tag' && github.ref_name) || format('gitops-{0}', github.sha) }}
      image_promotions: "[]"
      image_targets: "[]"
      manifest_only: true
    secrets:
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      # El resto (Telegram) llega por el entorno del repo; estos dos van
      # explicitos porque el reusable los declara required.
