name: Reusable Deploy Staging

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: arc-k8s
      registry:
        type: string
        default: harbor.lan.e-dani.com
      registry_project:
        type: string
        default: homelab
      images:
        description: JSON array of {name, context, dockerfile}
        type: string
        required: true
      overlay_path:
        type: string
        default: k8s/overlays/stg
      tag_prefix:
        type: string
        default: stg
      smoke_url:
        type: string
        default: ""
      smoke_path:
        type: string
        default: /health
      docker_build_timeout:
        description: Per-image docker build timeout, passed to GNU timeout.
        type: string
        default: 30m
    secrets:
      HARBOR_USER:
        required: true
      HARBOR_PASSWORD:
        required: true
      OPENCLAW_GITHUB_NOTIFY_URL:
        required: false
      OPENCLAW_GITHUB_NOTIFY_TOKEN:
        required: false
      OPENCLAW_TELEGRAM_BOT_TOKEN:
        required: false
      OPENCLAW_TELEGRAM_TARGET:
        required: false
      OPENCLAW_TELEGRAM_THREAD_ID:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, push, stamp staging
    permissions:
      contents: write
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install verified Node.js
        run: |
          set -euo pipefail
          version=v24.19.0
          case "$(uname -m)" in
            x86_64|amd64) arch=x64; expected=14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647 ;;
            aarch64|arm64) arch=arm64; expected=01443c1e1a29e531ccad5a46fefa6df490d2189c49f7955904aecdbb0fe86fdc ;;
            *) echo "Unsupported Node runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/node-${version}-${arch}.tar.xz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://nodejs.org/dist/${version}/node-${version}-linux-${arch}.tar.xz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${version}-linux-${arch}/bin" >> "$GITHUB_PATH"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Install verified Docker Buildx and BuildKit
        env:
          BUILDX_VERSION: v0.36.0
          BUILDKIT_IMAGE: moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64; expected=07823fdfcd82a41be90155a8b16876c1a780a6462de805a9f3f63b3119ccfb99 ;;
            aarch64|arm64) arch=arm64; expected=70382de03915c07c488ae4ddc4f7e169ee978f953e754ecfce110ba017e0132b ;;
            *) echo "Unsupported Buildx runner architecture: $(uname -m)"; exit 1 ;;
          esac
          plugin_dir="$HOME/.docker/cli-plugins"
          mkdir -p "$plugin_dir"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${arch}" \
            -o "$plugin_dir/docker-buildx"
          echo "${expected}  ${plugin_dir}/docker-buildx" | sha256sum --check --strict
          chmod 0755 "$plugin_dir/docker-buildx"
          docker buildx version
          docker buildx create --name rho-staging-builder \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use
          docker buildx inspect --bootstrap

      - name: Build and push immutable staging images
        env:
          IMAGES: ${{ inputs.images }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PROJECT: ${{ inputs.registry_project }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          DOCKER_BUILD_TIMEOUT: ${{ inputs.docker_build_timeout }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          TAG="${TAG_PREFIX}-${SHORT_SHA}"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

          node <<'NODE' > "$RUNNER_TEMP/images.tsv"
          const images = JSON.parse(process.env.IMAGES || "[]");
          for (const image of images) {
            console.log([
              image.name,
              image.context || ".",
              image.dockerfile || "Dockerfile",
            ].join("\t"));
          }
          NODE

          while IFS=$'\t' read -r name context dockerfile; do
            [ -n "$name" ] || continue
            image="${REGISTRY}/${REGISTRY_PROJECT}/${name}:${TAG}"
            timeout "$DOCKER_BUILD_TIMEOUT" docker buildx build \
              --platform linux/amd64 \
              --progress=plain \
              --file "$dockerfile" \
              --tag "$image" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --push \
              "$context"
          done < "$RUNNER_TEMP/images.tsv"

      - name: Install kustomize
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          KUSTOMIZE_VERSION=v5.5.0
          KUSTOMIZE_TGZ="$RUNNER_TEMP/kustomize.tar.gz"
          curl -fsSL \
            --retry 3 \
            --retry-all-errors \
            -o "$KUSTOMIZE_TGZ" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "6703a3a70a0c47cf0b37694030b54f1175a9dfeb17b3818b623ed58b9dbc2a77  $KUSTOMIZE_TGZ" \
            | sha256sum --check --strict
          tar xzf "$KUSTOMIZE_TGZ" -C "$RUNNER_TEMP/bin" kustomize

      - name: Stamp staging overlay
        env:
          IMAGES: ${{ inputs.images }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PROJECT: ${{ inputs.registry_project }}
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/image-names.txt"
          const images = JSON.parse(process.env.IMAGES || "[]");
          for (const image of images) console.log(image.name);
          NODE

          while read -r name; do
            [ -n "$name" ] || continue
            kustomize edit set image \
              "${REGISTRY}/${REGISTRY_PROJECT}/${name}=${REGISTRY}/${REGISTRY_PROJECT}/${name}:${IMAGE_TAG}"
          done < "$RUNNER_TEMP/image-names.txt"
        working-directory: ${{ inputs.overlay_path }}

      - name: Commit staging image stamp
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.overlay_path }}/kustomization.yaml"
          if git diff --staged --quiet; then
            echo "No staging overlay changes"
          else
            git commit -m "ci(stg): stamp images ${IMAGE_TAG} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Smoke test staging
        if: ${{ inputs.smoke_url != '' }}
        run: |
          set -euo pipefail
          url="${{ inputs.smoke_url }}${{ inputs.smoke_path }}"
          for i in $(seq 1 30); do
            if curl -fsS "$url"; then
              echo "Smoke test passed: $url"
              exit 0
            fi
            echo "Waiting for staging rollout ($i/30)"
            sleep 10
          done
          echo "Smoke test failed: $url"
          exit 1

  notify:
    name: Notify OpenClaw on staging failure
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    needs: [deploy]
    if: ${{ always() && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') }}
    timeout-minutes: 10
    steps:
      - name: Send failure report
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          OPENCLAW_GITHUB_NOTIFY_URL: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_URL }}
          OPENCLAW_GITHUB_NOTIFY_TOKEN: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_TOKEN }}
          OPENCLAW_TELEGRAM_BOT_TOKEN: ${{ secrets.OPENCLAW_TELEGRAM_BOT_TOKEN }}
          OPENCLAW_TELEGRAM_TARGET: ${{ secrets.OPENCLAW_TELEGRAM_TARGET }}
          OPENCLAW_TELEGRAM_THREAD_ID: ${{ secrets.OPENCLAW_TELEGRAM_THREAD_ID }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = [
              `GitHub Actions staging deploy failed`,
              `repo: ${context.repo.owner}/${context.repo.repo}`,
              `ref: ${context.ref}`,
              `sha: ${context.sha.slice(0, 12)}`,
              `run: ${runUrl}`,
            ].join('\n');

            async function postWebhook() {
              const url = process.env.OPENCLAW_GITHUB_NOTIFY_URL;
              if (!url) return false;
              const headers = { 'content-type': 'application/json' };
              if (process.env.OPENCLAW_GITHUB_NOTIFY_TOKEN) {
                headers.authorization = `Bearer ${process.env.OPENCLAW_GITHUB_NOTIFY_TOKEN}`;
              }
              const response = await fetch(url, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  source: 'github-actions',
                  destination: { group: 'synaspte', topic: 'github' },
                  event: 'staging_deploy_failed',
                  repo: `${context.repo.owner}/${context.repo.repo}`,
                  workflow: context.workflow,
                  runId: context.runId,
                  runNumber: context.runNumber,
                  ref: context.ref,
                  sha: context.sha,
                  actor: context.actor,
                  runUrl,
                  text,
                }),
              });
              if (!response.ok) core.warning(`OpenClaw webhook returned HTTP ${response.status}`);
              return true;
            }

            async function sendTelegramBotFallback() {
              if (!process.env.OPENCLAW_TELEGRAM_BOT_TOKEN) return false;
              if (!process.env.OPENCLAW_TELEGRAM_TARGET || !process.env.OPENCLAW_TELEGRAM_THREAD_ID) return false;
              const response = await fetch(
                `https://api.telegram.org/bot${process.env.OPENCLAW_TELEGRAM_BOT_TOKEN}/sendMessage`,
                {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    chat_id: process.env.OPENCLAW_TELEGRAM_TARGET,
                    message_thread_id: Number(process.env.OPENCLAW_TELEGRAM_THREAD_ID),
                    text,
                    disable_web_page_preview: true,
                  }),
                },
              );
              if (!response.ok) core.warning(`Telegram fallback returned HTTP ${response.status}`);
              return response.ok;
            }

            const webhookSent = await postWebhook();
            const telegramSent = webhookSent ? false : await sendTelegramBotFallback();
            if (!webhookSent && !telegramSent) {
              core.warning('OpenClaw notification skipped: configure OPENCLAW_GITHUB_NOTIFY_URL or OPENCLAW_TELEGRAM_BOT_TOKEN secrets');
            }
