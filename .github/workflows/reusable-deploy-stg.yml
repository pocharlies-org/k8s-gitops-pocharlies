name: Reusable Deploy Staging

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: arc-k8s
      node_version:
        description: "Reviewed Node line: 22 or 24 (mapped to an exact checksummed patch)."
        type: string
        default: "24"
      registry:
        type: string
        default: harbor.lan.e-dani.com
      registry_project:
        type: string
        default: homelab
      images:
        description: JSON array of {name, context, dockerfile}
        type: string
        required: true
      overlay_path:
        type: string
        default: k8s/overlays/stg
      tag_prefix:
        type: string
        default: stg
      smoke_url:
        type: string
        default: ""
      smoke_path:
        type: string
        default: /health
      docker_build_timeout:
        description: Per-image docker build timeout, passed to GNU timeout.
        type: string
        default: 30m
    secrets:
      HARBOR_USER:
        required: true
      HARBOR_PASSWORD:
        required: true
      OPENCLAW_GITHUB_NOTIFY_URL:
        required: false
      OPENCLAW_GITHUB_NOTIFY_TOKEN:
        required: false
      OPENCLAW_TELEGRAM_BOT_TOKEN:
        required: false
      OPENCLAW_TELEGRAM_TARGET:
        required: false
      OPENCLAW_TELEGRAM_THREAD_ID:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, push, stamp staging
    permissions:
      contents: write
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install verified Node.js
        env:
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          case "$NODE_VERSION" in
            22|22.23.2) version=v22.23.2 ;;
            24|24.19.0) version=v24.19.0 ;;
            *) echo "node_version must be reviewed line 22 or 24"; exit 1 ;;
          esac
          case "${version}:$(uname -m)" in
            v22.23.2:x86_64|v22.23.2:amd64) arch=x64; expected=b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a ;;
            v22.23.2:aarch64|v22.23.2:arm64) arch=arm64; expected=013b59cfd2819703a6f4a14ab891fc46fc2a4e3f5bcd92de3fb4929b43e35b30 ;;
            v24.19.0:x86_64|v24.19.0:amd64) arch=x64; expected=f625d97cd707df4ff96254916fbc5ff014f09c09effe5a1e0ca8f6d41a8789d4 ;;
            v24.19.0:aarch64|v24.19.0:arm64) arch=arm64; expected=d28c8a5bf0a808f0ed434a1dce8c54ae98f0371c0bd86ac58abc613f73e6643f ;;
            *) echo "Unsupported Node runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/node-${version}-${arch}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://nodejs.org/dist/${version}/node-${version}-linux-${arch}.tar.gz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${version}-linux-${arch}/bin" >> "$GITHUB_PATH"

      - name: Validate fixed staging registry
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PROJECT: ${{ inputs.registry_project }}
        run: |
          set -euo pipefail
          [ "$REGISTRY" = "harbor.lan.e-dani.com" ] || { echo "Staging registry is not allowlisted: $REGISTRY"; exit 1; }
          echo "$REGISTRY_PROJECT" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,62}$' || { echo "Invalid registry project"; exit 1; }

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Install verified Docker Buildx and BuildKit
        env:
          BUILDX_VERSION: v0.36.0
          BUILDKIT_IMAGE: moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64; expected=07823fdfcd82a41be90155a8b16876c1a780a6462de805a9f3f63b3119ccfb99 ;;
            aarch64|arm64) arch=arm64; expected=70382de03915c07c488ae4ddc4f7e169ee978f953e754ecfce110ba017e0132b ;;
            *) echo "Unsupported Buildx runner architecture: $(uname -m)"; exit 1 ;;
          esac
          plugin_dir="$HOME/.docker/cli-plugins"
          mkdir -p "$plugin_dir"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${arch}" \
            -o "$plugin_dir/docker-buildx"
          echo "${expected}  ${plugin_dir}/docker-buildx" | sha256sum --check --strict
          chmod 0755 "$plugin_dir/docker-buildx"
          docker buildx version
          builder="rho-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BUILDX_BUILDER=$builder" >> "$GITHUB_ENV"
          docker buildx create --name "$builder" \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use
          docker buildx inspect --bootstrap

      - name: Build and push immutable staging images
        env:
          IMAGES: ${{ inputs.images }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PROJECT: ${{ inputs.registry_project }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          DOCKER_BUILD_TIMEOUT: ${{ inputs.docker_build_timeout }}
        run: |
          set -euo pipefail
          if ! echo "$DOCKER_BUILD_TIMEOUT" | grep -Eq '^[1-9][0-9]*[smh]$'; then
            echo "docker_build_timeout must be a positive duration ending in s, m or h"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::12}"
          if ! echo "$TAG_PREFIX" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$'; then
            echo "tag_prefix is not registry-compatible"
            exit 1
          fi
          TAG="${TAG_PREFIX}-${SHORT_SHA}"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

          node <<'NODE' > "$RUNNER_TEMP/images.tsv"
          const images = JSON.parse(process.env.IMAGES || "[]");
          if (!Array.isArray(images) || images.length === 0) throw new Error("images must be a non-empty JSON array");
          const segment = /^[a-z0-9][a-z0-9._-]*$/;
          const safePath = /^(?:\.|[A-Za-z0-9_][A-Za-z0-9._/-]*)$/;
          const names = new Set();
          for (const image of images) {
            if (!image || typeof image !== "object" || typeof image.name !== "string" ||
                image.name.length > 128 || image.name.split("/").some((value) => !segment.test(value))) {
              throw new Error("each image name must be a registry-safe relative path");
            }
            if (names.has(image.name)) throw new Error(`duplicate image name: ${image.name}`);
            names.add(image.name);
            const context = image.context || ".";
            const dockerfile = image.dockerfile || "Dockerfile";
            if (!safePath.test(context) || !safePath.test(dockerfile) ||
                context.split("/").includes("..") || dockerfile.split("/").includes("..")) {
              throw new Error(`unsafe path for ${image.name}`);
            }
            console.log([
              image.name,
              context,
              dockerfile,
            ].join("\t"));
          }
          NODE

          while IFS=$'\t' read -r name context dockerfile; do
            [ -n "$name" ] || continue
            image="${REGISTRY}/${REGISTRY_PROJECT}/${name}:${TAG}"
            timeout "$DOCKER_BUILD_TIMEOUT" docker buildx build \
              --platform linux/amd64 \
              --progress=plain \
              --file "$dockerfile" \
              --tag "$image" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --push \
              "$context"
          done < "$RUNNER_TEMP/images.tsv"

      - name: Install kustomize
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          KUSTOMIZE_VERSION=v5.5.0
          KUSTOMIZE_TGZ="$RUNNER_TEMP/kustomize.tar.gz"
          curl -fsSL \
            --retry 3 \
            --retry-all-errors \
            -o "$KUSTOMIZE_TGZ" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "6703a3a70a0c47cf0b37694030b54f1175a9dfeb17b3818b623ed58b9dbc2a77  $KUSTOMIZE_TGZ" \
            | sha256sum --check --strict
          tar xzf "$KUSTOMIZE_TGZ" -C "$RUNNER_TEMP/bin" kustomize

      - name: Stamp staging overlay
        env:
          IMAGES: ${{ inputs.images }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PROJECT: ${{ inputs.registry_project }}
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/image-names.txt"
          const images = JSON.parse(process.env.IMAGES || "[]");
          for (const image of images) console.log(image.name);
          NODE

          while read -r name; do
            [ -n "$name" ] || continue
            kustomize edit set image \
              "${REGISTRY}/${REGISTRY_PROJECT}/${name}=${REGISTRY}/${REGISTRY_PROJECT}/${name}:${IMAGE_TAG}"
          done < "$RUNNER_TEMP/image-names.txt"
        working-directory: ${{ inputs.overlay_path }}

      - name: Commit staging image stamp
        env:
          OVERLAY_PATH: ${{ inputs.overlay_path }}
        run: |
          set -euo pipefail
          if ! echo "$OVERLAY_PATH" | grep -Eq '^[A-Za-z0-9._/-]+$' || echo "$OVERLAY_PATH" | grep -Eq '(^|/)\.\.(/|$)|^/'; then
            echo "overlay_path must be a safe repository-relative path"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY_PATH/kustomization.yaml"
          if git diff --staged --quiet; then
            echo "No staging overlay changes"
          else
            git commit -m "ci(stg): stamp images ${IMAGE_TAG} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Smoke test staging
        if: ${{ inputs.smoke_url != '' }}
        env:
          SMOKE_URL: ${{ inputs.smoke_url }}
          SMOKE_PATH: ${{ inputs.smoke_path }}
        run: |
          set -euo pipefail
          if ! echo "$SMOKE_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$'; then
            echo "smoke_url must be an HTTPS origin without path or credentials"
            exit 1
          fi
          if ! echo "$SMOKE_PATH" | grep -Eq '^/[A-Za-z0-9._~!$&()*+,;=:@%/-]*$'; then
            echo "smoke_path is not a safe URL path"
            exit 1
          fi
          url="${SMOKE_URL}${SMOKE_PATH}"
          for i in $(seq 1 30); do
            if curl -fsS "$url"; then
              echo "Smoke test passed: $url"
              exit 0
            fi
            echo "Waiting for staging rollout ($i/30)"
            sleep 10
          done
          echo "Smoke test failed: $url"
          exit 1

      - name: Remove ephemeral Buildx builder
        if: ${{ always() }}
        run: docker buildx rm "$BUILDX_BUILDER" || true

  notify:
    name: Notify OpenClaw on staging failure
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    needs: [deploy]
    if: ${{ always() && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') }}
    timeout-minutes: 10
    steps:
      - name: Send failure report
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          OPENCLAW_GITHUB_NOTIFY_URL: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_URL }}
          OPENCLAW_GITHUB_NOTIFY_TOKEN: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_TOKEN }}
          OPENCLAW_TELEGRAM_BOT_TOKEN: ${{ secrets.OPENCLAW_TELEGRAM_BOT_TOKEN }}
          OPENCLAW_TELEGRAM_TARGET: ${{ secrets.OPENCLAW_TELEGRAM_TARGET }}
          OPENCLAW_TELEGRAM_THREAD_ID: ${{ secrets.OPENCLAW_TELEGRAM_THREAD_ID }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = [
              `GitHub Actions staging deploy failed`,
              `repo: ${context.repo.owner}/${context.repo.repo}`,
              `ref: ${context.ref}`,
              `sha: ${context.sha.slice(0, 12)}`,
              `run: ${runUrl}`,
            ].join('\n');

            async function postWebhook() {
              const url = process.env.OPENCLAW_GITHUB_NOTIFY_URL;
              if (!url) return false;
              const headers = { 'content-type': 'application/json' };
              if (process.env.OPENCLAW_GITHUB_NOTIFY_TOKEN) {
                headers.authorization = `Bearer ${process.env.OPENCLAW_GITHUB_NOTIFY_TOKEN}`;
              }
              try {
                const response = await fetch(url, {
                  method: 'POST',
                  headers,
                  body: JSON.stringify({
                    source: 'github-actions',
                    destination: { group: 'synapse', topic: 'github' },
                    event: 'staging_deploy_failed',
                    repo: `${context.repo.owner}/${context.repo.repo}`,
                    workflow: context.workflow,
                    runId: context.runId,
                    runNumber: context.runNumber,
                    ref: context.ref,
                    sha: context.sha,
                    actor: context.actor,
                    runUrl,
                    text,
                  }),
                });
                if (!response.ok) core.warning(`OpenClaw webhook returned HTTP ${response.status}`);
                return response.ok;
              } catch (error) {
                core.warning(`OpenClaw webhook failed: ${error.message}`);
                return false;
              }
            }

            async function sendTelegramBotFallback() {
              if (!process.env.OPENCLAW_TELEGRAM_BOT_TOKEN) return false;
              if (!process.env.OPENCLAW_TELEGRAM_TARGET || !process.env.OPENCLAW_TELEGRAM_THREAD_ID) return false;
              try {
                const response = await fetch(
                  `https://api.telegram.org/bot${process.env.OPENCLAW_TELEGRAM_BOT_TOKEN}/sendMessage`,
                  {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({
                      chat_id: process.env.OPENCLAW_TELEGRAM_TARGET,
                      message_thread_id: Number(process.env.OPENCLAW_TELEGRAM_THREAD_ID),
                      text,
                      disable_web_page_preview: true,
                    }),
                  },
                );
                if (!response.ok) core.warning(`Telegram fallback returned HTTP ${response.status}`);
                return response.ok;
              } catch (error) {
                core.warning(`Telegram fallback failed: ${error.message}`);
                return false;
              }
            }

            const webhookSent = await postWebhook();
            const telegramSent = webhookSent ? false : await sendTelegramBotFallback();
            if (!webhookSent && !telegramSent) {
              core.warning('OpenClaw notification skipped: configure OPENCLAW_GITHUB_NOTIFY_URL or OPENCLAW_TELEGRAM_BOT_TOKEN secrets');
            }
