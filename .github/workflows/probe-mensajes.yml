name: probe-mensajes
# Sonda TEMPORAL: publica un ejemplo de cada estado para ver como quedan.
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probar:
    runs-on: arc-k8s
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      matrix:
        include:
          - est: detectada
            txt: "shield master@7461c51ba6ae (7461c51ba6ae6005b42b35c74c8cf250294915b8)\nupstream: redstone-md/shield\nmodo: notify_only"
          - est: audit_fail
            txt: "openchamber v1.19.0: el rebase tiene CONFLICTOS.\nNO se despliega; hay que resolverlos."
          - est: promovido
            txt: "openchamber b0487a0fdb207575920a\nweb: success · mac: success\ncanario+e2e: success"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: ./.github/actions/notify-telegram
        with:
          token:   ${{ secrets.TELEGRAM_CI_BOT_TOKEN || secrets.OPENCLAW_TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CI_CHAT_ID  || secrets.OPENCLAW_TELEGRAM_TARGET }}
          thread_id: ${{ secrets.TELEGRAM_CI_THREAD_ID || '63' }}
          state: ${{ matrix.est }}
          text: ${{ matrix.txt }}
          strict: 'true'
