# Apply this manually to cut over the existing root Application:
# kubectl apply -f bootstrap/app-of-apps.yaml -n argocd
# The name intentionally remains "root" to avoid two root apps competing
# over the same child Application resources during migration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-gitops-pocharlies
  labels:
    e-dani.com/tier: infra
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-gitops-pocharlies
    targetRevision: deploy/prod
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # 2026-09-29 SRE (argocd:root OutOfSync permanente): gpu-operator, kyverno y
  # longhorn arrastran finalizers pre/post-delete huerfanos de un `argocd app
  # delete` abortado (sin deletionTimestamp). El application-controller de ArgoCD
  # v3.4.2 los RE-AÑADE en cada reconcile (probado: quitados a mano vuelven en
  # <60 s), asi que root NO converge por mucho que se limpien: llevaba +35
  # auto-heals re-sincronizando las tres apps sin efecto. Ignoramos SOLO
  # /metadata/finalizers de estas tres Applications hijas (nombradas una a una,
  # no un wildcard): el resto del diff (spec, sources, syncPolicy) sigue
  # vigilado y cualquier otro drift de root se sigue viendo. Revisar al migrar
  # de ArgoCD o al depurar el delete colgado del controller.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: gpu-operator
      namespace: argocd
      jsonPointers:
        - /metadata/finalizers
    - group: argoproj.io
      kind: Application
      name: kyverno
      namespace: argocd
      jsonPointers:
        - /metadata/finalizers
    - group: argoproj.io
      kind: Application
      name: longhorn
      namespace: argocd
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
