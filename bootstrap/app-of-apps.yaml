# Apply this manually to cut over the existing root Application:
# kubectl apply -f bootstrap/app-of-apps.yaml -n argocd
# The name intentionally remains "root" to avoid two root apps competing
# over the same child Application resources during migration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies/k8s-gitops-pocharlies
  labels:
    e-dani.com/tier: infra
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies/k8s-gitops-pocharlies
    targetRevision: deploy/prod
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
