# Root ArgoCD Application — points to clusters/prod/ where all child Applications live.
# Apply once manually: kubectl apply -f bootstrap/argocd-app-of-apps.yaml
# Then ArgoCD takes over.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<YOUR_GITHUB_USER>/homelab-gitops.git
    targetRevision: main
    path: clusters/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false   # safety: don't auto-delete during early adoption
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
