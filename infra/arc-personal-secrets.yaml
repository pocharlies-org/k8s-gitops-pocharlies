# SC-1568 · secretos del PAT personal para los scale sets arc-personal-*.
# El chart gha-runner-scale-set resuelve githubConfigSecret en el namespace del
# release, y cada scale set personal vive ya en su ns arc-personal-<repo> (los
# nombres de recurso del chart derivan de runnerScaleSetName: en un mismo ns
# colisionan todos contra ARS/Role/SA "arc-k8s"). El PAT fuente sigue siendo
# UNO: secret arc-github-pat-secret en arc-systems, replicado por ESO con el
# patron kubernetes-store del hermes-studio-telegram-token (SA local +
# SecretStore + Role/RoleBinding en el ns origen).
