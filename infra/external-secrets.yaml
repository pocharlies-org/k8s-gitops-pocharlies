# external-secrets -- entra en GitOps el 15-08-2026. Hasta hoy era un `helm install` a mano y
# sus valores solo existian dentro del cluster.
#
# RIESGO: el chart es dueno de los CRDs (installCRDs: true). Un prune borraria
# ExternalSecret/SecretStore y con ellos el acceso a TODOS los secretos del
# cluster, que salen de Vault por aqui. prune: false.
#
# Multi-source: source 1 = chart upstream pinado a lo desplegado; source 2 = ESTE
# repo como $values.
#
# Diff de adopcion comprobado ANTES de activar el sync: `kubectl diff
# --server-side` del chart renderizado (con --include-crds y descontando hooks)
# contra el cluster vivo, exit 0 y cero lineas.
#
# OJO: adoptar NO borra el registro de Helm. `helm list -n external-secrets-operator` seguira
# reportando la release, pero manda ArgoCD y un `helm upgrade` lo revierte
# selfHeal en segundos. Cruza `helm list -A` con `kubectl -n argocd get application`.
#
# Un `ignoreDifferences` para esta app va al `kustomization.yaml` RAIZ con ruta
# `/spec/ignoreDifferences/-`: el patch general reemplaza la lista de este fichero.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/external-secrets/external-secrets
  labels:
    e-dani.com/tier: infra
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.5.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/infra/external-secrets/values.yaml
    - repoURL: https://github.com/pocharlies-org/k8s-gitops-pocharlies
      targetRevision: deploy/prod
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-operator
  # Sin `automated` a proposito: se activa en un commit aparte.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
