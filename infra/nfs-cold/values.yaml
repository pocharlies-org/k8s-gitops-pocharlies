# nfs-cold -- provisioner de la StorageClass `nfs-cold`, servida desde sauvage.
#
# ATENCION: esto NO es la salida literal de `helm get values`. Esos valores dicen
# `nodeSelector: {kubernetes.io/hostname: ubuntu, topology: lan, ...}`, pero el
# Deployment vivo lleva `node-pool: ks5-nvme` y el pod corre en ks5-cp-1. Alguien
# lo movio a mano despues del ultimo `helm upgrade` (rev 6, 22-05-2026). Se
# adopta el estado VIVO: adoptar con los valores de la release habria movido el
# provisioner de nodo sin que nadie lo pidiera.
#
# `nfs.server: 100.109.183.9` es la IP de TAILSCALE de sauvage, no una LAN: desde
# ks5 (OVH) es la unica ruta. Los 2 PV de esta clase la llevan grabada.
#
# `archiveOnDelete: true` es lo que evita que borrar un PVC borre los datos.
#
# INFRA-727: `nfs.mountOptions` va a la StorageClass (los PV NUEVOS nacen con estas
# opciones) y el chart 4.0.18 monta entonces el propio share del provisioner por un PV+PVC
# estático (`pv-nfs-cold-…`, 10Mi, Retain). Los PV YA existentes NO cambian: llevan
# mountOptions=None y hay que tramitarlos aparte (ver la PR). Sin esto, sauvage por relay
# DERP colgó el x86 34 min: los montajes `hard` esperan indefinidamente.
# soft/timeo/retrans: un corte devuelve EIO tras agotar los reintentos (minutos), no cuelga.
# nfsvers=4.2 es lo que negocia hoy el servidor (vers=4.2 en /proc/mounts del x86).
nfs:
  path: /srv/nfs/k8s-cold
  server: 100.109.183.9
  mountOptions:
    - soft
    - nfsvers=4.2
    - timeo=100
    - retrans=3
nodeSelector:
  node-pool: ks5-nvme
replicaCount: 1
resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi
storageClass:
  archiveOnDelete: true
  defaultClass: false
  name: nfs-cold
  provisionerName: cluster.local/nfs-cold
