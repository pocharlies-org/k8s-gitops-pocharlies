# Captura de `helm get values external-secrets -n external-secrets-operator` del 15-08-2026 (chart external-secrets-2.5.0).
# Verificado ese dia contra el cluster VIVO con `kubectl diff --server-side`:
# exit 0, cero diferencias. Es decir, esto describe lo que de verdad corre.
#
# Regla aprendida adoptando nfs-warm: si el objeto vivo y `helm get values` no
# coinciden, manda el OBJETO VIVO. Los valores de una release se quedan obsoletos
# en cuanto alguien parchea el objeto a mano.
#
# La release mas escueta del cluster: un solo valor. `installCRDs: true` significa
# que el chart es DUENO de los CRDs -- ExternalSecret, SecretStore, ClusterSecretStore.
# `prune: false` no es opinable: un prune borraria esos CRDs y con ellos TODOS los
# ExternalSecret del cluster, que es como decir todos los secretos.
installCRDs: true

# DGX-80/DGX-84: del 13-09 01:58Z al reset de cuota del 14-09 (~00:05Z) el
# controller estuvo a 0 temporal (commit ff862e2, PR #325) para no quemar la
# cuota diaria de 1Password Families. Restaurado a 1: nota del CTO en DGX-84
# (12:17Z) -- la recuperacion incluye "el PR del controller a 1" tras el reset.
# NO fusionar antes del reset de cuota o la cuota nueva se vuelve a agotar.
replicaCount: 1

# DGX-112: el suelo de llamadas era 966/dia contra la cuota Families de 1.000
# (DGX-84 com. 12523). 288/dia los consumia la revalidacion de cada store, que
# por defecto corre cada 5 min y cada pasada construye cliente -> VaultsAPI.List.
# A 1h: 24/dia (-264, ~26% de la cuota). Coste aceptado: un store roto tarda
# hasta 1h en reflejarse en su condicion Ready en vez de 5 min -- irrelevante
# con 2 stores.
extraArgs:
  store-requeue-interval: "1h"

# DGX-112: el controller ya contaba sus llamadas a proveedores
# (externalsecret_provider_api_calls_count) escuchando en :8080
# (--metrics-addr=:8080), pero sin Service delante nadie las recogia. Con esto
# el chart crea el Service external-secrets-metrics (puerto 8080 -> targetPort
# metrics). El scrape (VMServiceScrape) y la alerta (VMRule > 700 llamadas/24h)
# NO van aqui: en este cluster los scrapes de componentes de plataforma viven
# en k8s-observability-pocharlies/manifests (patron cert-manager-scrape.yaml)
# y viajan en su PR.
metrics:
  service:
    enabled: true
