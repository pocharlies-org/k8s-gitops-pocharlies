# Actions Runner Controller (GitHub Actions self-hosted runners) — GitOps.
# Adopta los releases helm imperativos previos (arc / arc-k8s, chart 0.14.1).
# Sync MANUAL a propósito en la primera adopción: hay runners CI corriendo y
# la sincronización automática se habilita SOLO tras verificar diff de adopción
# benigno. El secret arc-github-app lo materializa ESO desde Vault (no aquí).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.14.1
    helm:
      releaseName: arc
      values: |
        metrics:
          controllerManagerAddr: :8080
          listenerAddr: :8080
          listenerEndpoint: /metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-openclaw
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.1
    helm:
      releaseName: arc-openclaw
      values: |
        controllerServiceAccount:
          name: arc-gha-rs-controller
          namespace: arc-systems
        githubConfigSecret: arc-github-app
        githubConfigUrl: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
        # Dedicated OpenClaw pool. The shared arc-k8s pool is organization-wide
        # and can be saturated by unrelated repos; beta deploys need deterministic
        # access to the in-cluster BuildKit/Harbor network.
        # Two repo-scoped runners let a beta deploy progress when a PR
        # validation job is already running. Preferred pod anti-affinity below
        # spreads runners across healthy KS5 hosts without deadlocking the pool
        # when one control-plane node is unavailable.
        maxRunners: 2
        minRunners: 0
        runnerScaleSetName: arc-openclaw
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-pool
                          operator: In
                          values: [ks5-nvme]
                    - matchExpressions:
                        - key: role
                          operator: In
                          values: [edge]
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: node-pool
                          operator: In
                          values: [ks5-nvme]
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/component: runner
                          app.kubernetes.io/part-of: gha-runner-scale-set
                      topologyKey: kubernetes.io/hostname
            nodeSelector:
              kubernetes.io/arch: amd64
            tolerations:
              - effect: PreferNoSchedule
                key: pool
                operator: Equal
                value: dev
              - effect: NoSchedule
                key: role
                operator: Equal
                value: edge
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.335.1@sha256:08c30b0a7105f64bddfc485d2487a22aa03932a791402393352fdf674bda2c29
                imagePullPolicy: IfNotPresent
                command: ["/home/runner/run.sh"]
                resources:
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
                  limits:
                    cpu: "2"
                    memory: "4Gi"
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-k8s
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.1
    helm:
      releaseName: arc-k8s
      values: |
        controllerServiceAccount:
          name: arc-gha-rs-controller
          namespace: arc-systems
        githubConfigSecret: arc-github-app
        githubConfigUrl: https://github.com/pocharlies-org
        # 2026-09-22 dani · pool a 6 sobre los amd64 SANOS: ks5-cp-1/2/3 y x86.
        # sauvage queda fuera otra vez, y no por afinidad sino por no tolerar su
        # taint (role=edge) — es el unico nodo que lo lleva, asi que no hay que
        # fijar hostnames.
        #
        # Deroga el "scheduling libre" del 16-09, que asumia a proposito la
        # contencion de I/O de md3. Medido el 22-09 con la cola atascada (12 runs
        # encolados, 6/6 slots ocupados):
        #   - sauvage: iowait 31 % (media 24 h 7 %), md3 al 100 % de utilizacion;
        #     arrancar un pod y escribir 200 MB NO termino en 120 s.
        #   - ks5-cp-1: lo mismo en 0,34 s. Resto del cluster: iowait 0,1-3,4 %.
        # Un runner que cae ahi no falla, se arrastra: un job llevaba 2 h (1 h
        # solo en apt-get, 17 min en setup-go) secuestrando uno de los 6 slots.
        # Por eso el pool entero se atasca aunque el controlador este sano.
        #
        # Matiz sobre el motivo original: Harbor ya NO vive en sauvage (esta en
        # ks5-cp-2/3). Hoy a md3 lo castigan minio-0 + backup-minio-0 y los ~132
        # pods de skirmshop. Si algun dia md3 deja de estar saturado, esto se
        # revierte devolviendo la toleration de role=edge.
        #
        # 2026-09-24 dani · 6 -> 16, y sauvage vuelve como DESBORDE.
        # Con 6 la cola de la org llego a ~79 runs encolados (el mas viejo 1 h
        # 45 min) con las 6 plazas ocupadas y los nodos holgados (ks5 al 27-41 %
        # de CPU real, x86 al 28 %). Decision de Dani: muchos mas runners y que
        # el scheduler los reparta por el cluster si hace falta.
        # - sauvage se tolera otra vez (role=edge), pero con nodeAffinity
        #   PREFERIDA en contra: solo recibe runners cuando los otros ya van
        #   cargados. Lo de md3 del 22-09 sigue siendo verdad: un runner ahi va
        #   lento, pero con 16 plazas uno lento ya no atasca el pool.
        # - Riesgo aceptado: 3-4 runners por ks5 (control-plane + etcd, 8
        #   cores) pueden quemar CPU en builds simultaneos. Si el apiserver o
        #   etcd se resienten, bajar maxRunners aqui.
        maxRunners: 16
        minRunners: 0
        runnerScaleSetName: arc-k8s
        template:
          spec:
            affinity:
              # sauvage (role=edge) solo como desborde: ver maxRunners.
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: role
                          operator: NotIn
                          values: [edge]
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/component: runner
                          app.kubernetes.io/part-of: gha-runner-scale-set
                      topologyKey: kubernetes.io/hostname
            nodeSelector:
              kubernetes.io/arch: amd64
            tolerations:
              - effect: PreferNoSchedule
                key: pool
                operator: Equal
                value: dev
              - effect: NoSchedule
                key: role
                operator: Equal
                value: edge
            # gha-runner-scale-set 0.14.1 implements DinD as a restartable init
            # container. containerMode must stay unset when that sidecar is
            # customized, otherwise Helm silently discards its resources.
            initContainers:
              - name: init-dind-externals
                image: ghcr.io/actions/actions-runner:2.335.1@sha256:08c30b0a7105f64bddfc485d2487a22aa03932a791402393352fdf674bda2c29
                imagePullPolicy: IfNotPresent
                # Keep command and args explicit.  The pre-GitOps Helm manager
                # still owns the args field in the live ARS; a full command
                # plus those retained args executes cp twice and recursively
                # copies tmpDir into itself.
                command: ["cp"]
                args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                resources:
                  requests:
                    # Scheduling reservation only; the 100m limit preserves
                    # burst capacity while avoiding false KS5 CPU exhaustion.
                    cpu: "5m"
                    memory: "32Mi"
                  limits:
                    cpu: "100m"
                    memory: "128Mi"
                volumeMounts:
                  - name: dind-externals
                    mountPath: /home/runner/tmpDir
              - name: dind
                image: docker.io/library/docker:29.7.1-dind@sha256:e8faad5a8dc5279dff929afc5449f2791736912fff9f99351d742db2fad01b4c
                imagePullPolicy: IfNotPresent
                args:
                  - dockerd
                  - --host=unix:///var/run/docker.sock
                  - --group=$(DOCKER_GROUP_GID)
                  # dockerd defaults its bridge to 1500, but the pod network
                  # runs at 1230 (tailnet/WireGuard overhead). Build containers
                  # then emit frames the pod route cannot carry: the connection
                  # opens and the headers arrive, so small requests look fine,
                  # while any large transfer stalls until the step times out.
                  # It only shows on nodes whose egress does not rescue it with
                  # PMTU discovery, so it reads as a flaky runner rather than a
                  # config bug -- a 30 min hang on `apt-get update` on ks5 and a
                  # clean build on sauvage, same commit. Keep in step with the
                  # CNI: `kubectl exec -n arc-runners <runner> -c runner --
                  # cat /sys/class/net/eth0/mtu`.
                  - --mtu=1230
                env:
                  - name: DOCKER_GROUP_GID
                    value: "123"
                restartPolicy: Always
                resources:
                  requests:
                    # DinD is idle while a runner waits for a job. Reserve its
                    # steady-state footprint and retain the 2-core burst limit.
                    cpu: "50m"
                    memory: "512Mi"
                  limits:
                    cpu: "2"
                    memory: "4Gi"
                securityContext:
                  privileged: true
                startupProbe:
                  exec:
                    command: ["docker", "info"]
                  initialDelaySeconds: 0
                  failureThreshold: 24
                  periodSeconds: 5
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  - name: dind-externals
                    mountPath: /home/runner/externals
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.335.1@sha256:08c30b0a7105f64bddfc485d2487a22aa03932a791402393352fdf674bda2c29
                imagePullPolicy: IfNotPresent
                command: ["/home/runner/run.sh"]
                env:
                  - name: DOCKER_HOST
                    value: unix:///var/run/docker.sock
                  - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                    value: "120"
                resources:
                  requests:
                    # ARC runners are ephemeral and burst-bound. A small CPU
                    # request lets two anti-affine runners schedule on KS5;
                    # the unchanged 2-core limit protects build throughput.
                    cpu: "100m"
                    memory: "1Gi"
                  limits:
                    cpu: "2"
                    memory: "4Gi"
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
            volumes:
              - name: work
                emptyDir: {}
              - name: dind-sock
                emptyDir: {}
              - name: dind-externals
                emptyDir: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
