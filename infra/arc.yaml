# Actions Runner Controller (GitHub Actions self-hosted runners) — GitOps.
# Adopta los releases helm imperativos previos (arc / arc-k8s, chart 0.14.1).
# Sync MANUAL a propósito en la primera adopción: hay runners CI corriendo y
# la sincronización automática se habilita SOLO tras verificar diff de adopción
# benigno. El secret arc-github-app lo materializa ESO desde Vault (no aquí).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.14.1
    helm:
      releaseName: arc
      values: |
        metrics:
          controllerManagerAddr: :8080
          listenerAddr: :8080
          listenerEndpoint: /metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-openclaw
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.1
    helm:
      releaseName: arc-openclaw
      values: |
        controllerServiceAccount:
          name: arc-gha-rs-controller
          namespace: arc-systems
        githubConfigSecret: arc-github-app
        githubConfigUrl: https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
        # Dedicated OpenClaw pool. The shared arc-k8s pool is organization-wide
        # and can be saturated by unrelated repos; beta deploys need deterministic
        # access to the in-cluster BuildKit/Harbor network.
        # One repo-scoped runner is deliberate: OpenClaw validation and release
        # work must make progress without allowing CI to saturate a KS5 node.
        maxRunners: 1
        minRunners: 0
        runnerScaleSetName: arc-openclaw
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: runner
                        app.kubernetes.io/part-of: gha-runner-scale-set
                    topologyKey: kubernetes.io/hostname
            nodeSelector:
              kubernetes.io/arch: amd64
              node-pool: ks5-nvme
            tolerations:
              - effect: PreferNoSchedule
                key: pool
                operator: Equal
                value: dev
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.335.1
                command: ["/home/runner/run.sh"]
                resources:
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
                  limits:
                    cpu: "2"
                    memory: "4Gi"
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-k8s
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.1
    helm:
      releaseName: arc-k8s
      values: |
        controllerServiceAccount:
          name: arc-gha-rs-controller
          namespace: arc-systems
        githubConfigSecret: arc-github-app
        githubConfigUrl: https://github.com/pocharlies-org
        # Keep KS5 headroom for production maxSurge rollouts while allowing
        # OpenClaw infra pipelines to make progress when other repos occupy
        # the shared organization runner pool.
        maxRunners: 2
        minRunners: 0
        runnerScaleSetName: arc-k8s
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: runner
                        app.kubernetes.io/part-of: gha-runner-scale-set
                    topologyKey: kubernetes.io/hostname
            nodeSelector:
              kubernetes.io/arch: amd64
              # CI must remain available if the home-lab Ubuntu node is down.
              # This hard selector confines every new ephemeral runner to the
              # three OVH KS5 nodes; existing runners finish in place.
              node-pool: ks5-nvme
            tolerations:
              - effect: PreferNoSchedule
                key: pool
                operator: Equal
                value: dev
            # gha-runner-scale-set 0.14.1 implements DinD as a restartable init
            # container. containerMode must stay unset when that sidecar is
            # customized, otherwise Helm silently discards its resources.
            initContainers:
              - name: init-dind-externals
                image: ghcr.io/actions/actions-runner:2.335.1
                # Keep command and args explicit.  The pre-GitOps Helm manager
                # still owns the args field in the live ARS; a full command
                # plus those retained args executes cp twice and recursively
                # copies tmpDir into itself.
                command: ["cp"]
                args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                resources:
                  requests:
                    cpu: "10m"
                    memory: "32Mi"
                  limits:
                    cpu: "100m"
                    memory: "128Mi"
                volumeMounts:
                  - name: dind-externals
                    mountPath: /home/runner/tmpDir
              - name: dind
                image: docker:dind
                args:
                  - dockerd
                  - --host=unix:///var/run/docker.sock
                  - --group=$(DOCKER_GROUP_GID)
                env:
                  - name: DOCKER_GROUP_GID
                    value: "123"
                restartPolicy: Always
                resources:
                  requests:
                    cpu: "250m"
                    memory: "512Mi"
                  limits:
                    cpu: "2"
                    memory: "4Gi"
                securityContext:
                  privileged: true
                startupProbe:
                  exec:
                    command: ["docker", "info"]
                  initialDelaySeconds: 0
                  failureThreshold: 24
                  periodSeconds: 5
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  - name: dind-externals
                    mountPath: /home/runner/externals
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.335.1
                command: ["/home/runner/run.sh"]
                env:
                  - name: DOCKER_HOST
                    value: unix:///var/run/docker.sock
                  - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                    value: "120"
                resources:
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
                  limits:
                    cpu: "2"
                    memory: "4Gi"
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
            volumes:
              - name: work
                emptyDir: {}
              - name: dind-sock
                emptyDir: {}
              - name: dind-externals
                emptyDir: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
