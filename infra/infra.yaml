apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-infra
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-infra-pocharlies
  labels:
    e-dani.com/tier: infra
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-infra-pocharlies
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    # SC-4611: sin reintentos. Con el limit 5 por defecto ArgoCD repetía la MISMA revisión (refresh false):
    # un hook roto (57dc9d48) bloqueó 3 h el commit que lo arreglaba. Fallar una vez y aplicar el siguiente commit.
    retry:
      limit: 0
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
