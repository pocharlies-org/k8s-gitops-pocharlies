# Reproduccion del bug longhorn/longhorn#13723 (ver
# docs/runbook-longhorn-zombie-pods-k3s-restart.md en k8s-infra-pocharlies).
# Escritor periodico en /data para demostrar que el volumen sigue vivo mientras
# el mount del pod queda colgado tras un reinicio de k3s en ks5-cp-3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-zombie-test
  namespace: longhorn-zombie-test
  labels:
    app: longhorn-zombie-test
spec:
  replicas: 1
  # Recreate: PVC RWO; no queremos dos pods peleandose por el attach durante
  # el propio test.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: longhorn-zombie-test
  template:
    metadata:
      labels:
        app: longhorn-zombie-test
    spec:
      nodeSelector:
        kubernetes.io/hostname: ks5-cp-3
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: busybox:1.36
          command: ["/bin/sh"]
          args:
            - "-c"
            - "while true; do date -u >> /data/zombie.log; sleep 10; done"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zombie-data
