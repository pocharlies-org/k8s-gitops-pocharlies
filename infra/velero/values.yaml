# Velero — valores del release en vivo, capturados con `helm get values velero -n velero`
# el 15-08-2026 (chart velero-12.0.1, app 1.18.0, revision 9).
#
# Hasta ahora Velero se instalaba a mano con Helm y NO estaba en GitOps: cualquier
# cambio vivia solo en el cluster y se perdia en la siguiente reinstalacion. Este
# fichero es ahora la fuente de verdad; lo consume infra/velero.yaml.
#
# La Application arranca SIN `automated` a proposito: primero se comprueba que el
# diff contra lo desplegado sale vacio, y solo despues se activa el sync.
backupsEnabled: true
configuration:
  backupStorageLocation:
  # INFRA-1175: destino Object Storage de OVH (era la MinIO de sauvage). La credential
  # la materializa el ExternalSecret platform/velero/ovh-credentials.yaml de k8s-infra.
  - bucket: velero-backups-pocharlies
    config:
      region: sbg
      s3ForcePathStyle: true
      s3Url: https://s3.sbg.io.cloud.ovh.net
    credential:
      key: cloud
      name: velero-ovh-creds
    default: true
    name: default
    provider: aws
  clientBurst: 100
  clientQPS: 50
  defaultRepoMaintainFrequency: 24h0m0s
  features: EnableCSI
  garbageCollectionFrequency: 1h0m0s
  logLevel: info
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 1
        # SC-6235: retirado el loadAffinity a node-pool=ks5-nvme. Desde SC-6096 los
        # ks5-cp-* llevan taint control-plane:NoSchedule y la allowlist Kyverno solo
        # añade la toleración a pods que la declaran por nodeSelector; el job de
        # mantenimiento la declaraba por affinity y no la recibía → unschedulable
        # (correo Failed, openclaw-synapse Pending). El anclaje era obsoleto: el
        # repositorio kopia está en OVH S3 (INFRA-1175) y el job no monta volúmenes
        # locales (solo emptyDir). Sin afinidad, el job cae en un nodo worker sin
        # taint (atlantic), además de la dirección de SC-6096: quitar carga del plano
        # de control.
        podResources:
          cpuLimit: "1"
          cpuRequest: 100m
          memoryLimit: 2Gi
          memoryRequest: 512Mi
  volumeSnapshotLocation:
  - config:
      region: us-east-1
    name: default
    provider: aws
credentials:
  existingSecret: velero-ovh-creds
  useSecret: true
deployNodeAgent: true
initContainers:
- image: docker.io/velero/velero-plugin-for-aws:v1.14.2@sha256:0751144c1c8e52d52c48717fbd13ad5a3061e612ae4d7ad744a946cd5b139d1a
  name: velero-plugin-for-aws
  volumeMounts:
  - mountPath: /target
    name: plugins
nodeAgent:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology
            operator: In
            values:
            - lan
            - ovh
            - cloud  # SC-2659: nodo alphalink (droplet); sus pods llegan a MinIO por el overlay
  extraArgs:
  - --node-agent-configmap=velero-node-agent-config
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: llm
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: alpha
  # SC-6165: el node-agent debe seguir corriendo en ks5-cp-* tras el taint
  # node-role.kubernetes.io/control-plane:NoSchedule (guard de SC-6096).
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
nodeSelector:
  node-pool: ks5-nvme
resources:
  # INFRA-851: the server was OOMKilled (512Mi) while processing a Restore and
  # marked it Failed on restart. Restores need headroom to hold the item
  # collection; 2Gi limit, 512Mi request.
  limits:
    memory: 2Gi
  requests:
    # INFRA-171 (15-11): 100m -> 15m. Fila S1 (nota-devops-medicion-cp1.md de INFRA-170):
    # p95 8m; re-medido el 15-11 sobre la retención real de VictoriaMetrics (48 h, 553
    # puntos — las series de 14 días no existen): p95 9.7m -> suelo 1,5 x 9.7 = 14.55 ->
    # 15m. cp-1 estaba al 97 % de requests (épico INFRA-123). Solo el server: el
    # nodeAgent (DaemonSet) y los jobs de mantenimiento no se tocan.
    cpu: 15m
    memory: 512Mi
snapshotsEnabled: true
# SC-6165: allowlist del taint node-role.kubernetes.io/control-plane:NoSchedule
# (guard de SC-6096). El server vive en ks5-nvme = ks5-cp-1/2/3, que ahora estan
# tainted; sin esta toleracion el server no sobrevive a un reinicio y los jobs de
# mantenimiento de los repositorios kopia quedan Pending (heredan las toleraciones
# del Deployment, doc velero 1.18 repository-maintenance). Las dos de `dedicated`
# ya estaban vivas en el Deployment sin estar declaradas; se declaran aqui para
# que el diff GitOps salga vacio.
tolerations:
- effect: NoSchedule
  key: dedicated
  operator: Equal
  value: llm
- effect: NoSchedule
  key: dedicated
  operator: Equal
  value: alpha
- effect: NoSchedule
  key: node-role.kubernetes.io/control-plane
  operator: Exists
