# longhorn -- entra en GitOps el 15-08-2026. Hasta hoy era un `helm install` a mano y
# sus valores solo existian dentro del cluster.
#
# RIESGO ALTO: es la capa de almacenamiento y la StorageClass por defecto. prune:
# false sin discusion. reclaimPolicy Retain protege los volumenes.
#
# Multi-source: source 1 = chart upstream pinado a lo desplegado; source 2 = ESTE
# repo como $values.
#
# Diff de adopcion comprobado ANTES de activar el sync: `kubectl diff
# --server-side` del chart renderizado (con --include-crds y descontando hooks)
# contra el cluster vivo, exit 0 y cero lineas.
#
# OJO: adoptar NO borra el registro de Helm. `helm list -n longhorn-system` seguira
# reportando la release, pero manda ArgoCD y un `helm upgrade` lo revierte
# selfHeal en segundos. Cruza `helm list -A` con `kubectl -n argocd get application`.
#
# Un `ignoreDifferences` para esta app va al `kustomization.yaml` RAIZ con ruta
# `/spec/ignoreDifferences/-`: el patch general reemplaza la lista de este fichero.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/longhorn/longhorn
  labels:
    e-dani.com/tier: infra
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.11.2
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/infra/longhorn/values.yaml
    - repoURL: https://github.com/pocharlies-org/k8s-gitops-pocharlies
      targetRevision: deploy/prod
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  # Diff de adopcion a CERO verificado el 15-08-2026 antes de activar esto.
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
