# Descheduler: devuelve al x86 (`ubuntu`) lo que tuvo que saltar a otro nodo.
#
# 29-09-2026, tras un corte de luz en el x86: los servicios que prefieren
# `ubuntu` (por latencia a la LAN y a los Sparks) llevan ahora
# `preferredDuringScheduling` hacia `ubuntu` y pueden caer en `sauvage` si el
# x86 no esta. El scheduler NO los devuelve solo cuando el x86 vuelve: por eso
# existe esto. Cada 2 min evalua RemovePodsViolatingNodeAffinity en modo
# `preferred` y desaloja el pod que podria estar en un nodo con mejor
# preferencia.
#
# Opt-in por etiqueta: SOLO toca pods con `e-dani.com/vuelve-a-x86: "true"`.
# Desde INFRA-934 hay un segundo perfil, `cps-a-sauvage`, que sí reequilibra
# carga de trabajo desde los cps hacia sauvage (ver abajo).
#
# - nodeFit: true -> solo desaloja si el pod cabe en otro nodo (taints,
#   afinidad, requests). Con el x86 NotReady lleva el taint
#   node.kubernetes.io/unreachable:NoSchedule, asi que no desaloja nada
#   hasta que vuelve.
# - Respeta los PDB: con maxUnavailable 1 mueve una replica por pasada.
# - PodsWithLocalStorage desactivada: litellm usa emptyDir (tracking, token
#   de xAI) que es efimero por diseno.
kind: CronJob
schedule: "*/2 * * * *"
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 1

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

deschedulerPolicy:
  profiles:
    - name: vuelve-a-x86
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            podProtections:
              defaultDisabled:
                - PodsWithLocalStorage
        - name: RemovePodsViolatingNodeAffinity
          args:
            nodeAffinityType:
              - preferredDuringSchedulingIgnoredDuringExecution
            labelSelector:
              matchLabels:
                e-dani.com/vuelve-a-x86: "true"
      plugins:
        deschedule:
          enabled:
            - RemovePodsViolatingNodeAffinity

    # INFRA-934 (18-10): los cps llevan 106-113 pods de workload con requests
    # al 90-94 % de 8 CPU mientras sauvage tiene ~38 núcleos libres. Sin taints
    # (decisión de Dani): LowNodeUtilization expulsa de los cps (node-pool
    # ks5-nvme) hacia cualquier nodo por debajo del umbral hasta dejarlos bajo
    # el 60 % de requests — auto-limitante, deja de expulsar solo. nodeFit
    # impide mover lo que no cabe en otro sitio; el DefaultEvictor respeta PDB
    # y no toca pods con almacenamiento local. Máximo 5 pods por nodo y pasada
    # (cada 2 min): migración suave, sin reiniciar el namespace de golpe.
    - name: cps-a-sauvage
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            maxNoOfPodsToEvictPerNode: 5
        - name: LowNodeUtilization
          args:
            nodeSelector:
              matchLabels:
                node-pool: ks5-nvme
            thresholds:
              cpu: "60"
              memory: "60"
            thresholdPriority: Requests
            namespaces:
              exclude:
                - kube-system
                - longhorn-system
                - argocd
                - cert-manager
                - external-secrets-operator
                - metallb-system
                - keda
                - kyverno
                - velero
                - cnpg-system
                - databases
                - keycloak
                - harbor
                - arc-runners
                - arc-systems
                - onepassword-connect
                - minio
                - backup-hub
      plugins:
        deschedule:
          enabled:
            - LowNodeUtilization
