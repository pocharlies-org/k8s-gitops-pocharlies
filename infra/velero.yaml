# Velero — copias de seguridad de k8s. Entra en GitOps el 15-08-2026; hasta hoy
# era un `helm install` a mano y sus valores solo existian en el cluster.
#
# Multi-source:
#   source 1 = chart upstream vmware-tanzu/velero, pinado a la version desplegada.
#   source 2 = ESTE repo como `$values`, para el fichero de valores.
#
# Diff de adopcion comprobado el 15-08-2026 antes de activar el sync: de 23
# recursos, 10 salian OutOfSync y TODAS las diferencias eran campos que rellena
# el API server, no configuracion -- protocol: TCP, terminationMessagePath,
# imagePullPolicy, schedulerName, securityContext: {}, defaultMode: 420. Imagen,
# recursos, bucket y provider coincidian exactos. Con ServerSideApply ArgoCD solo
# gestiona los campos que declara, asi que adoptar no toca nada de eso.
#
# `prune: false` no es negociable aqui: Velero define CRDs y un prune equivocado
# se llevaria los Backup/Restore por delante.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/vmware-tanzu/helm-charts
  labels:
    e-dani.com/tier: infra
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.0.1
      helm:
        releaseName: velero
        valueFiles:
          - $values/infra/velero/values.yaml
    - repoURL: https://github.com/pocharlies-org/k8s-gitops-pocharlies
      targetRevision: deploy/prod
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
