# Velero — copias de seguridad de k8s. Entra en GitOps el 15-08-2026; hasta hoy
# era un `helm install` a mano y sus valores solo existian en el cluster.
#
# Multi-source:
#   source 1 = chart upstream vmware-tanzu/velero, pinado a la version desplegada.
#   source 2 = ESTE repo como `$values`, para el fichero de valores.
#
# Diff de adopcion comprobado el 15-08-2026 antes de activar el sync: de 23
# recursos, 10 salian OutOfSync y TODAS las diferencias eran campos que rellena
# el API server, no configuracion -- protocol: TCP, terminationMessagePath,
# imagePullPolicy, schedulerName, securityContext: {}, defaultMode: 420. Imagen,
# recursos, bucket y provider coincidian exactos. Con ServerSideApply ArgoCD solo
# gestiona los campos que declara, asi que adoptar no toca nada de eso.
#
# `prune: false` no es negociable aqui: Velero define CRDs y un prune equivocado
# se llevaria los Backup/Restore por delante.
#
# OJO AL ADOPTAR (vale para las 12 releases que quedan fuera de GitOps): adoptar
# NO borra el registro de Helm. Los secrets `sh.helm.release.v1.velero.*` siguen
# ahi y `helm list -n velero` sigue diciendo `velero  12.0.1  deployed  rev 9`,
# congelado en el 07-08-2026. A partir de ahora manda ArgoCD: un `helm upgrade`
# aqui lo revierte selfHeal en segundos y parece que "no hace nada" -- es lo que
# paso con la release `vm` el 15-08 (cinco upgrades tirados a la basura). No
# borres los secrets: son el unico historial de como se instalo. La comprobacion
# fiable antes de tocar CUALQUIER release es cruzar `helm list -A` con
# `kubectl -n argocd get application`; si sale en los dos, manda Argo.
#
# El `ignoreDifferences` de abajo esta aqui por documentacion pero NO llega vivo:
# el patch general del kustomization raiz reemplaza la lista entera de toda
# Application. La entrada que de verdad se aplica esta en `kustomization.yaml`,
# en el patch con `name: velero` y ruta `/spec/ignoreDifferences/-`. Mismo patron
# que `ai` y `agentgateway-mcp`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/vmware-tanzu/helm-charts
  labels:
    e-dani.com/tier: infra
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.0.1
      helm:
        releaseName: velero
        valueFiles:
          - $values/infra/velero/values.yaml
    - repoURL: https://github.com/pocharlies-org/k8s-gitops-pocharlies
      targetRevision: deploy/prod
      ref: values
  # El controlador de Velero BORRA `spec.default` del BSL en cuanto lo reconcilia
  # (en 1.18 el BSL por defecto no se marca ya con ese campo). El chart lo sigue
  # renderizando, asi que sin esto la Application se queda OutOfSync para siempre
  # por un campo que nunca va a existir en el objeto vivo. Comprobado: el BSL esta
  # `Available` y funciona; los otros 22 recursos sincronizan limpios.
  ignoreDifferences:
    - group: velero.io
      kind: BackupStorageLocation
      name: default
      jsonPointers:
        - /spec/default
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
