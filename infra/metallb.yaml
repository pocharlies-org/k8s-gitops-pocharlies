# metallb -- entra en GitOps el 15-08-2026. Hasta hoy era un `helm install` a mano y
# sus valores solo existian dentro del cluster.
#
# RIESGO: reparte las IPs de la LAN. El speaker esta clavado en el nodo `ubuntu`
# porque es el unico que puede anunciarlas por ARP. Los IPAddressPool NO estan en
# este chart, asi que un prune aqui no se los lleva.
#
# Multi-source: source 1 = chart upstream pinado a lo desplegado; source 2 = ESTE
# repo como $values.
#
# Diff de adopcion comprobado ANTES de activar el sync: `kubectl diff
# --server-side` del chart renderizado (con --include-crds y descontando hooks)
# contra el cluster vivo, exit 0 y cero lineas.
#
# OJO: adoptar NO borra el registro de Helm. `helm list -n metallb-system` seguira
# reportando la release, pero manda ArgoCD y un `helm upgrade` lo revierte
# selfHeal en segundos. Cruza `helm list -A` con `kubectl -n argocd get application`.
#
# Un `ignoreDifferences` para esta app va al `kustomization.yaml` RAIZ con ruta
# `/spec/ignoreDifferences/-`: el patch general reemplaza la lista de este fichero.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/metallb/metallb
  labels:
    e-dani.com/tier: infra
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.15.3
      helm:
        releaseName: metallb
        valueFiles:
          - $values/infra/metallb/values.yaml
    - repoURL: https://github.com/pocharlies-org/k8s-gitops-pocharlies
      targetRevision: deploy/prod
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  # Sin `automated` a proposito: se activa en un commit aparte.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
