apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.20.0
    helm:
      releaseName: keda
      values: |
        crds:
          install: true
        operator:
          replicaCount: 1
        # INFRA-628 P2-b: p95 0,7m / max 1,1m (7 d); el default del chart es 100m. Solo cambia requests.cpu (limits y memory se heredan).
        resources:
          webhooks:
            requests:
              cpu: 10m
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
