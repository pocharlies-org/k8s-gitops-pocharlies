# ci-queue-exporter — Deployment del exporter de cola CI (INFRA-550).
# Lo despliega la Application infra/ci-queue-exporter.yaml (path: ci-queue).
# Nada en el x86: 1 réplica en k8s, imagen python por digest, código por
# configMap. Sin PAT: el token de instalación lo genera external-secrets con
# su generator GithubAccessToken sobre la App `arc-github-app` existente
# (item de 1Password `arc-github-app`, la misma que consume ARC).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
labels:
  - pairs:
      app.kubernetes.io/name: ci-queue-exporter
      app.kubernetes.io/part-of: ci-queue
    includeSelectors: false
resources:
  - exporter-deployment.yaml
  - github-token.yaml
configMapGenerator:
  - name: ci-queue-exporter-code
    files:
      - exporter.py
      - ci_queue.py
      - pools.txt
