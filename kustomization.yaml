apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - legacy/cnpg-operator.yaml
  - legacy/postgres-shared.yaml
  - infra/infra.yaml
  - infra/keda.yaml
  - infra/observability.yaml
  - infra/backup-hub.yaml
  - infra/backup-logical-dumps.yaml
  - infra/traefik-lan.yaml
  - infra/traefik-edge.yaml
  - infra/arc.yaml
  - infra/velero.yaml
  - infra/external-dns.yaml
  - infra/vault.yaml
  - infra/nfs-cold.yaml
  - infra/nfs-warm.yaml
  - infra/gpu-operator.yaml
  - infra/cert-manager.yaml
  - infra/external-secrets.yaml
  - infra/metallb.yaml
  - infra/kyverno.yaml
  - infra/reflector.yaml
  - infra/longhorn.yaml
  - infra/argocd.yaml
  - infra/harbor.yaml
  - apps/adguard.yaml
  - apps/ai.yaml
  - apps/firecrawl.yaml
  - apps/jarvis.yaml
  - apps/libreplay.yaml
  - apps/libreplay-staging.yaml
  - apps/litellm.yaml
  - apps/langfuse.yaml
  - apps/openclaw-qwen36.yaml
  - apps/openclaw-synapse.yaml
  - apps/offers-mcp.yaml
  - apps/shopify-bundles.yaml
  - apps/shopify-chatbot.yaml
  - apps/shopify-collections-tree.yaml
  - apps/shopify-label.yaml
  - apps/shopify-picker.yaml
  - apps/shopify-sii.yaml
  - apps/shopify-serial-numbers.yaml
  - apps/shopify-translations.yaml
  - apps/shopify-affiliate.yaml
  - apps/skirmshop-control-panel.yaml
  - apps/skirmshop-drive-mirror.yaml
  - apps/skirmshopshopifyapp.yaml
  - apps-disabled/shopify-back-in-stock.yaml
  - apps-disabled/shopify-sync.yaml
  - apps/skirmbooks.yaml
  - apps/synapse.yaml
  - apps/socialmedia.yaml
  - apps/synapse-migrations.yaml
  - apps/synapse-sre-foundation.yaml
  - apps/teslamate.yaml
  - apps/tomorrowland.yaml
  - apps/cv.yaml
  - apps/stt-mcp.yaml
  - apps/teslamate-mcp.yaml
  - apps/dgx-synapse-mcp.yaml
  - apps/serpientetool.yaml
  - apps/agentgateway-mcp.yaml
  - argocd/ingressroute.yaml
  - argocd/project-openclaw-controlled.yaml
  - argocd/openclaw-synapse-namespace.yaml
  - argocd/project-openclaw-synapse.yaml
  - argocd/openclaw-release-verifier-rbac.yaml
  - argocd/openclaw-operation-admission-gate.yaml
  - argocd/repositories.yaml
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
    patch: |-
      - op: add
        path: /spec/ignoreDifferences
        value:
          - group: external-secrets.io
            kind: ExternalSecret
            jqPathExpressions:
              - .spec.data[]?.remoteRef.conversionStrategy
              - .spec.data[]?.remoteRef.decodingStrategy
              - .spec.data[]?.remoteRef.metadataPolicy
              - .spec.data[]?.remoteRef.nullBytePolicy
              - .spec.dataFrom[]?.extract.conversionStrategy
              - .spec.dataFrom[]?.extract.decodingStrategy
              - .spec.dataFrom[]?.extract.metadataPolicy
              - .spec.dataFrom[]?.extract.nullBytePolicy
          - group: postgresql.cnpg.io
            kind: Cluster
            managedFieldsManagers:
              - manager
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: postgres-shared
    patch: |-
      # 2026-07-31: retirada la entrada que ignoraba el /spec ENTERO de
      # Cluster/postgres-shared. Con ella ArgoCD reportaba Synced dijera lo que
      # dijera el objeto vivo y selfHeal no restauraba nada: el `workload: core`
      # que este repo declara desde b651d86 nunca llegó al cluster y el primario
      # volvió solo al nodo de desarrollo `ubuntu`.
      #
      # 2026-08-11: CNPG deja parte de sus defaults sin un manager atribuible y
      # `managedFieldsManagers: [manager]` ya no basta. Esta Application usa
      # ServerSideDiff para que el API aplique los defaults durante el dry-run;
      # así se eliminan falsos positivos sin volver a ocultar el spec completo.
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: StatefulSet
          name: shared-rabbitmq
          namespace: databases
          jsonPointers:
            - /spec/revisionHistoryLimit
            - /spec/updateStrategy
            - /spec/volumeClaimTemplates
            - /spec/template/metadata/creationTimestamp
          managedFieldsManagers:
            - kube-controller-manager
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: ai
    patch: |-
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: qwen3-embedding-4b-nvfp4-dgx2
          namespace: llm
          jsonPointers:
            - /spec/replicas
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: qwen3-reranker-4b-nvfp4-dgx2
          namespace: llm
          jsonPointers:
            - /spec/replicas
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: vllm-35b-nvfp4-dgx2
          namespace: llm
          jsonPointers:
            - /spec/replicas
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: vllm-qwen36-27b-nvfp4-dgx2
          namespace: llm
          jsonPointers:
            - /spec/replicas
      # GOTCHA (incidente 2026-07-12): TODO deploy resident nuevo/renombrado con
      # replicas>0 en git DEBE entrar aquí, o el selfHeal re-aplica replicas en <10s
      # tras la eviction del gpu_arbiter y ComfyUI/Trellis quedan Pending hasta el
      # ready-timeout (vídeo/3D rotos en silencio). Los canaries v024 del 27b y el
      # uncensored se añaden de una vez aunque hoy pinneen 0: pelearían igual al
      # abrirse su gate.
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: vllm-qwen36-27b-nvfp4-v024-f1-dgx2
          namespace: llm
          jsonPointers:
            - /spec/replicas
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: vllm-qwen36-27b-nvfp4-v024-f2-dgx2
          namespace: llm
          jsonPointers:
            - /spec/replicas
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: vllm-qwen36-27b-uncensored-dgx2
          namespace: llm
          jsonPointers:
            - /spec/replicas
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: vllm-vision-deep-dgx2
          namespace: llm
          jsonPointers:
            - /spec/replicas
      # Global compute-mode controller owns ONLY replica counts for this closed
      # profile set. Images, commands, resources and model identities stay GitOps-owned.
      - op: add
        path: /spec/ignoreDifferences/-
        value: &compute-replicas
          group: apps
          kind: Deployment
          name: deepseek-v4-flash-0731-head
          namespace: llm
          jsonPointers: [/spec/replicas]
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: deepseek-v4-flash-0731-worker }
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: bge-m3-embedding }
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: bge-reranker }
      # 13-08 F1 (nombres por variante): las nuevas identidades de los mismos
      # residentes. Las viejas se retiran del cluster en el contract de F1.4 y
      # de esta lista en el cleanup posterior.
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: omnivoice-tts-fp16 }
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: omnivoice-tts-nvfp4 }
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: vllm-vision-deep }
      # 14-08 F2/F3: twins de rol creative y el 27B fusionado.
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: bge-m3-embedding-creative }
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: bge-reranker-creative }
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: vllm-qwen36-27b-uncensored }
      # 15-08: el 27B se renombra a `vllm-qwen38-27b-uncensored` (el checkpoint es
      # un Qwen3.8, no un 3.6). La entrada nueva va ANTES del rename y es inofensiva
      # mientras el objeto no exista: ignoreDifferences sobre un Deployment ausente
      # es un no-op. Si se renombra sin esto, el Deployment nuevo nace con las
      # replicas de git —que son 0— Argo las gestiona porque el nombre nuevo no
      # esta en la lista, y el residente se queda ABAJO; un `kubectl scale` a 1
      # lo revierte selfHeal acto seguido. Las dos conviven hasta que el objeto
      # viejo desaparezca.
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: vllm-qwen38-27b-uncensored }
      # CPU/Sauvage fallbacks are raised transactionally while ComfyUI borrows
      # the RTX in LLM TP. The root kustomization replaces each Application's
      # ignoreDifferences list, so these entries must live here as well as in
      # apps/ai.yaml or ArgoCD self-heal immediately scales them back to zero.
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: bge-m3-embedding-cpu }
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: bge-reranker-cpu }
      - op: add
        path: /spec/ignoreDifferences/-
        value: { <<: *compute-replicas, name: omnivoice-tts-cpu }
      # Co-residente de DGX2 para agentes (qwen3-coder / coder en LiteLLM). Se
      # declara a replicas 0 en git y se levanta A MANO cuando se va a usar, igual
      # que el resto de residentes de DGX2. Sin este ignore, selfHeal lo devolveria
      # a 0 a los pocos minutos de levantarlo.
      # OJO: los deployments de DGX1 NO llevan este ignore a proposito -- alli las
      # replicas SON el interruptor del residente de tooling y las manda git.
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: vllm-qwen3coder-30b-a3b-nvfp4-dgx2
          namespace: llm
          jsonPointers:
            - /spec/replicas
      # gpu_arbiter pauses these BGE-dgx2 ScaledObjects (autoscaling.keda.sh/paused-replicas=0)
      # to evict the preemptible embedder/reranker off the GB10 while ComfyUI/Trellis run,
      # and removes the annotation on release. selfHeal must NOT revert it mid-job.
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: keda.sh
          kind: ScaledObject
          name: keda-bge-embedding-gpu-dgx2
          namespace: llm
          jsonPointers:
            - /metadata/annotations/autoscaling.keda.sh~1paused-replicas
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: keda.sh
          kind: ScaledObject
          name: keda-bge-reranker-gpu-dgx2
          namespace: llm
          jsonPointers:
            - /metadata/annotations/autoscaling.keda.sh~1paused-replicas
  # The blanket Application patch above REPLACES /spec/ignoreDifferences, so it drops the two
  # target.template paths agentgateway-mcp declares in its own file. ESO defaults both on the
  # backend-tokens ExternalSecret, so without them the app is perpetually OutOfSync. Append
  # them back onto the ExternalSecret entry (index 0) the blanket patch just wrote.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: agentgateway-mcp
    patch: |-
      - op: add
        path: /spec/ignoreDifferences/0/jqPathExpressions/-
        value: .spec.target.template.engineVersion
      - op: add
        path: /spec/ignoreDifferences/0/jqPathExpressions/-
        value: .spec.target.template.mergePolicy
  # Misma trampa: el patch general de arriba REEMPLAZA la lista, asi que el
  # ignoreDifferences que declara infra/velero.yaml nunca llega vivo. El
  # controlador de Velero 1.18 borra `spec.default` del BSL en cuanto lo
  # reconcilia (comprobado 15-08-2026: el objeto vivo esta `Available` y su spec
  # solo tiene accessMode/config/credential/objectStorage/provider), pero el
  # chart lo sigue renderizando. Sin esta entrada la Application se queda
  # OutOfSync para siempre por un campo que no va a existir nunca.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: velero
    patch: |-
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: velero.io
          kind: BackupStorageLocation
          name: default
          namespace: velero
          jsonPointers:
            - /spec/default
  # El chart de vault renderiza `caBundle: ""` en el webhook del agent-injector:
  # el certificado NO lo pone el chart, lo genera y lo parchea el propio injector
  # al arrancar. Sin este ignore, ArgoCD aplicaria la cadena vacia y el webhook se
  # quedaria sin CA de confianza -- toda admision de pods con anotaciones de
  # inyeccion de vault empezaria a fallar. Comprobado 15-08-2026: el render trae
  # `caBundle: ""` y el objeto vivo tiene dos certificados reales.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: vault
    patch: |-
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          name: vault-agent-injector-cfg
          jsonPointers:
            - /webhooks/0/clientConfig/caBundle
  # La password de Postgres de Harbor no se puede externalizar: el chart solo
  # ofrece `database.external.existingSecret` y esta BD es INTERNA.
  #
  # MEDIDO EL 15-08-2026: hoy esa password es literalmente el default del chart,
  # `changeit` (8 bytes, sha256 00810cf8b94d, identico en el render y en el
  # cluster). O sea que ahora mismo el render coincide y este ignore no cambia
  # nada. Se deja puesto como red: el dia que alguien rote la password de la BD
  # --que deberia hacerse-- ArgoCD la revertiria a `changeit` en el siguiente
  # sync. Con esto y `RespectIgnoreDifferences=true` el campo ni se envia.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: harbor
    patch: |-
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          kind: Secret
          name: harbor-core
          namespace: harbor
          jsonPointers:
            - /data/POSTGRESQL_PASSWORD
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          kind: Secret
          name: harbor-database
          namespace: harbor
          jsonPointers:
            - /data/POSTGRES_PASSWORD
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: libreplay
    patch: |-
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: libreplay-web
          namespace: libreplay
          jsonPointers:
            - /spec/replicas
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: libreplay-worker
          namespace: libreplay
          jsonPointers:
            - /spec/replicas
      - op: add
        path: /spec/syncPolicy/syncOptions/-
        value: RespectIgnoreDifferences=true
  # Synapse: los tres adapters multimodales consumen SOLO en la ventana
  # nocturna del lote creative (03:30-07:30 Europe/Madrid). Sus ScaledObjects
  # de KEDA viven en k8s-synapse-pocharlies (k8s/keda/, commit d44dcd4) y
  # pasan a poseer /spec/replicas; en git siguen declarados a 0, que es su
  # estado FUERA de ventana. Sin estas entradas, un sync completo a mitad de
  # madrugada los apaga en silencio y el trabajo de vision se queda otro dia
  # en la cola. Mismo motivo que el bloque de `ai`, distinto dueño: alli el
  # gpu_arbiter, aqui KEDA.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: synapse
    patch: |-
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: synapse-adapter-expenses
          namespace: synapse
          jsonPointers:
            - /spec/replicas
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: synapse-adapter-messaging-media
          namespace: synapse
          jsonPointers:
            - /spec/replicas
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: synapse-adapter-messaging-contact-sync
          namespace: synapse
          jsonPointers:
            - /spec/replicas
