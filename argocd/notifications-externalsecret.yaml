---
# 29-09-2026: el Secret de ArgoCD Notifications (argocd/values.yaml, notifications.secret.create: false).
# hermes-webhook-token = secreto de las rutas webhook de Hermes (1Password hermes-compania/webhook_secret,
# el mismo que lee el chart de Hermes); va en la cabecera X-Gitlab-Token hacia /p/sre-devops/webhooks/argocd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: hermes-webhook-token
      remoteRef:
        key: hermes-compania/webhook_secret
