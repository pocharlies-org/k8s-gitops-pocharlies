---
# 29-09-2026: el Secret de ArgoCD Notifications (argocd/values.yaml, notifications.secret.create: false).
# keep-api-key = la key de ingesta (rol webhook) de Keep que ya usa Alertmanager (1Password keep/API_KEY_ALERTMANAGER);
# va en la cabecera X-API-KEY hacia keep-backend /alerts/event.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: keep-api-key
      remoteRef:
        key: keep/API_KEY_ALERTMANAGER
