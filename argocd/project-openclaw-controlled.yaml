apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: openclaw-controlled
  namespace: argocd
spec:
  description: OpenClaw deploys gated by safe-deploy hooks and a night maintenance window.
  sourceRepos:
    - https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
  destinations:
    - server: https://kubernetes.default.svc
      namespace: openclaw-qwen36
    - server: https://kubernetes.default.svc
      namespace: node-debug
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  syncWindows:
    - kind: deny
      schedule: "0 5 * * *"
      duration: 22h
      applications:
        - openclaw-qwen36
      manualSync: false
      timeZone: Europe/Madrid
      description: "Temporary incident freeze: deny automated and manual OpenClaw syncs outside 03:00-05:00 Europe/Madrid until the shared-state writer lease is deployed."
