---
# SC-1359: credencial de ArgoCD para el org pocharlies-org via GitHub App de solo lectura
# "pocharlies-dashboard-ro" (1Password k8s-pocharlies/dashboard-github-app), gestionada por
# GitOps para quitar el PAT personal (ghp_...) que estaba en claro en la anotacion
# last-applied de pocharlies-org-creds (creado a mano con kubectl apply, fuera de GitOps).
#
# Schema verificado contra argo-cd v3.4.2 (pkg/apis/application/v1alpha1
# repository_types.go): un Secret con label secret-type=repo-creds usa las claves PLANAS
# githubAppID / githubAppInstallationID / githubAppPrivateKey (el JSON githubAppCredential
# es solo del CRD Repository, no de repo-creds). El campo url hace match por PREFIJO:
# https://github.com/pocharlies-org cubre las 65 Applications del org.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds-dashboard-ro
  namespace: argocd
spec:
  refreshInterval: 6h  # SC-1640: cuota diaria 1Password
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: argocd-repo-creds-dashboard-ro
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://github.com/pocharlies-org
        githubAppID: "{{ .app_id }}"
        githubAppInstallationID: "{{ .installation_id }}"
        githubAppPrivateKey: "{{ .private_key }}"
  data:
    - secretKey: app_id
      remoteRef:
        key: dashboard-github-app/app_id
    - secretKey: installation_id
      remoteRef:
        key: dashboard-github-app/installation_id
    - secretKey: private_key
      remoteRef:
        key: dashboard-github-app/private_key
