# SC-2958·D7: token del notificador `service.webhook.synapse` ← bóveda k8s-pocharlies,
# item synapse-webhook-argocd, campo token (= argocd.webhook.token del gateway).
# Forma Connect (key = ítem, property = campo), refreshPolicy OnChange. Escribe en el
# Secret de ArgoCD Notifications con Merge: no toca la clave de Keep.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-synapse
  namespace: argocd
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: argocd-notifications-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: synapse-argocd-token
      remoteRef:
        key: synapse-webhook-argocd
        property: token
