---
# ArgoCD IngressRoute — auth handled by Keycloak SSO where enabled
# ArgoCD itself has its own login page; no ForwardAuth needed here
# (native ArgoCD SSO via Keycloak OIDC is a future enhancement)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd.lan.e-dani.com`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: wildcard-lan-tls
---
# ArgoCD LAN alias on *.e-dani.com, served by internal Traefik.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-lan
  namespace: traefik-lan
  annotations:
    external-dns.alpha.kubernetes.io/hostname: argocd-lan.e-dani.com
    external-dns.alpha.kubernetes.io/target: "192.168.50.240"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd-lan.e-dani.com`)
      kind: Rule
      services:
        - name: argocd-server
          namespace: argocd
          port: 80
  tls:
    secretName: wildcard-edani-tls
