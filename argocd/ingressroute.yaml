---
# ArgoCD IngressRoute — auth handled by Authelia ForwardAuth
# ArgoCD itself has its own login page; no ForwardAuth needed here
# (ArgoCD SSO via Authelia OIDC is a future enhancement)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd.lan.e-dani.com`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: wildcard-lan-tls
