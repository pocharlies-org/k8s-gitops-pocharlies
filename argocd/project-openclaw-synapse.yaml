apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: openclaw-synapse
  namespace: argocd
spec:
  description: Synapse-only OpenClaw runner with isolated namespace and no cluster-scoped authority.
  sourceRepos:
    - https://github.com/pocharlies-org/k8s-openclaw-qwen36-pocharlies
  destinations:
    - server: https://kubernetes.default.svc
      namespace: openclaw-synapse
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  syncWindows:
    - kind: deny
      schedule: "0 5 * * *"
      duration: 22h
      applications:
        - openclaw-synapse
      manualSync: true
      timeZone: Europe/Madrid
      description: "Deny automated OpenClaw Synapse syncs outside 03:00-05:00 Europe/Madrid; manual urgent syncs are allowed."
