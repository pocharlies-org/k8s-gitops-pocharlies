---
# DGX-916: repositorio OCI de Harbor para ArgoCD, con credencial de SOLO lectura.
# Lo consume la Application `correo` (DGX-870 P9), que baja el chart `correo` de
# harbor.lan.e-dani.com/homelab/charts. El proyecto `homelab` responde 401 sin login.
#
#   1Password (vault k8s-pocharlies) item `infra-harbor-argocd-chart-pull`, campos username y password
#     --ESO (ClusterSecretStore onepassword-connect)-->
#   Secret `repo-helm-harbor-homelab-charts` (ns argocd, label secret-type=repository)
#
# Va como ExternalSecret y no dentro de repositories.yaml porque ese fichero lo genera
# gen_repositories.py solo con repos sin credencial. Lleva el nombre `repo-helm-*` de los demas.
#
# El robot de Harbor es de pull sobre el proyecto `homelab` (Harbor no acota por debajo del
# proyecto). El robot de CI `infra-harbor-ci-robot` no vale: puede empujar.
# Campos del Secret de repositorio de ArgoCD: type, name, url (sin `oci://`), enableOCI, username, password.
# Si el item rota, force-sync de este ExternalSecret (refreshPolicy OnChange).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-helm-harbor-homelab-charts
  namespace: argocd
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: repo-helm-harbor-homelab-charts
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: helm
        name: harbor-homelab-charts
        url: harbor.lan.e-dani.com/homelab/charts
        enableOCI: "true"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: infra-harbor-argocd-chart-pull
        property: username
    - secretKey: password
      remoteRef:
        key: infra-harbor-argocd-chart-pull
        property: password
