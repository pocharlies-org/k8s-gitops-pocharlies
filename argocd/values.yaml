# ArgoCD — single-replica homelab install
global:
  domain: argocd.e-dani.com
  # Pin the control plane to the ks5-nvme pool (ks5-cp-1/2/3): untainted, NVMe-backed.
  # A single-hostname pin is unsafe here — the chart merges global.nodeSelector with the
  # live objects' existing keys, so hostname + node-pool intersect to zero nodes.
  nodeSelector:
    node-pool: ks5-nvme

dex:
  enabled: false   # SSO via Authelia ForwardAuth

configs:
  params:
    server.insecure: "true"   # TLS termination at Traefik
  cm:
    application.instanceLabelKey: argocd.argoproj.io/instance
    # SC-2822: los kustomize del repo pueden traer helmCharts (platform/keycloak-sso).
    # Sin esto ArgoCD falla con "must specify --enable-helm".
    kustomize.buildOptions: --enable-helm
    # INFRA-511: Kyverno (externalsecret-onepassword-to-connect, in
    # k8s-infra-pocharlies platform/kyverno/policies.yaml) admits every
    # ExternalSecret of the `onepassword` store (key: <item>/<field>) as one of
    # `onepassword-connect` (key: <item>, property: <field>). Without this,
    # every app with such an ExternalSecret would be OutOfSync forever and
    # self-heal would re-apply it in a loop. Only the two 1Password stores:
    # an ExternalSecret of any other store keeps its full diff. ArgoCD runs
    # each expression as del(...) in order, so the store name goes last (the
    # other two select on it). Remove once no repo declares the old form.
    resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
      jqPathExpressions:
        - '.spec | select(.secretStoreRef.name == "onepassword" or .secretStoreRef.name == "onepassword-connect") | .data[]?.remoteRef.key'
        - '.spec | select(.secretStoreRef.name == "onepassword" or .secretStoreRef.name == "onepassword-connect") | .data[]?.remoteRef.property'
        - '.spec.secretStoreRef | select(.name == "onepassword" or .name == "onepassword-connect") | .name'
    # DGX-626: ArgoCD v3 trae health built-in para batch/CronJob (Degraded si
    # lastSuccessfulTime < lastScheduleTime) y ese estado hace fallar la operacion de
    # sync de la app en cualquier ola (INFRA-477 company-dreaming; DGX-626
    # keycloak-role-drift, detector que falla a proposito). La visibilidad de un
    # CronJob que falla es la regla K8sCronJobFailed (topic Crons), no el health de ArgoCD.
    # La clave va como group_Kind (batch_CronJob): la `/` no es valida en una clave de ConfigMap.
    # SC-2082: el script TIENE que acabar en `return health`. Sin el, devuelve nil, ArgoCD lo
    # lee como un health vacio (ni Healthy ni Degraded) y toda operacion de sync multi-paso
    # (la que lleva un hook PostSync) se queda en Running para siempre en
    # "waiting for healthy state of batch/CronJob/..." (litellm y k8s-infra, 12 h).
    resource.customizations.health.batch_CronJob: |
      health = {
        status = 'Healthy',
        message = 'CronJob: no gatea el sync; visibilidad via K8sCronJobFailed (topic Crons)'
      }
      return health
    timeout.reconciliation: 60s
    statusbadge.enabled: "true"

server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false   # we use Traefik IngressRoute below

repoServer:
  replicas: 1
  # INFRA-927 (23-10-2026): la liveness `healthz?full=true` con timeout 1s y
  # failureThreshold 3 mataba el pod en ráfagas de GenerateManifest sobre un
  # cp saturado (ks5-cp-2 al 122% de CPU): 78 reinicios en 7 días, exit 0
  # «clean shutdown» tras el kill del kubelet, y con él caían las manifest
  # generations de TODAS las Applications (ComparisonError). El proceso estaba
  # sano (logs normales, cache hits). Uso real medido 7 d en VictoriaMetrics:
  # p95 ~0.09 cores, máximo ~200 Mi — no es capacidad, es tolerancia de la
  # probe y falta de requests. Por eso: timeout 8s / failureThreshold 6 en
  # liveness (~60 s de tolerancia) y 5s / 6 en readiness; requests para que
  # el scheduler vea su peso (misma lección que el controller, 2026-08-15) y
  # límite de memoria, que además pide Kyverno (require-memory-limit).
  # Sin réplicas extra ni --parallelismlimit: la capacidad no es la causa.
  livenessProbe:
    timeoutSeconds: 8
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi

applicationSet:
  replicas: 1

redis:
  enabled: true
  # Pinned to Harbor mirror (Kyverno restrict-image-registries):
  # mirrored from ecr-public.aws.com/docker/library/redis:8.2.3-alpine
  image:
    repository: harbor.lan.e-dani.com/homelab/redis
    tag: 8.2.3-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

controller:
  replicas: 1
  metrics:
    enabled: true
  resources:
    requests:
      # 2026-08-15: 100m -> 400m. Pedia 100m con un p95 de 825m y picos de
      # 287m en reposo: el scheduler no veia su peso en nodos al 92-98% de
      # requests. Sin cpu limit, como estaba.
      # 2026-09-13 (INFRA-42): 400m -> 800m. p95 14d 843m (medicion sre,
      # comentario 12299 en INFRA-42): seguia infra-dotado. Subida EN SITIO
      # en ks5-cp-3: moverlo desplazaría 843m de uso real a un cp-1 que ya
      # pinó 5934m reales.
      cpu: 800m
      memory: 256Mi
    limits:
      memory: 2Gi

# 29-09-2026 (Dani): ArgoCD entra a Keep, como Alertmanager — no directo al agente. La cadena es
# ArgoCD/Alertmanager -> Keep -> Aurora (RCA) -> perfil sre-devops de Hermes. Keep las correla
# (regla argocd-app-degraded, k8s-observability-pocharlies) y el RCA llega al agente desde Keep.
# Evento genérico nativo de Keep (POST /alerts/event, cabecera X-API-KEY). La key es la de ingesta
# (rol webhook) de Alertmanager y la trae el ExternalSecret argocd/notifications-externalsecret.yaml
# (por eso el chart no crea el Secret). `fingerprint` en hex: el despacho a Aurora quita todo lo que no
# sea hex. Solo dos triggers, suscritos por defecto para todas las apps.
notifications:
  secret:
    create: false
  notifiers:
    service.webhook.keep: |
      url: http://keep-backend.monitoring.svc.cluster.local:8080
      headers:
        - name: Content-Type
          value: application/json
        - name: X-API-KEY
          value: $keep-api-key
    # SC-2958·D7: sincronizaciones correctas hacia el gateway de Synapse (Service interno, no la URL pública).
    # La cabecera es la que lee el proveedor `argocd` del gateway (X-Synapse-ArgoCD-Token).
    service.webhook.synapse: |
      url: http://synapse-gateway.synapse.svc.cluster.local:18790/webhooks/argocd
      headers:
        - name: Content-Type
          value: application/json
        - name: X-Synapse-ArgoCD-Token
          value: $synapse-argocd-token
  templates:
    # SC-2958·D7: el adaptador lee `repo`/`repos` (fuente única o multi-source) y `revisions`; `revision` sale vacía en multi-source.
    template.synapse-deployed: |
      webhook:
        synapse:
          method: POST
          body: |
            {"app": {{ .app.metadata.name | toJson }},
             "repo": {{ with .app.spec.source }}{{ .repoURL | toJson }}{{ else }}""{{ end }},
             "repos": [{{ range $i, $s := .app.spec.sources }}{{ if $i }}, {{ end }}{{ $s.repoURL | toJson }}{{ end }}],
             "revision": {{ .app.status.sync.revision | toJson }},
             "revisions": {{ .app.status.sync.revisions | toJson }},
             "finishedAt": {{ .app.status.operationState.finishedAt | toJson }}}
    template.keep-sync-failed: |
      webhook:
        keep:
          method: POST
          path: /alerts/event
          body: |
            {"name": "ArgoCDSyncFailed",
             "fingerprint": {{ printf "argocd/%s/sync-failed" .app.metadata.name | sha256sum | trunc 16 | toJson }},
             "status": "firing", "severity": "warning", "source": ["argocd"],
             "app": {{ .app.metadata.name | toJson }},
             "labels": {"app": {{ .app.metadata.name | toJson }}, "sync": {{ .app.status.sync.status | toJson }}, "health": {{ .app.status.health.status | toJson }},
                        "repo": {{ with .app.spec.source }}{{ .repoURL | toJson }}{{ else }}"multi-source"{{ end }}, "revision": {{ .app.status.sync.revision | toJson }}},
             "url": {{ printf "%s/applications/%s" .context.argocdUrl .app.metadata.name | toJson }},
             "description": {{ printf "Sync fallido de %s: %s" .app.metadata.name .app.status.operationState.message | toJson }}}
    template.keep-health-degraded: |
      webhook:
        keep:
          method: POST
          path: /alerts/event
          body: |
            {"name": "ArgoCDAppDegraded",
             "fingerprint": {{ printf "argocd/%s/degraded" .app.metadata.name | sha256sum | trunc 16 | toJson }},
             "status": "firing", "severity": "warning", "source": ["argocd"],
             "app": {{ .app.metadata.name | toJson }},
             "labels": {"app": {{ .app.metadata.name | toJson }}, "sync": {{ .app.status.sync.status | toJson }}, "health": {{ .app.status.health.status | toJson }},
                        "repo": {{ with .app.spec.source }}{{ .repoURL | toJson }}{{ else }}"multi-source"{{ end }}, "revision": {{ .app.status.sync.revision | toJson }}},
             "url": {{ printf "%s/applications/%s" .context.argocdUrl .app.metadata.name | toJson }},
             "description": {{ printf "%s Degraded: %s" .app.metadata.name .app.status.health.message | toJson }}}
  triggers:
    trigger.on-sync-failed: |
      - description: El sync de la app ha fallado
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        send: [keep-sync-failed]
    trigger.on-health-degraded: |
      - description: La app está Degraded
        when: app.status.health.status == 'Degraded'
        send: [keep-health-degraded]
    # SC-2958·D7: sync correcto con salud Healthy. `oncePer` cubre `revision` y `revisions`: en multi-source `revision` sale vacía
    # y el dedup de notifications-engine (state.go:27) usaría una clave vacía. `?? ""` evita el "<nil>" de fmt (service.go:99).
    trigger.on-deployed: |
      - description: Sincronización correcta y app Healthy
        when: app.status.operationState != nil and app.status.operationState.phase == 'Succeeded' and app.status.health.status == 'Healthy'
        oncePer: (app.status.sync.revision ?? "") + join(app.status.sync.revisions ?? [], ",")
        send: [synapse-deployed]
  subscriptions:
    - recipients: [keep]
      triggers: [on-sync-failed, on-health-degraded]
    - recipients: [synapse]
      triggers: [on-deployed]
