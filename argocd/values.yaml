# ArgoCD — single-replica homelab install
global:
  domain: argocd.e-dani.com
  # Pin the control plane to the ks5-nvme pool (ks5-cp-1/2/3): untainted, NVMe-backed.
  # A single-hostname pin is unsafe here — the chart merges global.nodeSelector with the
  # live objects' existing keys, so hostname + node-pool intersect to zero nodes.
  nodeSelector:
    node-pool: ks5-nvme

dex:
  enabled: false   # SSO via Authelia ForwardAuth

configs:
  params:
    server.insecure: "true"   # TLS termination at Traefik
  cm:
    application.instanceLabelKey: argocd.argoproj.io/instance
    timeout.reconciliation: 60s
    statusbadge.enabled: "true"

server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false   # we use Traefik IngressRoute below

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

redis:
  enabled: true
  # Pinned to Harbor mirror (Kyverno restrict-image-registries):
  # mirrored from ecr-public.aws.com/docker/library/redis:8.2.3-alpine
  image:
    repository: harbor.lan.e-dani.com/homelab/redis
    tag: 8.2.3-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

controller:
  replicas: 1
  metrics:
    enabled: true
  resources:
    requests:
      # 2026-08-15: 100m -> 400m. Pedia 100m con un p95 de 825m y picos de
      # 287m en reposo: el scheduler no veia su peso en nodos al 92-98% de
      # requests. Sin cpu limit, como estaba.
      # 2026-09-13 (INFRA-42): 400m -> 800m. p95 14d 843m (medicion sre,
      # comentario 12299 en INFRA-42): seguia infra-dotado. Subida EN SITIO
      # en ks5-cp-3: moverlo desplazaría 843m de uso real a un cp-1 que ya
      # pinó 5934m reales.
      cpu: 800m
      memory: 256Mi
    limits:
      memory: 2Gi

# 29-09-2026 (Dani): ArgoCD avisa DIRECTO al empleado SRE/DevOps de Hermes (perfil sre-devops, topic 2182
# de «github pocharlies-org») cuando un sync falla o una app se degrada. Sin poller en medio (ops-watch
# retirado del x86). Hermes autentica la ruta por la cabecera X-Gitlab-Token = secreto de sus rutas
# webhook; el valor lo trae el ExternalSecret argocd/notifications-externalsecret.yaml (por eso el chart no crea
# el Secret). Solo dos triggers, suscritos por defecto para todas las apps.
notifications:
  secret:
    create: false
  notifiers:
    service.webhook.hermes: |
      url: http://hermes-webhook.hermes.svc.cluster.local:8644
      headers:
        - name: Content-Type
          value: application/json
        - name: X-Gitlab-Token
          value: $hermes-webhook-token
  templates:
    template.hermes-sync-failed: |
      webhook:
        hermes:
          method: POST
          path: /p/sre-devops/webhooks/argocd
          body: |
            {"event_type": "argocd", "trigger": "on-sync-failed", "app": {{ .app.metadata.name | toJson }},
             "sync": {{ .app.status.sync.status | toJson }}, "health": {{ .app.status.health.status | toJson }},
             "message": {{ .app.status.operationState.message | toJson }},
             "repo": {{ with .app.spec.source }}{{ .repoURL | toJson }}{{ else }}"multi-source"{{ end }}, "revision": {{ .app.status.sync.revision | toJson }}}
    template.hermes-health-degraded: |
      webhook:
        hermes:
          method: POST
          path: /p/sre-devops/webhooks/argocd
          body: |
            {"event_type": "argocd", "trigger": "on-health-degraded", "app": {{ .app.metadata.name | toJson }},
             "sync": {{ .app.status.sync.status | toJson }}, "health": {{ .app.status.health.status | toJson }},
             "message": {{ .app.status.health.message | toJson }},
             "repo": {{ with .app.spec.source }}{{ .repoURL | toJson }}{{ else }}"multi-source"{{ end }}, "revision": {{ .app.status.sync.revision | toJson }}}
  triggers:
    trigger.on-sync-failed: |
      - description: El sync de la app ha fallado
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        send: [hermes-sync-failed]
    trigger.on-health-degraded: |
      - description: La app está Degraded
        when: app.status.health.status == 'Degraded'
        send: [hermes-health-degraded]
  subscriptions:
    - recipients: [hermes]
      triggers: [on-sync-failed, on-health-degraded]
