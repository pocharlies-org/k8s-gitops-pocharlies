apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-operation-executor
  namespace: argocd
  labels:
    app.kubernetes.io/name: openclaw-qwen36
    app.kubernetes.io/component: deployment-safety
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-operation-executor
  namespace: argocd
  labels:
    app.kubernetes.io/name: openclaw-qwen36
    app.kubernetes.io/component: deployment-safety
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    # 20-08-2026: entra openclaw-synapse. Su sync manual sancionado es el mismo
    # .operation explicito (test_openclaw_synapse_manual_sync.py) y lo lanza el
    # ejecutor scripts/execute_openclaw_synapse_manual_sync.sh con ESTA identidad
    # dedicada en vez del kubeconfig admin. El gate de admision no cambia: todas
    # sus reglas eximen a cualquier Application que no sea openclaw-qwen36.
    resourceNames: ["openclaw-qwen36", "openclaw-synapse"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-operation-executor
  namespace: argocd
  labels:
    app.kubernetes.io/name: openclaw-qwen36
    app.kubernetes.io/component: deployment-safety
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-operation-executor
subjects:
  - kind: ServiceAccount
    name: openclaw-operation-executor
    namespace: argocd
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openclaw-operation-state-writer-gate
  labels:
    app.kubernetes.io/name: openclaw-qwen36
    app.kubernetes.io/component: deployment-safety
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - argoproj.io
        apiVersions:
          - v1alpha1
        operations:
          - UPDATE
        resources:
          - applications
        scope: Namespaced
  validations:
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-qwen36'
        || (
          has(object.metadata.annotations)
          && 'operations.pocharlies.org/state-writer-lease' in object.metadata.annotations
          && (
            (
              object.metadata.annotations['operations.pocharlies.org/state-writer-lease'] == 'inactive'
              && !('operations.pocharlies.org/approved-revision' in object.metadata.annotations)
              && !('operations.pocharlies.org/approval-id' in object.metadata.annotations)
              && !('operations.pocharlies.org/approval-sequence' in object.metadata.annotations)
              && !('operations.pocharlies.org/approved-prune' in object.metadata.annotations)
            )
            || (
              object.metadata.annotations['operations.pocharlies.org/state-writer-lease'] == 'active'
              && 'operations.pocharlies.org/approved-revision' in object.metadata.annotations
              && object.metadata.annotations['operations.pocharlies.org/approved-revision'].matches('^[0-9a-f]{40}$')
              && 'operations.pocharlies.org/approval-id' in object.metadata.annotations
              && object.metadata.annotations['operations.pocharlies.org/approval-id'].matches('^[a-z0-9][a-z0-9-]{7,63}$')
              && 'operations.pocharlies.org/approval-sequence' in object.metadata.annotations
              && object.metadata.annotations['operations.pocharlies.org/approval-sequence'].matches('^[0-9]{14}$')
              && 'operations.pocharlies.org/approved-prune' in object.metadata.annotations
              && object.metadata.annotations['operations.pocharlies.org/approved-prune'] in ['true', 'false']
            )
          )
        )
      message: >-
        The OpenClaw writer lease must be inactive without stale approvals, or
        active with a reviewed revision, approval id, monotonic UTC sequence,
        and prune decision.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-qwen36'
        || request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller'
        || object.spec == oldObject.spec
      message: >-
        Only the Argo CD application controller may change the OpenClaw
        Application spec from reviewed GitOps.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-qwen36'
        || request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller'
        || (
          has(object.metadata.annotations) == has(oldObject.metadata.annotations)
          && (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations)
          && has(object.metadata.labels) == has(oldObject.metadata.labels)
          && (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels)
          && has(object.metadata.finalizers) == has(oldObject.metadata.finalizers)
          && (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers)
          && has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences)
          && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)
          && has(object.metadata.generateName) == has(oldObject.metadata.generateName)
          && (!has(object.metadata.generateName) || object.metadata.generateName == oldObject.metadata.generateName)
        )
      message: >-
        Only the Argo CD application controller may change OpenClaw annotations,
        labels, finalizers, or owner references from reviewed GitOps.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-qwen36'
        || request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller'
        || (
          has(object.status) == has(oldObject.status)
          && (!has(object.status) || object.status == oldObject.status)
        )
        || (
          request.userInfo.username == 'system:serviceaccount:argocd:argocd-server'
          && has(oldObject.status)
          && has(oldObject.status.operationState)
          && oldObject.status.operationState.phase == 'Running'
          && has(object.status)
          && has(object.status.operationState)
          && object.status.operationState.phase == 'Terminating'
          && has(object.status.conditions) == has(oldObject.status.conditions)
          && (!has(object.status.conditions) || object.status.conditions == oldObject.status.conditions)
          && has(object.status.controllerNamespace) == has(oldObject.status.controllerNamespace)
          && (!has(object.status.controllerNamespace) || object.status.controllerNamespace == oldObject.status.controllerNamespace)
          && has(object.status.health) == has(oldObject.status.health)
          && (!has(object.status.health) || object.status.health == oldObject.status.health)
          && has(object.status.history) == has(oldObject.status.history)
          && (!has(object.status.history) || object.status.history == oldObject.status.history)
          && has(object.status.observedAt) == has(oldObject.status.observedAt)
          && (!has(object.status.observedAt) || object.status.observedAt == oldObject.status.observedAt)
          && has(object.status.reconciledAt) == has(oldObject.status.reconciledAt)
          && (!has(object.status.reconciledAt) || object.status.reconciledAt == oldObject.status.reconciledAt)
          && has(object.status.resourceHealthSource) == has(oldObject.status.resourceHealthSource)
          && (!has(object.status.resourceHealthSource) || object.status.resourceHealthSource == oldObject.status.resourceHealthSource)
          && has(object.status.resources) == has(oldObject.status.resources)
          && (!has(object.status.resources) || object.status.resources == oldObject.status.resources)
          && has(object.status.sourceHydrator) == has(oldObject.status.sourceHydrator)
          && (!has(object.status.sourceHydrator) || object.status.sourceHydrator == oldObject.status.sourceHydrator)
          && has(object.status.sourceType) == has(oldObject.status.sourceType)
          && (!has(object.status.sourceType) || object.status.sourceType == oldObject.status.sourceType)
          && has(object.status.sourceTypes) == has(oldObject.status.sourceTypes)
          && (!has(object.status.sourceTypes) || object.status.sourceTypes == oldObject.status.sourceTypes)
          && has(object.status.summary) == has(oldObject.status.summary)
          && (!has(object.status.summary) || object.status.summary == oldObject.status.summary)
          && has(object.status.sync) == has(oldObject.status.sync)
          && (!has(object.status.sync) || object.status.sync == oldObject.status.sync)
          && has(object.status.operationState.finishedAt) == has(oldObject.status.operationState.finishedAt)
          && (!has(object.status.operationState.finishedAt) || object.status.operationState.finishedAt == oldObject.status.operationState.finishedAt)
          && has(object.status.operationState.message) == has(oldObject.status.operationState.message)
          && (!has(object.status.operationState.message) || object.status.operationState.message == oldObject.status.operationState.message)
          && has(object.status.operationState.operation) == has(oldObject.status.operationState.operation)
          && (!has(object.status.operationState.operation) || object.status.operationState.operation == oldObject.status.operationState.operation)
          && has(object.status.operationState.retryCount) == has(oldObject.status.operationState.retryCount)
          && (!has(object.status.operationState.retryCount) || object.status.operationState.retryCount == oldObject.status.operationState.retryCount)
          && has(object.status.operationState.startedAt) == has(oldObject.status.operationState.startedAt)
          && (!has(object.status.operationState.startedAt) || object.status.operationState.startedAt == oldObject.status.operationState.startedAt)
          && has(object.status.operationState.syncResult) == has(oldObject.status.operationState.syncResult)
          && (!has(object.status.operationState.syncResult) || object.status.operationState.syncResult == oldObject.status.operationState.syncResult)
        )
        || (
          request.userInfo.username == 'system:serviceaccount:argocd:openclaw-operation-executor'
          && !has(oldObject.operation)
          && has(object.operation)
          && has(oldObject.status)
          && has(oldObject.status.operationState)
          && oldObject.status.operationState.phase in ['Succeeded', 'Failed', 'Error']
          && has(object.status)
          && !has(object.status.operationState)
          && has(object.status.conditions) == has(oldObject.status.conditions)
          && (!has(object.status.conditions) || object.status.conditions == oldObject.status.conditions)
          && has(object.status.controllerNamespace) == has(oldObject.status.controllerNamespace)
          && (!has(object.status.controllerNamespace) || object.status.controllerNamespace == oldObject.status.controllerNamespace)
          && has(object.status.health) == has(oldObject.status.health)
          && (!has(object.status.health) || object.status.health == oldObject.status.health)
          && has(object.status.history) == has(oldObject.status.history)
          && (!has(object.status.history) || object.status.history == oldObject.status.history)
          && has(object.status.observedAt) == has(oldObject.status.observedAt)
          && (!has(object.status.observedAt) || object.status.observedAt == oldObject.status.observedAt)
          && has(object.status.reconciledAt) == has(oldObject.status.reconciledAt)
          && (!has(object.status.reconciledAt) || object.status.reconciledAt == oldObject.status.reconciledAt)
          && has(object.status.resourceHealthSource) == has(oldObject.status.resourceHealthSource)
          && (!has(object.status.resourceHealthSource) || object.status.resourceHealthSource == oldObject.status.resourceHealthSource)
          && has(object.status.resources) == has(oldObject.status.resources)
          && (!has(object.status.resources) || object.status.resources == oldObject.status.resources)
          && has(object.status.sourceHydrator) == has(oldObject.status.sourceHydrator)
          && (!has(object.status.sourceHydrator) || object.status.sourceHydrator == oldObject.status.sourceHydrator)
          && has(object.status.sourceType) == has(oldObject.status.sourceType)
          && (!has(object.status.sourceType) || object.status.sourceType == oldObject.status.sourceType)
          && has(object.status.sourceTypes) == has(oldObject.status.sourceTypes)
          && (!has(object.status.sourceTypes) || object.status.sourceTypes == oldObject.status.sourceTypes)
          && has(object.status.summary) == has(oldObject.status.summary)
          && (!has(object.status.summary) || object.status.summary == oldObject.status.summary)
          && has(object.status.sync) == has(oldObject.status.sync)
          && (!has(object.status.sync) || object.status.sync == oldObject.status.sync)
        )
      message: >-
        Only the Argo CD application controller may change the trusted OpenClaw
        status, except for the Argo server's strict Running-to-Terminating path
        and the executor's atomic removal of one terminal operationState while
        consuming a reviewed approval with every other status field unchanged.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-qwen36'
        || !has(object.operation)
        || has(oldObject.operation)
        || request.userInfo.username == 'system:serviceaccount:argocd:openclaw-operation-executor'
      message: >-
        Only the dedicated short-lived OpenClaw operation executor may consume
        a reviewed approval.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-qwen36'
        || !has(object.operation)
        || has(oldObject.operation)
        || (
          request.userInfo.username == 'system:serviceaccount:argocd:openclaw-operation-executor'
          && (
            !has(oldObject.status)
            || !has(oldObject.status.operationState)
            || (
              oldObject.status.operationState.phase in ['Succeeded', 'Failed', 'Error']
              && has(object.status)
              && !has(object.status.operationState)
            )
          )
        )
      message: >-
        A reviewed OpenClaw operation must atomically clear any previous
        terminal operationState; Running and Terminating state must never be
        cleared or replaced by the executor.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-qwen36'
        || !has(object.operation)
        || (
          has(object.operation.sync)
          && has(object.operation.sync.revision)
          && has(object.operation.sync.prune)
          && !has(object.operation.sync.autoHealAttemptsCount)
          && !has(object.operation.sync.dryRun)
          && !has(object.operation.sync.manifests)
          && !has(object.operation.sync.resources)
          && !has(object.operation.sync.revisions)
          && !has(object.operation.sync.source)
          && !has(object.operation.sync.sources)
          && !has(object.operation.sync.syncStrategy)
          && !has(object.operation.retry)
          && has(oldObject.spec.syncPolicy)
          && has(oldObject.spec.syncPolicy.syncOptions)
          && has(object.operation.sync.syncOptions)
          && object.operation.sync.syncOptions == oldObject.spec.syncPolicy.syncOptions
          && object.operation.sync.revision == object.metadata.annotations['operations.pocharlies.org/approved-revision']
          && has(object.operation.info)
          && object.operation.info.size() == 2
          && object.operation.info.filter(item,
            item.name == 'approval-id'
            && item.value == object.metadata.annotations['operations.pocharlies.org/approval-id']
          ).size() == 1
          && object.operation.info.filter(item,
            item.name == 'approval-sequence'
            && item.value == object.metadata.annotations['operations.pocharlies.org/approval-sequence']
          ).size() == 1
          && object.metadata.annotations['operations.pocharlies.org/approved-prune'] == (
            object.operation.sync.prune ? 'true' : 'false'
          )
        )
      message: >-
        OpenClaw operations must use only the exact GitOps-approved commit,
        approval id/sequence, and explicit prune decision; source/manifests
        overrides, selective sync, custom sync strategies,
        retry policies, and sync options differing from GitOps are forbidden.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-qwen36'
        || request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller'
        || !has(oldObject.operation)
        || (
          request.userInfo.username == 'system:serviceaccount:argocd:argocd-server'
          && has(object.operation)
          && object.operation == oldObject.operation
          && has(oldObject.status)
          && has(oldObject.status.operationState)
          && oldObject.status.operationState.phase == 'Running'
          && has(object.status)
          && has(object.status.operationState)
          && object.status.operationState.phase == 'Terminating'
        )
      message: >-
        While an OpenClaw operation is in flight, only the Argo CD application
        controller may update it; the Argo server may only request the strict
        Running-to-Terminating transition.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-qwen36'
        || !has(object.operation)
        || has(oldObject.operation)
        || !(
          has(oldObject.status)
          && has(oldObject.status.operationState)
          && has(oldObject.status.operationState.operation.info)
          && oldObject.status.operationState.operation.info.exists(item,
            item.name == 'approval-sequence'
            && (
              !item.value.matches('^[0-9]{14}$')
              || int(object.metadata.annotations['operations.pocharlies.org/approval-sequence']) <= int(item.value)
            )
          )
        )
      message: >-
        The approval sequence must be a strictly newer UTC value than the last
        consumed OpenClaw operation sequence.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openclaw-operation-state-writer-gate
  labels:
    app.kubernetes.io/name: openclaw-qwen36
    app.kubernetes.io/component: deployment-safety
spec:
  policyName: openclaw-operation-state-writer-gate
  validationActions:
    - Deny
---
# openclaw-synapse remains independent from the qwen36 approval bundle. This
# policy only confines the shared short-lived executor identity to the exact
# manual sync operation shape; Argo CD controllers remain unaffected.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openclaw-synapse-manual-sync-executor-gate
  labels:
    app.kubernetes.io/name: openclaw-synapse
    app.kubernetes.io/component: deployment-safety
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - argoproj.io
        apiVersions:
          - v1alpha1
        operations:
          - UPDATE
        resources:
          - applications
        scope: Namespaced
  validations:
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-synapse'
        || request.userInfo.username != 'system:serviceaccount:argocd:openclaw-operation-executor'
        || object.spec == oldObject.spec
      message: The Synapse manual sync executor may not change the Application spec.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-synapse'
        || request.userInfo.username != 'system:serviceaccount:argocd:openclaw-operation-executor'
        || (
          has(object.metadata.annotations) == has(oldObject.metadata.annotations)
          && (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations)
          && has(object.metadata.labels) == has(oldObject.metadata.labels)
          && (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels)
          && has(object.metadata.finalizers) == has(oldObject.metadata.finalizers)
          && (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers)
          && has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences)
          && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)
          && has(object.metadata.generateName) == has(oldObject.metadata.generateName)
          && (!has(object.metadata.generateName) || object.metadata.generateName == oldObject.metadata.generateName)
        )
      message: The Synapse manual sync executor may not change Application metadata.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-synapse'
        || request.userInfo.username != 'system:serviceaccount:argocd:openclaw-operation-executor'
        || (
          has(oldObject.status) == has(object.status)
          && (!has(oldObject.status) || (
            has(oldObject.status.conditions) == has(object.status.conditions)
            && (!has(oldObject.status.conditions) || oldObject.status.conditions == object.status.conditions)
            && has(oldObject.status.controllerNamespace) == has(object.status.controllerNamespace)
            && (!has(oldObject.status.controllerNamespace) || oldObject.status.controllerNamespace == object.status.controllerNamespace)
            && has(oldObject.status.health) == has(object.status.health)
            && (!has(oldObject.status.health) || oldObject.status.health == object.status.health)
            && has(oldObject.status.history) == has(object.status.history)
            && (!has(oldObject.status.history) || oldObject.status.history == object.status.history)
            && has(oldObject.status.observedAt) == has(object.status.observedAt)
            && (!has(oldObject.status.observedAt) || oldObject.status.observedAt == object.status.observedAt)
            && has(oldObject.status.reconciledAt) == has(object.status.reconciledAt)
            && (!has(oldObject.status.reconciledAt) || oldObject.status.reconciledAt == object.status.reconciledAt)
            && has(oldObject.status.resourceHealthSource) == has(object.status.resourceHealthSource)
            && (!has(oldObject.status.resourceHealthSource) || oldObject.status.resourceHealthSource == object.status.resourceHealthSource)
            && has(oldObject.status.resources) == has(object.status.resources)
            && (!has(oldObject.status.resources) || oldObject.status.resources == object.status.resources)
            && has(oldObject.status.sourceHydrator) == has(object.status.sourceHydrator)
            && (!has(oldObject.status.sourceHydrator) || oldObject.status.sourceHydrator == object.status.sourceHydrator)
            && has(oldObject.status.sourceType) == has(object.status.sourceType)
            && (!has(oldObject.status.sourceType) || oldObject.status.sourceType == object.status.sourceType)
            && has(oldObject.status.sourceTypes) == has(object.status.sourceTypes)
            && (!has(oldObject.status.sourceTypes) || oldObject.status.sourceTypes == object.status.sourceTypes)
            && has(oldObject.status.summary) == has(object.status.summary)
            && (!has(oldObject.status.summary) || oldObject.status.summary == object.status.summary)
            && has(oldObject.status.sync) == has(object.status.sync)
            && (!has(oldObject.status.sync) || oldObject.status.sync == object.status.sync)
            && (
              has(oldObject.status.operationState) == has(object.status.operationState)
              && (!has(oldObject.status.operationState) || oldObject.status.operationState == object.status.operationState)
              || (
                has(oldObject.status.operationState)
                && oldObject.status.operationState.phase in ['Succeeded', 'Failed', 'Error']
                && !has(object.status.operationState)
              )
            )
          ))
        )
      message: >-
        The Synapse manual sync executor may only remove one terminal
        operationState while leaving every other status field unchanged.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-synapse'
        || request.userInfo.username != 'system:serviceaccount:argocd:openclaw-operation-executor'
        || (
          !has(oldObject.operation)
          && has(object.operation)
          && has(object.operation.initiatedBy)
          && !has(object.operation.initiatedBy.username)
          && !has(object.operation.initiatedBy.automated)
          && has(object.operation.info)
          && object.operation.info.size() == 1
          && object.operation.info[0].name == 'reason'
          && object.operation.info[0].value.matches('.*[^[:space:]].*')
          && has(object.operation.sync)
          && has(object.operation.sync.revision)
          && object.operation.sync.revision.matches('^[0-9a-f]{40}$')
          && has(object.operation.sync.syncOptions)
          && object.operation.sync.syncOptions == ['CreateNamespace=true', 'ServerSideApply=true']
          && !has(object.operation.sync.prune)
          && !has(object.operation.sync.autoHealAttemptsCount)
          && !has(object.operation.sync.dryRun)
          && !has(object.operation.sync.manifests)
          && !has(object.operation.sync.resources)
          && !has(object.operation.sync.revisions)
          && !has(object.operation.sync.source)
          && !has(object.operation.sync.sources)
          && !has(object.operation.sync.syncStrategy)
          && has(object.operation.retry)
          && !has(object.operation.retry.backoff)
          && !has(object.operation.retry.limit)
          && !has(object.operation.retry.refresh)
        )
      message: >-
        The Synapse executor may only create the fixed-scope full sync operation
        with a commit revision, one reason, standard sync options, and no prune,
        force, selective resources, source override, or retry policy.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openclaw-synapse-manual-sync-executor-gate
  labels:
    app.kubernetes.io/name: openclaw-synapse
    app.kubernetes.io/component: deployment-safety
spec:
  policyName: openclaw-synapse-manual-sync-executor-gate
  validationActions:
    - Deny
---
# This gate intentionally covers every Deployment in the dedicated production
# namespace, including future chart components. Workload names/labels are not a
# safe ownership boundary for DELETE, generated-name CREATE or /scale requests.
# deployments/status is deliberately absent so Kubernetes controllers can keep
# reconciling status without acquiring a production write exception.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openclaw-runtime-deployment-write-gate
  labels:
    app.kubernetes.io/name: openclaw-qwen36
    app.kubernetes.io/component: deployment-safety
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - deployments
          - deployments/scale
        scope: Namespaced
  matchConditions:
    - name: production-openclaw-namespace-only
      expression: request.namespace == 'openclaw-qwen36'
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:argocd:argocd-application-controller'
      message: >-
        Direct writes to production OpenClaw Deployments, including rollout
        restart and scale, are denied; use reviewed GitOps through Argo CD.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openclaw-runtime-deployment-write-gate
  labels:
    app.kubernetes.io/name: openclaw-qwen36
    app.kubernetes.io/component: deployment-safety
spec:
  policyName: openclaw-runtime-deployment-write-gate
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openclaw-qwen36
  validationActions:
    - Deny
    - Audit
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openclaw-application-delete-gate
  labels:
    app.kubernetes.io/name: openclaw-qwen36
    app.kubernetes.io/component: deployment-safety
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - argoproj.io
        apiVersions:
          - v1alpha1
        operations:
          - DELETE
        resources:
          - applications
        scope: Namespaced
  validations:
    - expression: >-
        oldObject.metadata.namespace != 'argocd'
        || oldObject.metadata.name != 'openclaw-qwen36'
        || request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller'
      message: >-
        Only the root GitOps application controller may delete the protected
        OpenClaw Application.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openclaw-application-delete-gate
  labels:
    app.kubernetes.io/name: openclaw-qwen36
    app.kubernetes.io/component: deployment-safety
spec:
  policyName: openclaw-application-delete-gate
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openclaw-application-create-gate
  labels:
    app.kubernetes.io/name: openclaw-qwen36
    app.kubernetes.io/component: deployment-safety
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - argoproj.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
        resources:
          - applications
        scope: Namespaced
  validations:
    - expression: >-
        object.metadata.namespace != 'argocd'
        || object.metadata.name != 'openclaw-qwen36'
        || request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller'
      message: >-
        Only the root GitOps application controller may create the protected
        OpenClaw Application.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openclaw-application-create-gate
  labels:
    app.kubernetes.io/name: openclaw-qwen36
    app.kubernetes.io/component: deployment-safety
spec:
  policyName: openclaw-application-create-gate
  validationActions:
    - Deny
