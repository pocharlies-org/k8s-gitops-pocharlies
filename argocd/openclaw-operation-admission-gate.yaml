      - apiGroups:
          - argoproj.io
        apiVersions:
          - v1alpha1
        operations:
          - DELETE
        resources:
          - applications
        scope: Namespaced
  validations:
    - expression: >-
        oldObject.metadata.namespace != 'argocd'
        || oldObject.metadata.name != 'openclaw-qwen36'
        || request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller'
      message: >-
        Only the root GitOps application controller may delete the protected
        OpenClaw Application.
      reason: Forbidden
