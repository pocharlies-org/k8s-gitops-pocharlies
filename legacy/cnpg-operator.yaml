apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    # Apply only after every node is healthy on Kubernetes 1.34. Chart 0.29.0
    # ships CNPG 1.30.0, which supports Kubernetes 1.34-1.36 and must be green
    # before the K3s 1.35 hop.
    targetRevision: 0.29.0
    helm:
      releaseName: cnpg
      values: |
        replicaCount: 2
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
        config:
          create: true
          data:
            CLUSTERS_ROLLOUT_DELAY: "300"
            INSTANCES_ROLLOUT_DELAY: "120"
        monitoring:
          podMonitorEnabled: false
          grafanaDashboard:
            create: false
        nodeSelector:
          node-pool: ks5-nvme
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cloudnative-pg
                    app.kubernetes.io/instance: cnpg
                topologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 1
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
