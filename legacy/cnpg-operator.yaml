apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    # Chart 0.28.3 ships CloudNativePG 1.29.1. This is the newest official
    # chart whose operator officially supports Kubernetes 1.33. Chart 0.29.0
    # ships CNPG 1.30, for which Kubernetes 1.33 is tested but not supported.
    targetRevision: 0.28.3
    helm:
      releaseName: cnpg
      values: |
        replicaCount: 2
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
        config:
          create: true
          data:
            CLUSTERS_ROLLOUT_DELAY: "300"
            INSTANCES_ROLLOUT_DELAY: "120"
        monitoring:
          podMonitorEnabled: false
          grafanaDashboard:
            create: false
        nodeSelector:
          node-pool: ks5-nvme
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cloudnative-pg
                    app.kubernetes.io/instance: cnpg
                topologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 1
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
