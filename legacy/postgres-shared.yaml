# Shared PostgreSQL source. This Application keeps the live
# databases/postgres-shared cluster owned by the split GitOps repos.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-shared
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-infra-pocharlies
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-infra-pocharlies
    targetRevision: main
    path: databases/postgres-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
